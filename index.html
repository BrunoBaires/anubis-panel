let umbralHecho = 0.30;
let hechosCache = null;

function renderAgenda() {
  const posts = seleccion();
  const cuentas = cuentasDe(posts);
  const ref = cuentas.find(c => c.rol === 'propia');
  const clasificados = posts.filter(p => p.ia).length;

  let h = `<h2 class="seccion">Temas y agenda</h2>`;

  if (!clasificados) {
    h += `<p class="explica">Todavía ninguna publicación está clasificada. El modelo económico lee cada texto
      y le pone tema, entidades y registro. Eso es lo que permite agrupar por hecho y responder qué cubrió
      la competencia que vos no.</p>`;
    h += panelClasificar(posts.length, 0);
    $('#vAgenda').innerHTML = h;
    engancharClasificar();
    return;
  }

  h += panelClasificar(posts.length, clasificados);

  // ---- distribución y rendimiento por tema -------------------------
  // Cada cuenta se cuenta por separado. Un gráfico con la suma de todas se lee
  // como si describiera a una sola: el subtítulo dice "todas las cuentas" pero
  // el resto de la página se desglosa por cuenta, y el ojo lee lo que espera.
  const clasif = posts.filter(p => p.ia);
  const porCuentaTema = new Map();   // handle -> { tema -> {n, reac} }
  const totalTema = {};
  const ordenTemas = [];
  for (const p of clasif) {
    const t = p.ia.tema, hd = p.cuenta_monitoreada;
    const reac = SENALES.reduce((s, x) => s + (metrica(p, x.k) || 0), 0);
    if (!porCuentaTema.has(hd)) porCuentaTema.set(hd, {});
    const m = porCuentaTema.get(hd);
    if (!m[t]) m[t] = { n: 0, reac: 0 };
    m[t].n++; m[t].reac += reac;
    if (!totalTema[t]) { totalTema[t] = { n: 0, reac: 0 }; ordenTemas.push(t); }
    totalTema[t].n++; totalTema[t].reac += reac;
  }
  ordenTemas.sort((a, b) => totalTema[b].n - totalTema[a].n);
  const conDatos = cuentas.filter(c => porCuentaTema.has(c.handle));

  const foco = ref || conDatos[0];
  const mFoco = foco ? porCuentaTema.get(foco.handle) : {};
  const nFoco = Object.values(mFoco).reduce((s, d) => s + d.n, 0);
  const nMerc = clasif.length;
  const listaCuentas = conDatos.map(c => '@' + c.handle).join(', ');

  h += `<h2 class="seccion">Qué se publicó</h2>
    <p class="explica">Las dos lecturas en paralelo. A la izquierda, <strong>el mercado entero</strong>:
    las ${conDatos.length} cuentas sumadas, que es la agenda del día tal como le llega a un lector cualquiera.
    A la derecha, <strong>${foco ? '@' + escapar(foco.handle) + ' solo' : 'la cuenta de referencia'}</strong>.
    Ningún número de una tarjeta aparece en la otra: son conjuntos distintos.</p>`;

  h += `<div class="par">`;
  h += tarjeta('Todos los medios juntos',
    `${fmt(nMerc)} publicaciones de ${conDatos.length} cuentas: ${escapar(listaCuentas)}`,
    barras(ordenTemas.map(t => ({
      et: t, v: totalTema[t].n, vt: fmt(totalTema[t].n),
      v2: Math.round(100 * totalTema[t].n / nMerc) + '%', color: 'var(--neutro)',
      tip: `Mercado — ${t}: <b>${fmt(totalTema[t].n)}</b> de ${fmt(nMerc)} publicaciones, ` +
           `sumando las ${conDatos.length} cuentas`
    })), { titulo: 'Temas del mercado' }),
    tablaHTML(['Tema', 'Publicaciones', '% del mercado'],
      ordenTemas.map(t => [t, fmt(totalTema[t].n), Math.round(100 * totalTema[t].n / nMerc) + '%'])));

  if (foco) {
    // Cada tarjeta se ordena por su propio valor. Heredar el orden del mercado
    // dejaba las barras salteadas y el gráfico se volvía ilegible.
    const temasFoco = ordenTemas.filter(t => mFoco[t]).sort((a, b) => mFoco[b].n - mFoco[a].n);
    h += tarjeta(`Sólo @${foco.handle}`,
      `${fmt(nFoco)} publicaciones · el % es sobre su propio total, no sobre el mercado`,
      barras(temasFoco.map(t => ({
        et: t, v: mFoco[t].n, vt: fmt(mFoco[t].n),
        v2: Math.round(100 * mFoco[t].n / nFoco) + '%', color: foco.color,
        tip: `@${foco.handle} — ${t}: <b>${fmt(mFoco[t].n)}</b> de ${fmt(nFoco)} publicaciones propias.` +
             `<br>El mercado entero publicó ${fmt(totalTema[t].n)} sobre ese tema.`
      })), { titulo: `Temas de @${foco.handle}` }),
      tablaHTML(['Tema', 'Publicaciones', '% de la cuenta', 'Mercado'],
        temasFoco.map(t =>
          [t, fmt(mFoco[t].n), Math.round(100 * mFoco[t].n / nFoco) + '%', fmt(totalTema[t].n)])));
  }
  h += `</div>`;

  h += tarjeta('Las cuentas lado a lado',
    'Publicaciones por tema y por cuenta. La última columna es la suma del mercado', '',
    tablaHTML(['Tema', ...conDatos.map(c => '@' + c.handle), 'Mercado'],
      ordenTemas.map(t => [t, ...conDatos.map(c => {
        const d = porCuentaTema.get(c.handle)[t];
        return d ? fmt(d.n) : '—';
      }), fmt(totalTema[t].n)])));

  // ---- rendimiento por tema ------------------------------------------
  h += `<h2 class="seccion">Qué rindió</h2>
    <p class="explica">Reacciones que consigue una publicación típica de cada tema. Está dividido por la
    cantidad de piezas, así un tema con muchas publicaciones no gana por volumen. Sólo aparecen los temas
    con tres o más piezas: con una o dos, el promedio lo decide un caso suelto. Otra vez las dos lecturas:
    qué rinde en el mercado y qué rinde puertas adentro, que no siempre coinciden.</p>`;

  h += `<div class="par">`;
  const rendMerc = ordenTemas.filter(t => totalTema[t].n >= 3)
    .map(t => ({ et: t, v: totalTema[t].reac / totalTema[t].n, color: 'var(--neutro)',
      vt: fmt(totalTema[t].reac / totalTema[t].n),
      tip: `Mercado — ${t}: <b>${fmt(totalTema[t].reac / totalTema[t].n)}</b> reacciones por publicación ` +
           `sobre ${fmt(totalTema[t].n)} piezas de las ${conDatos.length} cuentas` }))
    .sort((a, b) => b.v - a.v);
  h += tarjeta('Todos los medios juntos',
    'Reacciones por publicación en el conjunto del mercado',
    barras(rendMerc, { titulo: 'Rendimiento del mercado' }),
    tablaHTML(['Tema', 'Reacciones por publicación', 'Piezas'],
      rendMerc.map(f => [f.et, f.vt, fmt(totalTema[f.et].n)])));

  if (foco) {
    const rendFoco = ordenTemas.filter(t => mFoco[t] && mFoco[t].n >= 3)
      .map(t => {
        const v = mFoco[t].reac / mFoco[t].n;
        const mer = totalTema[t].reac / totalTema[t].n;
        return { et: t, v, vt: fmt(v), color: foco.color, v2: 'mercado ' + fmt(mer),
          tip: `@${foco.handle} — ${t}: <b>${fmt(v)}</b> reacciones por publicación ` +
               `sobre ${fmt(mFoco[t].n)} piezas propias.<br>El mercado entero: ${fmt(mer)}.` };
      }).sort((a, b) => b.v - a.v);
    h += tarjeta(`Sólo @${foco.handle}`,
      'Reacciones por publicación de esta cuenta, con el promedio del mercado al lado',
      barras(rendFoco, { titulo: `Rendimiento de @${foco.handle}` }),
      tablaHTML(['Tema', 'Reacciones por publicación', 'Piezas', 'Mercado'],
        rendFoco.map(f => [f.et, f.vt, fmt(mFoco[f.et].n), f.v2.replace('mercado ', '')])));
  }
  h += `</div>`;

  h += tarjeta('El rendimiento lado a lado',
    'Reacciones por publicación, por tema y por cuenta. Un guion significa menos de tres piezas', '',
    tablaHTML(['Tema', ...conDatos.map(c => '@' + c.handle), 'Mercado'],
      ordenTemas.map(t => [t, ...conDatos.map(c => {
        const d = porCuentaTema.get(c.handle)[t];
        return d && d.n >= 3 ? fmt(d.reac / d.n) : '—';
      }), totalTema[t].n >= 3 ? fmt(totalTema[t].reac / totalTema[t].n) : '—'])));

  // ---- hechos -------------------------------------------------------
  const hechos = hechosCache || (hechosCache = construirHechos(posts, umbralHecho));
  const compartidos = hechos.filter(x => x.cuentas.length > 1);

  h += `<h2 class="seccion">La agenda del día</h2>
    <p class="explica">Un <strong>hecho</strong> es un acontecimiento que varias cuentas cubrieron.
    Se agrupan comparando los nombres propios que extrajo el modelo y las palabras poco frecuentes del día.
    El emparejamiento lo hace el código, no un modelo: es exacto y no cuesta nada.</p>
    <div class="selDenom">
      <span class="etq">Exigencia del agrupamiento</span>
      <input type="range" id="umbral" min="15" max="60" value="${Math.round(umbralHecho * 100)}"
        style="width:180px;padding:0">
      <span style="font-size:12px;color:var(--tinta-3)" id="umbralTxt">${Math.round(umbralHecho * 100)}% —
        ${compartidos.length} hechos compartidos de ${hechos.length} grupos</span>
    </div>`;

  h += tarjeta('Hechos que cubrió más de una cuenta', 'Ordenados por cuántas cuentas lo cubrieron',
    '', tablaHechos(compartidos.slice(0, 25), cuentas));

  // ---- huecos y exclusivos ------------------------------------------
  if (ref) {
    const cubreRef = x => x.cuentas.some(c => c.toLowerCase() === ref.handle.toLowerCase());
    const huecos = compartidos.filter(x => !cubreRef(x));
    const exclusivos = hechos.filter(x => x.cuentas.length === 1 && cubreRef(x));

    h += `<h2 class="seccion">Huecos de cobertura</h2>
      <p class="explica">Hechos que cubrieron dos o más cuentas de la comparación y
      <strong>@${escapar(ref.handle)} no</strong>. Es la tabla más accionable de todo el panel:
      cada fila es algo que pasó, que otros contaron y que vos no.</p>`;
    h += tarjeta(`${huecos.length} hueco(s)`, `Sobre ${compartidos.length} hechos compartidos del período`,
      '', huecos.length ? tablaHechos(huecos.slice(0, 25), cuentas)
        : '<p class="explica" style="margin:0">Ningún hecho compartido quedó sin cubrir. Con un solo día esto puede ser suerte.</p>');

    h += `<h2 class="seccion">Solamente @${escapar(ref.handle)}</h2>
      <p class="explica">Publicaciones cuyo asunto no apareció en ninguna otra cuenta. Puede ser una primicia
      o un tema que a nadie más le interesó: las reacciones ayudan a distinguirlo.</p>`;
    const exOrden = exclusivos.sort((a, b) => b.reacciones - a.reacciones).slice(0, 15);
    h += tarjeta(`${exclusivos.length} publicación(es) sin eco`, 'Ordenadas por reacciones',
      '', tablaHechos(exOrden, cuentas));
  }

  // ---- quién llegó primero -------------------------------------------
  if (compartidos.length) {
    const primeros = {};
    for (const x of compartidos) {
      const c = x.primero.cuenta_monitoreada;
      primeros[c] = (primeros[c] || 0) + 1;
    }
    const filas = cuentas.map(c => ({
      et: '@' + c.handle, v: primeros[c.handle] || 0, color: c.color,
      vt: fmt(primeros[c.handle] || 0),
      v2: Math.round(100 * (primeros[c.handle] || 0) / compartidos.length) + '%',
      tip: `@${c.handle} llegó primero en ${fmt(primeros[c.handle] || 0)} de ${compartidos.length} hechos`
    })).sort((a, b) => b.v - a.v);

    h += `<h2 class="seccion">Quién llegó primero</h2>
      <p class="explica">De los hechos que cubrió más de una cuenta, quién publicó antes. Es una medida de
      primicia que sale sola de las marcas de hora, sin modelo de por medio.
      <strong>Una advertencia:</strong> mide quién publicó primero <em>en X</em> entre las cuentas observadas,
      no quién tuvo la información primero.</p>`;
    h += tarjeta('Primero en publicar', `Sobre ${compartidos.length} hechos compartidos`,
      barras(filas, { titulo: 'Quién llegó primero' }),
      tablaHTML(['Cuenta', 'Veces primero', 'Porcentaje'],
        filas.map(f => [f.et, f.vt, f.v2])));
  }

  $('#vAgenda').innerHTML = h;
  engancharClasificar();
  const u = $('#umbral');
  if (u) u.addEventListener('change', e => {
    umbralHecho = parseInt(e.target.value, 10) / 100;
    hechosCache = null;
    renderAgenda();
  });
}

  return `<div class="envTabla"><table class="datos">
    <thead><tr><th>Hecho</th><th>Tema</th><th>Cuentas</th><th>Primero</th><th>Reacciones</th><th></th></tr></thead>
    <tbody>${hechos.map(x => `<tr>
      <td style="max-width:420px">${escapar(x.titulo)}</td>
      <td>${escapar(x.tema)}</td>
      <td style="text-align:left;white-space:nowrap">${x.cuentas.map(c =>
        `<i class="sw" style="background:${colorDe(c)};margin-right:3px" title="@${escapar(c)}"></i>`).join('')}
        <span style="color:var(--tinta-3)">${x.cuentas.length}</span></td>
      <td style="text-align:left;white-space:nowrap">@${escapar(x.primero.cuenta_monitoreada)}<br>
        <span style="color:var(--tinta-3);font-size:11px">${new Date(x.primero.publicado_iso).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}</span></td>
      <td>${fmt(x.reacciones)}</td>
      <td><a href="${escapar(x.primero.url)}" target="_blank" rel="noopener">ver</a></td>
    </tr>`).join('')}</tbody></table></div>`;
}

function panelClasificar(total, hechos) {
  const pend = total - hechos;
  const prov = leerLocal('anubis_prov') || 'anthropic';
  return `<div class="tarjeta">
    <div class="filtros" style="margin:0 0 12px;padding:0;border:0;background:transparent">
      <label for="cProv">Proveedor</label>
      <select id="cProv">
        <option value="anthropic"${prov === 'anthropic' ? ' selected' : ''}>Anthropic</option>
        <option value="openai"${prov === 'openai' ? ' selected' : ''}>OpenAI</option>
      </select>
      <input type="password" id="cClave" placeholder="clave de API" style="flex:1;min-width:200px"
        value="${escapar(claveDe(prov))}">
      <button class="primario" id="btnClasificar" style="background:var(--marca);color:#fff"
        ${pend ? '' : 'disabled'}>Clasificar ${fmt(pend)} publicación(es)</button>
    </div>
    <p class="sub" style="margin:0">
      ${fmt(hechos)} de ${fmt(total)} ya clasificadas${hechos ? ' · lo ya procesado no se vuelve a pagar' : ''}.

function engancharClasificar() {
  const b = $('#btnClasificar');
  if (!b) return;
  $('#cProv').addEventListener('change', e => {
    guardarLocal('anubis_prov', e.target.value);
    $('#cClave').value = claveDe(e.target.value);
  });
  b.addEventListener('click', async () => {
    const prov = $('#cProv').value, clave = $('#cClave').value.trim();
    if (!clave) { $('#cEstado').textContent = ' Falta la clave.'; return; }
    guardarLocal('anubis_clave_' + prov, clave);
    b.disabled = true;
    const modelo = MODELOS[prov].economico;
    try {
      const r = await clasificar(seleccion(), prov, clave, modelo,
        (i, n) => { $('#cEstado').textContent = ` procesando ${i}/${n}…`; });
      hechosCache = null;
      console.log('[ANUBIS] clasificación', r);
      renderAgenda();
    } catch (e) {
      $('#cEstado').textContent = ' ' + e.message;
      b.disabled = false;
    }
  });
}

// ====================================================================
// Informe descargable (.pptx, que es lo que abre Keynote)
// ====================================================================
// El formato .key es cerrado y no se puede escribir desde código. Keynote
// abre .pptx de forma nativa, y como los gráficos van como figuras y no como
// imágenes, cada barra se puede editar adentro de Keynote.

// Los colores viven como variables CSS; el pptx necesita hex literal.
function aHex(colorCss) {
  const v = String(colorCss || '').match(/var\((--[\w-]+)\)/);
  const bruto = v
    ? getComputedStyle(document.documentElement).getPropertyValue(v[1]).trim()
    : String(colorCss || '');
  const m = bruto.match(/^#?([0-9a-f]{6})$/i);
  if (m) return m[1];
  const rgb = bruto.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
  if (rgb) return [1, 2, 3].map(i => (+rgb[i]).toString(16).padStart(2, '0')).join('');
  return '2A78D6';
}

function fechaPeriodo() {
  const e = D.ejecuciones.find(x => x.periodo && x.periodo.desde);
  if (!e) return '';
  const d = new Date(e.periodo.desde);
  return d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

async function armarInforme() {
  const posts = seleccion();
  const cuentas = cuentasDe(posts);
  if (!cuentas.length) throw new Error('No hay datos en la selección actual.');
  const ag = cuentas.map(agregados);
  const ref = ag.find(a => a.rol === 'propia');
  const mercado = $('#fMercado').value;
  const periodo = fechaPeriodo();

  const d = IncertisPptx.crear({ titulo: `Anubis · ${mercado} · ${periodo}` });

  d.portada('Monitoreo de X',
    mercado + (periodo ? ' · ' + periodo : ''),
    'Incertis Anubis · generado el ' + new Date().toLocaleDateString('es-AR'));

  // ---- actividad -----------------------------------------------------
  d.seccion('Lo que decide la redacción',
    'Cuántas veces publicó cada cuenta. Es actividad: depende sólo del medio y por sí sola no dice nada sobre el resultado.');

  d.barras('Publicaciones en el período', 'Actividad — no es una medida de éxito',
    ag.slice().sort((a, b) => b.n - a.n)
      .map(a => ({ et: '@' + a.handle, v: a.n, vt: fmt(a.n), color: aHex(a.color) })));

  // ---- audiencia -----------------------------------------------------
  d.seccion('Lo que decide la audiencia',
    'Estas cifras no las controla el medio. Van por publicación, no en total: un total premia a quien más publica.');

  const orden = ag.slice().sort((a, b) => b.reaccionesPorPost - a.reaccionesPorPost);
  d.barras('Reacciones que consigue una publicación promedio',
    'Me gusta, guardados, respuestas y compartidos sumados, dividido por la cantidad de publicaciones',
    orden.map(a => ({ et: '@' + a.handle, v: a.reaccionesPorPost,
      vt: fmt(a.reaccionesPorPost) + '   (' + fmt(a.n) + ' posts)', color: aHex(a.color) })),
    'Trata un me gusta y un compartido como equivalentes, que no lo son. El desglose está en la tabla siguiente.');

  d.barras('Alcance mediano por publicación', 'Vistas de la publicación típica',
    ag.slice().sort((a, b) => (b.vistasMed || 0) - (a.vistasMed || 0))
      .map(a => ({ et: '@' + a.handle, v: a.vistasMed, vt: fmt(a.vistasMed), color: aHex(a.color) })));

  d.tabla('Las cuatro señales', 'Por publicación, ordenadas por lo que le cuesta a una persona producirlas',
    ['Cuenta'].concat(SENALES.map(s => s.n)).concat(['Total']),
    orden.map(a => ['@' + a.handle]
      .concat(SENALES.map(s => fmt1(a[s.k + 'Tot'] / a.n)))
      .concat([fmt(a.reaccionesPorPost)])));

  // ---- agenda, si está clasificado -----------------------------------
  const clasificados = posts.filter(p => p.ia);
  if (clasificados.length > 10) {
    const hechos = hechosCache || construirHechos(posts, umbralHecho);
    const compartidos = hechos.filter(x => x.cuentas.length > 1);

    d.seccion('La agenda del día',
      'Acontecimientos que cubrió más de una cuenta. El agrupamiento compara nombres propios y palabras poco frecuentes del día.');

    if (compartidos.length) {
      d.tabla('Hechos compartidos', `${compartidos.length} en el período · los diez con más cobertura`,
        ['Hecho', 'Cuentas', 'Primero', 'Reacciones'],
        compartidos.slice(0, 10).map(x => [
          x.titulo.slice(0, 70), String(x.cuentas.length),
          '@' + x.primero.cuenta_monitoreada, fmt(x.reacciones)]));
    }

    if (ref) {
      const cubreRef = x => x.cuentas.some(c => c.toLowerCase() === ref.handle.toLowerCase());
      const huecos = compartidos.filter(x => !cubreRef(x));
      d.tabla('Huecos de cobertura', `Cubrió la competencia y @${ref.handle} no · ${huecos.length} en el período`,
        ['Hecho', 'Cuentas que lo cubrieron', 'Reacciones'],
        (huecos.length ? huecos.slice(0, 10) : []).map(x => [
          x.titulo.slice(0, 70), x.cuentas.map(c => '@' + c).join(', ').slice(0, 44), fmt(x.reacciones)]),
        huecos.length ? '' : 'Ningún hecho compartido quedó sin cubrir en este período.');

      const primeros = {};
      for (const x of compartidos) {
        const c = x.primero.cuenta_monitoreada;
        primeros[c] = (primeros[c] || 0) + 1;
      }
      d.barras('Quién llegó primero', `Sobre ${compartidos.length} hechos compartidos`,
        ag.map(a => ({ et: '@' + a.handle, v: primeros[a.handle] || 0,
          vt: fmt(primeros[a.handle] || 0), color: aHex(a.color) }))
          .sort((x, y) => y.v - x.v),
        'Mide quién publicó primero en X entre las cuentas observadas, no quién tuvo la información primero.');
    }

    // Dos láminas, nunca una: el agregado del mercado y la cuenta propia por
    // separado. Una sola lámina con la suma se lee como si fuera del cliente.
    const merc = {}, propio = {};
    for (const p of clasificados) {
      merc[p.ia.tema] = (merc[p.ia.tema] || 0) + 1;
      if (ref && p.cuenta_monitoreada === ref.handle) propio[p.ia.tema] = (propio[p.ia.tema] || 0) + 1;
    }
    const nMerc = clasificados.length;
    d.barras('Qué se publicó · todos los medios juntos',
      `${fmt(nMerc)} publicaciones de ${cuentas.length} cuentas sumadas: ${cuentas.map(c => '@' + c.handle).join(', ')}`,
      Object.entries(merc).sort((a, b) => b[1] - a[1])
        .map(([t, v]) => ({ et: t, v, vt: fmt(v) + '   (' + Math.round(100 * v / nMerc) + '%)',
          color: aHex('var(--neutro)') })),
      'Es la agenda del mercado, no la de ninguna cuenta en particular.');

    if (ref && Object.keys(propio).length) {
      const nProp = Object.values(propio).reduce((s, v) => s + v, 0);
      d.barras(`Qué se publicó · sólo @${ref.handle}`,
        `${fmt(nProp)} publicaciones propias · el porcentaje es sobre su propio total`,
        Object.entries(propio).sort((a, b) => b[1] - a[1])
          .map(([t, v]) => ({ et: t, v, vt: fmt(v) + '   (' + Math.round(100 * v / nProp) + '%)',
            color: aHex(ref.color) })),
        'Ninguna cifra de esta lámina aparece en la anterior: son conjuntos distintos.');
    }
  }

  // ---- metodología ----------------------------------------------------
  const truncados = posts.filter(p => p.texto_truncado).length;
  const sinEvidencia = posts.filter(p => !p.evidencia).length;

  d.texto('Cómo se hizo y qué no dice', [
    `Fuente: la cronología pública de cada cuenta en X, leída desde una sesión real de Chrome. No se usó la API de X.`,
    `Alcance: ${fmt(posts.length)} publicaciones de ${cuentas.length} cuentas${periodo ? ', período ' + periodo : ''}.`,
    `Todas las métricas se leyeron en un único momento, así que una publicación de la mañana acumuló más horas de exposición que una de la noche. Las cifras sirven para comparar órdenes de magnitud, no para un ranking fino.`,
    truncados ? `${fmt(truncados)} publicaciones tienen el texto cortado por el "Mostrar más" de X, así que el análisis de contenido trabaja con material incompleto en esos casos.` : '',
    sinEvidencia ? `${fmt(sinEvidencia)} publicaciones quedaron sin captura de pantalla.` : '',
    `La cobertura refleja lo que la interfaz de X mostró durante la captura, no necesariamente el universo completo de publicaciones.`
  ].filter(Boolean));

  return { blob: await d.blob(), nombre: `Anubis_${mercado}_${(periodo || '').replace(/\s+/g, '-')}.pptx`, laminas: d.cantidad };
}

<script>
'use strict';
// INCERTIS ANUBIS · acceso v1.0
//
// Candado para la copia publicada del panel.
//
// Una contraseña escrita en el código de una página pública no protege nada:
// el repositorio es público y el código se lee. Acá la contraseña no abre la
// página, abre un token de lectura cifrado. El archivo acceso.json contiene el
// token cifrado con AES-GCM y una clave derivada de la contraseña con PBKDF2;
// sin la contraseña ese archivo es ruido.
//
// Lo que esto protege y lo que no: protege los datos, que viven en un
// repositorio privado y sólo se abren con el token. No protege contra alguien
// que se baje acceso.json y pruebe contraseñas por su cuenta — por eso la
// contraseña tiene que ser larga, y si se filtra se revoca el token y se
// genera de nuevo, que lleva dos minutos.

const ACCESO = { archivo: 'acceso.json', cfg: null };
const ITERACIONES = 600000;

function bytesABase64(b) {
  let s = '';
  const u = new Uint8Array(b);
  for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
  return btoa(s);
}
function base64ABytes(t) {
  const bin = atob(String(t));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

async function derivarClave(contrasena, sal, iteraciones) {
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(contrasena), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: sal, iterations: iteraciones || ITERACIONES, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function cifrarToken(token, contrasena) {
  const sal = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const clave = await derivarClave(contrasena, sal, ITERACIONES);
  const cifrado = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, clave,
    new TextEncoder().encode(token));
  return {
    sal: bytesABase64(sal), iv: bytesABase64(iv),
    cifrado: bytesABase64(cifrado), iteraciones: ITERACIONES
  };
}

async function descifrarToken(cfg, contrasena) {
  const clave = await derivarClave(contrasena, base64ABytes(cfg.sal), cfg.iteraciones);
  // Una contraseña equivocada no descifra mal: AES-GCM verifica la etiqueta y
  // tira excepción. No hay forma de entrar con una clave parecida.
  const plano = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: base64ABytes(cfg.iv) }, clave, base64ABytes(cfg.cifrado));
  return new TextDecoder().decode(plano);
}

// El candado sólo existe donde hay acceso.json, es decir en la copia publicada.
// Dentro de la extensión el archivo no está y el panel abre directo.
async function prepararAcceso() {
  let cfg = null;
  try {
    const r = await fetch(ACCESO.archivo, { cache: 'no-store' });
    if (r.ok) cfg = await r.json();
  } catch (e) { /* sin candado */ }
  if (!cfg || !cfg.cifrado) return false;

  ACCESO.cfg = cfg;
  mostrarCandado();
  return true;
}

function mostrarCandado() {
  const v = document.getElementById('vacio');
  const app = document.getElementById('app');
  if (app) app.classList.add('oculto');
  if (!v) return;
  v.classList.remove('oculto');
  v.innerHTML = `
    <h2>Incertis Anubis</h2>
    <p style="max-width:440px;margin:0 auto 22px">Panel de monitoreo de X.
      Escribí la contraseña del equipo para abrir los datos.</p>
    <div style="max-width:340px;margin:0 auto;text-align:left">
      <input type="password" id="accClave" placeholder="contraseña" autocomplete="current-password"
             style="width:100%;margin-bottom:10px">
      <button class="primario" id="accEntrar" style="background:var(--marca);color:#fff;width:100%">Entrar</button>
      <p class="explica" id="accMsg" style="margin:12px 0 0;text-align:center"></p>
      <label class="explica" style="display:flex;align-items:center;gap:7px;justify-content:center;margin-top:10px">
        <input type="checkbox" id="accRecordar" style="width:auto;margin:0" checked> recordarme en este navegador</label>
    </div>`;

  const entrar = () => abrirCandado($('#accClave').value, $('#accRecordar').checked);
  $('#accEntrar').addEventListener('click', entrar);
  $('#accClave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

  // Si ya entró antes en este navegador, se abre solo.
  const guardada = leerLocal('anubis_acc');
  if (guardada) abrirCandado(guardada, true, true);
  else $('#accClave').focus();
}

async function abrirCandado(contrasena, recordar, silencioso) {
  const msg = $('#accMsg');
  if (!contrasena) { if (msg) msg.textContent = 'Escribí la contraseña.'; return; }
  if (msg) msg.textContent = 'Abriendo…';
  let token;
  try {
    token = await descifrarToken(ACCESO.cfg, contrasena);
  } catch (e) {
    if (recordar) guardarLocal('anubis_acc', '');
    if (msg) msg.textContent = silencioso ? '' : 'Contraseña incorrecta.';
    if (silencioso && $('#accClave')) $('#accClave').focus();
    return;
  }
  if (recordar) guardarLocal('anubis_acc', contrasena);

  guardarLocal('anubis_gh_duenio', ACCESO.cfg.duenio || '');
  guardarLocal('anubis_gh_repo', ACCESO.cfg.repo || '');
  guardarLocal('anubis_gh_token', token);

  // Entrar y listar en un solo paso: quien abre el panel quiere ver los días,
  // no completar otro formulario.
  restaurarVacio();
  mostrarGitHub();
  listarDeGitHub();
}

// ====================================================================
// Generador de acceso.json
// ====================================================================
// Corre en el navegador de quien lo prepara: el token en claro no sale nunca
// de esa máquina, y lo que se sube al repositorio ya está cifrado.

  $('#genC').addEventListener('input', e => {

      : `${n} caracteres: bien.`;

async function generarAcceso() {
  const msg = $('#genMsg');
  const duenio = $('#genD').value.trim(), repo = $('#genR').value.trim();
  const token = $('#genT').value.trim(), clave = $('#genC').value;
  if (!duenio || !repo || !token || !clave) { msg.textContent = 'Faltan datos.'; return; }
  msg.textContent = 'Cifrando…';
  try {
    const c = await cifrarToken(token, clave);
    const json = JSON.stringify({ duenio, repo, ...c, generado: new Date().toISOString() }, null, 2);
    // Prueba de ida y vuelta antes de entregarlo: si el archivo no se puede
    // abrir con la contraseña que acabás de escribir, mejor saberlo acá.
    const vuelta = await descifrarToken(JSON.parse(json), clave);
    if (vuelta !== token) throw new Error('la verificación falló');

    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'acceso.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    msg.textContent = 'Listo: subí acceso.json al repositorio del panel, junto a index.html.';
  } catch (e) {
    msg.textContent = 'Falló: ' + e.message;
  }
}

</script>
<script>
'use strict';
// INCERTIS ANUBIS · película v1.0
//
// Arma un video con las capturas de pantalla de la ejecución, a 24 cuadros por
// segundo. No es un adorno: un día de cobertura pasando en quince segundos
// muestra el ritmo y la repetición de la agenda de un modo que ninguna tabla
// consigue.
//
// Cómo se graba: el canvas entrega cuadros a demanda (captureStream(0) más
// requestFrame) y MediaRecorder los va codificando. MediaRecorder trabaja en
// tiempo real, así que el bucle marca el compás con el reloj: un cuadro cada
// 41,67 ms. La música, si hay, se suma como pista de audio del mismo stream y
// suena mientras se graba, que es lo que la mete adentro del archivo.

const PELI = {
  fps: 24,
  grabando: false,
  cancelar: false,
  ctx: null,           // un solo AudioContext para toda la sesión
  audio: null,         // { tipo:'buffer'|'elemento', buffer, elemento, nodo, duracion, nombre }
  // 720p por defecto: a 1080p el codificador del navegador no llega a 24 cuadros
  // por segundo y empieza a descartar, así que la película sale con saltos.
  formatos: {
    horizontal:   { a: 1280, h: 720,  n: 'Horizontal · 1280×720' },
    horizontalHD: { a: 1920, h: 1080, n: 'Horizontal · 1920×1080 (puede saltear cuadros)' },
    cuadrado:     { a: 1080, h: 1080, n: 'Cuadrado · 1080×1080' },
    vertical:     { a: 1080, h: 1920, n: 'Vertical · 1080×1920' }
  }
};

const PLACA_ENTRADA = 2.5;   // segundos
const PLACA_SALIDA = 2;
const FUENTE = '-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

// --------------------------------------------------------------------
// Datos
// --------------------------------------------------------------------
// Qué evidencias hay de verdad. Tener la referencia en el post no alcanza: un
// paquete cargado desde disco trae el nombre del archivo pero no la imagen, y
// contar referencias en vez de imágenes hacía que la película saliera vacía.
const DISPONIBLES = { claves: new Map(), listo: false };

async function revisarDisponibles() {
  DISPONIBLES.claves = new Map();
  const ejecs = [...new Set(seleccion().map(p => p.ejecucion_id).filter(Boolean))];
  for (const id of ejecs) {
    try { DISPONIBLES.claves.set(id, await Almacen.clavesEvidencia(id)); }
    catch (e) { DISPONIBLES.claves.set(id, new Set()); }
  }
  DISPONIBLES.listo = true;
}

function hayImagen(p) {
  if (!p.evidencia || !p.evidencia.evidencia_id) return false;
  if (typeof EVIDENCIA_EN_DISCO !== 'undefined' && EVIDENCIA_EN_DISCO.has(p.evidencia.evidencia_id)) return true;
  const s = DISPONIBLES.claves.get(p.ejecucion_id);
  return !!(s && s.has(p.evidencia.evidencia_id));
}

function cuadrosDePelicula() {
  const sel = seleccion();
  const referidas = sel.filter(p => p.evidencia && p.evidencia.evidencia_id);
  const posts = DISPONIBLES.listo ? referidas.filter(hayImagen) : referidas;
  const cuentas = cuentasDe(sel);
  const color = {};
  for (const c of cuentas) color[c.handle] = c.color;
  return { posts, cuentas, color, referidas: referidas.length, seleccionadas: sel.length };
}

function diasDelPeriodo(posts) {
  const dias = new Set(posts.map(p => (p.publicado_iso || '').slice(0, 10)).filter(Boolean));
  return Math.max(dias.size, 1);
}

function colorReal(css) {
  const v = String(css || '').match(/var\((--[\w-]+)\)/);
  if (!v) return css || '#2A78D6';
  return getComputedStyle(document.documentElement).getPropertyValue(v[1]).trim() || '#2A78D6';
}

// --------------------------------------------------------------------
// Vista
// --------------------------------------------------------------------
function renderPelicula() {
  // Un cambio de filtro mientras se graba borraría el canvas en pleno rodaje.
  if (PELI.grabando) return;
  if (!DISPONIBLES.listo) {
    $('#vPelicula').innerHTML = '<p class="explica">Revisando qué capturas hay guardadas…</p>';
    revisarDisponibles().then(renderPelicula);
    return;
  }

  const { posts, cuentas, referidas, seleccionadas } = cuadrosDePelicula();
  const faltan = referidas - posts.length;

  let h = `<h2 class="seccion">Película del período</h2>
    <p class="explica">Las capturas de pantalla, una detrás de otra, a 24 cuadros por segundo.
    Cada publicación es un cuadro: un día entero de cobertura pasa en segundos y se ve el ritmo,
    la repetición y los momentos en que todos publican lo mismo. Sale del navegador, sin servidor.</p>`;

  // El caso que rompía todo: las publicaciones dicen tener captura, pero la
  // imagen no está en el navegador porque el paquete se cargó desde disco.
  if (faltan > 0) {
    h += `<div class="aviso" style="margin-bottom:16px">
      <strong>Faltan ${fmt(faltan)} imágenes.</strong> De ${fmt(referidas)} publicaciones con captura,
      ${posts.length ? `sólo <strong>${fmt(posts.length)}</strong> tienen la imagen a mano` : 'ninguna tiene la imagen a mano'}.
      Pasa cuando el paquete se cargó desde archivos y no desde el almacenamiento de la extensión:
      el <code>posts.jsonl</code> guarda el nombre del archivo, no la foto.
      <div style="margin-top:12px">
        <button class="chico" id="vCargarFotos" type="button">Elegir la carpeta de la captura</button>
        <span id="vFotosEstado" style="font-size:12px;margin-left:10px"></span>
      </div>
      <input type="file" id="vArchivoFotos" webkitdirectory directory multiple class="oculto">
    </div>`;
  }

  if (!posts.length) {
    h += `<div class="aviso"><strong>No hay ninguna imagen disponible en esta selección.</strong>
      De ${fmt(seleccionadas)} publicaciones${referidas ? `, ${fmt(referidas)} declaran captura pero no está guardada` :
      ', ninguna declara captura: la ejecución corrió con la evidencia visual desactivada'}.</div>`;
    $('#vPelicula').innerHTML = h;
    engancharFotos();
    return;
  }

  h += `<div class="tarjeta">
    <div class="cabTarjeta"><div class="crece">
      <h3>Cómo armarla</h3>
      <p class="sub">${fmt(posts.length)} imágenes listas de ${fmt(seleccionadas)} publicaciones · ${cuentas.length} cuentas</p>
    </div></div>

    <div class="filtros" style="margin:0 0 14px;padding:0;border:0;background:transparent">
      <label for="vOrden">Orden</label>
      <select id="vOrden">
        <option value="crono">Cronológico — el día como pasó</option>
        <option value="cuenta">Por cuenta — un medio después del otro</option>
      </select>
      <label for="vFormato">Formato</label>
      <select id="vFormato">
        ${Object.entries(PELI.formatos).map(([k, f]) =>
          `<option value="${k}">${escapar(f.n)}</option>`).join('')}
      </select>
      <label for="vRep">Cuadros por captura</label>
      <select id="vRep">
        <option value="1">1 — 24 capturas por segundo</option>
        <option value="2">2 — 12 por segundo</option>
        <option value="3">3 — 8 por segundo</option>
        <option value="6">6 — 4 por segundo</option>
        <option value="12">12 — 2 por segundo</option>
      </select>
    </div>

    <div class="filaCarpeta" style="margin-bottom:6px">
      <span id="vMusicaNombre" class="rutaCarpeta">Sin música</span>
      <button class="chico" id="vElegirMusica" type="button">Elegir música</button>
      <button class="chico oculto" id="vQuitarMusica" type="button">Quitar</button>
      <label class="explica" style="margin:0 0 0 12px;display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="vAjustar" style="width:auto;margin:0"> que dure lo que la música</label>
    </div>
    <p class="explica" style="margin:0 0 14px">Sirve un audio (MP3, M4A, WAV, AAC, OGG, FLAC) o
      directamente un video (MP4, MOV, WebM): de un video se toma sólo la pista de sonido, la imagen se descarta.</p>
    <input type="file" id="vArchivoMusica" class="oculto"
      accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.ogg,.flac,.mp4,.mov,.m4v,.webm">

    <p class="explica" style="margin:0 0 14px" id="vDuracion"></p>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="primario" id="vGrabar" style="background:var(--marca);color:#fff">Armar la película</button>
      <button id="vProbar" title="Diez capturas, para ver que todo funcione antes de esperar la película entera">Probar con 10</button>
      <button id="vCancelar" disabled>Cancelar</button>
      <span id="vEstado" style="font-size:12px;color:var(--tinta-3)"></span>
    </div>

    <div class="barraProgreso" style="margin-top:14px"><div id="vBarra" style="width:0%"></div></div>
    <canvas id="vLienzo" style="width:100%;margin-top:14px;border-radius:8px;border:1px solid var(--borde);background:#000"></canvas>
    <div id="vSalida"></div>
  </div>

  <div class="aviso">
    <strong>Sobre el formato del archivo.</strong> Se graba en MP4 si Chrome lo permite en esta máquina,
    y si no en WebM, que Chrome reproduce pero QuickTime y Keynote no. El formato que salió queda dicho
    al terminar. La grabación va en tiempo real: una película de quince segundos tarda quince segundos.
  </div>`;

  $('#vPelicula').innerHTML = h;
  engancharPelicula();
  actualizarDuracion();
}

function engancharPelicula() {
  ['#vOrden', '#vFormato', '#vRep', '#vAjustar'].forEach(s => {
    const el = $(s); if (el) el.addEventListener('change', actualizarDuracion);
  });
  $('#vElegirMusica').addEventListener('click', () => $('#vArchivoMusica').click());
  $('#vArchivoMusica').addEventListener('change', e => cargarMusica(e.target.files[0]));
  $('#vQuitarMusica').addEventListener('click', () => {
    soltarAudio();
    $('#vMusicaNombre').textContent = 'Sin música';
    $('#vQuitarMusica').classList.add('oculto');
    $('#vAjustar').checked = false;
    actualizarDuracion();
  });
  $('#vGrabar').addEventListener('click', () => armarPelicula(0));
  $('#vProbar').addEventListener('click', () => armarPelicula(10));
  $('#vCancelar').addEventListener('click', () => { PELI.cancelar = true; });
  engancharFotos();

  const f = PELI.formatos[$('#vFormato').value];
  const l = $('#vLienzo');
  l.width = f.a; l.height = f.h;
  dibujarPlacaEntrada(l.getContext('2d'), f);
}

// Recuperar las imágenes de una carpeta de paquete: se guardan en memoria y no
// en la base, porque son de una sola sesión y no hace falta pagar el espacio.
function engancharFotos() {
  const b = $('#vCargarFotos');
  if (!b) return;
  b.addEventListener('click', () => $('#vArchivoFotos').click());
  $('#vArchivoFotos').addEventListener('change', e => {
    const antes = EVIDENCIA_EN_DISCO.size;
    let vistas = 0;
    for (const f of Array.from(e.target.files)) {
      if (!/\.(jpe?g|png|webp)$/i.test(f.name)) continue;
      EVIDENCIA_EN_DISCO.set(f.name.replace(/\.[^.]+$/, ''), f);
      vistas++;
    }
    const est = $('#vFotosEstado');
    if (!vistas) {
      est.textContent = 'En esa carpeta no hay imágenes. Tiene que ser la carpeta de la captura, la que contiene screenshots/.';
      return;
    }
    est.textContent = `${vistas} imagen(es) encontradas.`;
    console.log('[ANUBIS] evidencia desde disco:', EVIDENCIA_EN_DISCO.size - antes, 'nuevas');
    renderPelicula();
  });
}

// Un único AudioContext para toda la sesión. Hace falta porque un elemento de
// video sólo se puede enchufar a un contexto una vez en la vida: si cada
// grabación creara el suyo, la segunda fallaría.
function contextoAudio() {
  if (!PELI.ctx) PELI.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (PELI.ctx.state === 'suspended') PELI.ctx.resume();
  return PELI.ctx;
}

function soltarAudio() {
  if (PELI.audio && PELI.audio.elemento) {
    try { PELI.audio.elemento.pause(); } catch (e) {}
    try { URL.revokeObjectURL(PELI.audio.elemento.src); } catch (e) {}
    try { PELI.audio.nodo.disconnect(); } catch (e) {}
  }
  PELI.audio = null;
}

// Dos caminos según el archivo. Un audio suelto se decodifica entero a memoria:
// es exacto y se puede volver a empezar cuantas veces se quiera. Un MP4 o un
// MOV no se pueden decodificar así —el contenedor trae video—, así que se
// reproduce en un elemento y se le saca la pista de sonido en vivo.
async function cargarMusica(archivo) {
  if (!archivo) return;
  soltarAudio();
  $('#vMusicaNombre').textContent = 'Leyendo ' + archivo.name + '…';
  const esVideo = /^video\//.test(archivo.type) || /\.(mp4|mov|m4v|webm|avi|mkv)$/i.test(archivo.name);

  if (!esVideo) {
    try {
      const buf = await archivo.arrayBuffer();
      const decodificado = await contextoAudio().decodeAudioData(buf);
      PELI.audio = { tipo: 'buffer', buffer: decodificado, duracion: decodificado.duration, nombre: archivo.name };
      anunciarAudio();
      return;
    } catch (e) {
      // Un .m4a raro o un contenedor que decodeAudioData no traga: se intenta
      // por el camino del elemento antes de darse por vencido.
      console.warn('[ANUBIS] decodeAudioData falló, voy por el elemento:', e.message);
    }
  }

  try {
    const el = document.createElement(esVideo ? 'video' : 'audio');
    el.src = URL.createObjectURL(archivo);
    el.preload = 'auto';
    el.crossOrigin = 'anonymous';
    await new Promise((res, rej) => {
      el.onloadedmetadata = res;
      el.onerror = () => rej(new Error('Chrome no puede reproducir ese archivo'));
      setTimeout(() => rej(new Error('el archivo tardó demasiado en abrir')), 20000);
    });
    if (!isFinite(el.duration) || !el.duration) throw new Error('no se pudo leer la duración');
    const nodo = contextoAudio().createMediaElementSource(el);
    PELI.audio = { tipo: 'elemento', elemento: el, nodo, duracion: el.duration, nombre: archivo.name, esVideo };
    anunciarAudio();
  } catch (e) {
    PELI.audio = null;
    $('#vMusicaNombre').textContent = 'No se pudo usar ese archivo: ' + e.message;
    actualizarDuracion();
  }
}

function anunciarAudio() {
  const a = PELI.audio;
  $('#vMusicaNombre').textContent = `${a.nombre} · ${segundos(a.duracion)}` +
    (a.esVideo ? ' · sólo el audio del video' : '');
  $('#vQuitarMusica').classList.remove('oculto');
  actualizarDuracion();
}

function segundos(s) {
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return m ? `${m}:${String(r).padStart(2, '0')}` : `${r} s`;
}

// Cuántos cuadros dura cada captura. Con música y ajuste pedido, se reparte el
// tiempo que sobra entre las capturas en vez de dejar la música colgando.
function repeticiones() {
  const manual = parseInt($('#vRep').value, 10) || 1;
  if (!($('#vAjustar') && $('#vAjustar').checked) || !PELI.audio) return manual;
  const { posts } = cuadrosDePelicula();
  const placas = (PLACA_ENTRADA + PLACA_SALIDA) * PELI.fps;
  const disponibles = PELI.audio.duracion * PELI.fps - placas;
  if (disponibles <= 0 || !posts.length) return manual;
  return Math.max(1, Math.min(48, Math.round(disponibles / posts.length)));
}

function actualizarDuracion() {
  const { posts } = cuadrosDePelicula();
  if (!posts.length || !$('#vDuracion')) return;
  const f = PELI.formatos[$('#vFormato').value];
  const l = $('#vLienzo');
  if (l.width !== f.a) { l.width = f.a; l.height = f.h; dibujarPlacaEntrada(l.getContext('2d'), f); }
  const rep = repeticiones();
  const dur = PLACA_ENTRADA + PLACA_SALIDA + posts.length * rep / PELI.fps;
  const ajustado = $('#vAjustar') && $('#vAjustar').checked && PELI.audio;
  $('#vDuracion').innerHTML =
    `Van a entrar <strong>${fmt(posts.length)} capturas</strong> a ${rep} cuadro${rep === 1 ? '' : 's'} cada una, ` +
    `más las dos placas: <strong>${segundos(dur)}</strong> de película.` +
    (PELI.audio ? ` La música dura ${segundos(PELI.audio.duracion)}${ajustado ? ', y el ritmo se ajustó para igualarla' : ''}.` : '');
}

// --------------------------------------------------------------------
// Dibujo
// --------------------------------------------------------------------
function fondo(ctx, f) {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, f.a, f.h);
}

// Las placas llevan una línea que avanza. No es adorno: un codificador de video
// descarta cuadros idénticos consecutivos, y con la placa quieta la pista de
// imagen terminaba antes que la de sonido.
function lineaDeTiempo(ctx, f, avance) {
  if (avance === undefined) return;
  const m = Math.round(f.a * 0.14), y = Math.round(f.h * 0.86);
  ctx.fillStyle = '#1e2732';
  ctx.fillRect(m, y, f.a - m * 2, Math.max(2, Math.round(f.h * 0.003)));
  ctx.fillStyle = '#8b98a8';
  ctx.fillRect(m, y, (f.a - m * 2) * Math.min(1, Math.max(0, avance)), Math.max(2, Math.round(f.h * 0.003)));
}

function dibujarPlacaEntrada(ctx, f, datos, avance) {
  const d = datos || datosPlaca();
  fondo(ctx, f);
  const cx = f.a / 2;
  const esc = f.a / 1920;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#8b98a8';
  ctx.font = `600 ${Math.round(34 * esc)}px ${FUENTE}`;
  ctx.letterSpacing = `${Math.round(6 * esc)}px`;
  ctx.fillText('INCERTIS ANUBIS', cx, f.h * 0.34);
  ctx.letterSpacing = '0px';

  ctx.fillStyle = '#ffffff';
  ctx.font = `700 ${Math.round(96 * esc)}px ${FUENTE}`;
  ctx.fillText(d.titulo, cx, f.h * 0.48);

  ctx.fillStyle = '#d6dde6';
  ctx.font = `400 ${Math.round(46 * esc)}px ${FUENTE}`;
  ctx.fillText(d.capturas, cx, f.h * 0.57);

  ctx.fillStyle = '#6f7d8d';
  ctx.font = `400 ${Math.round(32 * esc)}px ${FUENTE}`;
  ctx.fillText(d.fecha, cx, f.h * 0.64);

  // Las cuentas, cada una con su color, como leyenda de lo que se va a ver.
  const cuentas = d.cuentas;
  if (cuentas.length) {
    ctx.font = `600 ${Math.round(30 * esc)}px ${FUENTE}`;
    const anchos = cuentas.map(c => ctx.measureText('@' + c.handle).width);
    const sep = 46 * esc;
    let x = cx - (anchos.reduce((s, w) => s + w, 0) + sep * (cuentas.length - 1)) / 2;
    const y = f.h * 0.73;
    ctx.textAlign = 'left';
    cuentas.forEach((c, i) => {
      ctx.fillStyle = colorReal(c.color);
      ctx.fillText('@' + c.handle, x, y);
      ctx.fillRect(x, y + 12 * esc, anchos[i], 4 * esc);
      x += anchos[i] + sep;
    });
    ctx.textAlign = 'center';
  }
  lineaDeTiempo(ctx, f, avance);
}

// El nombre del ámbito sólo entra si dice algo. Los paquetes viejos no traen
// mercado y quedaba escrito "X en Sin mercado", que no significa nada.
function ambito() {
  const m = (($('#fMercado') && $('#fMercado').value) || '').trim();
  if (m && !/^sin (mercado|nombre)$/i.test(m)) return m;
  return '';
}

function datosPlaca() {
  const { posts, cuentas } = cuadrosDePelicula();
  const dias = diasDelPeriodo(posts.length ? posts : seleccion());
  const donde = ambito();
  return {
    titulo: `${dias} día${dias === 1 ? '' : 's'} de X${donde ? ' en ' + donde : ''}`,
    capturas: `${fmt(posts.length)} capturas · ${cuentas.length} cuenta${cuentas.length === 1 ? '' : 's'}`,
    fecha: fechaPeriodo() || new Date().toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' }),
    cuentas
  };
}

function dibujarPlacaSalida(ctx, f, resumen, avance) {
  fondo(ctx, f);
  const cx = f.a / 2, esc = f.a / 1920;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = `700 ${Math.round(72 * esc)}px ${FUENTE}`;
  ctx.fillText(resumen.linea1, cx, f.h * 0.45);
  ctx.fillStyle = '#8b98a8';
  ctx.font = `400 ${Math.round(38 * esc)}px ${FUENTE}`;
  ctx.fillText(resumen.linea2, cx, f.h * 0.54);
  ctx.font = `600 ${Math.round(28 * esc)}px ${FUENTE}`;
  ctx.letterSpacing = `${Math.round(5 * esc)}px`;
  ctx.fillText('INCERTIS ANUBIS', cx, f.h * 0.66);
  ctx.letterSpacing = '0px';
  lineaDeTiempo(ctx, f, avance);
}

// Una captura: se recorta la publicación dentro de la pantalla y se encaja
// entera en el cuadro. El recorte viene del recolector, en píxeles CSS, y la
// imagen está en píxeles de pantalla: hay que multiplicar por el dpr.
function dibujarCaptura(ctx, f, img, post, color, i, total) {
  fondo(ctx, f);
  const bandaAlta = Math.round(f.h * 0.075);
  const cajaY = bandaAlta;
  const cajaAlto = f.h - bandaAlta * 2;
  const cajaAncho = f.a - Math.round(f.a * 0.06);
  const cajaX = (f.a - cajaAncho) / 2;

  // El recorte viene en píxeles CSS y la imagen puede estar en cualquier escala
  // (Retina, o reducida al decodificar). El factor sale de comparar el ancho de
  // la imagen con el ancho del viewport: así no hay que confiar en el dpr.
  const ev = post.evidencia || {};
  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  const anchoCss = ev.viewport && ev.viewport.ancho;
  if (ev.recorte && anchoCss && ev.recorte.ancho > 40 && ev.recorte.alto > 40) {
    const k = img.width / anchoCss;
    sx = Math.max(0, Math.round(ev.recorte.x * k));
    sy = Math.max(0, Math.round(ev.recorte.y * k));
    sw = Math.min(img.width - sx, Math.round(ev.recorte.ancho * k));
    sh = Math.min(img.height - sy, Math.round(ev.recorte.alto * k));
    if (sw < 40 || sh < 40) { sx = 0; sy = 0; sw = img.width; sh = img.height; }
  }

  const escala = Math.min(cajaAncho / sw, cajaAlto / sh);
  const w = Math.round(sw * escala), alto = Math.round(sh * escala);
  const x = Math.round(cajaX + (cajaAncho - w) / 2);
  const y = Math.round(cajaY + (cajaAlto - alto) / 2);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x, y, w, alto);
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, alto);

  // Franja inferior: quién publicó, a qué hora y cuánto falta.
  const esc = f.a / 1920;
  const yb = f.h - bandaAlta + Math.round(34 * esc);
  ctx.textAlign = 'left';
  ctx.fillStyle = colorReal(color);
  ctx.font = `700 ${Math.round(30 * esc)}px ${FUENTE}`;
  ctx.fillText('@' + post.cuenta_monitoreada, cajaX, yb);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#7d8a99';
  ctx.font = `400 ${Math.round(28 * esc)}px ${FUENTE}`;
  const hora = post.publicado_iso
    ? new Date(post.publicado_iso).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '';
  ctx.fillText(hora, cajaX + cajaAncho, yb);

  const py = f.h - Math.round(24 * esc);
  ctx.fillStyle = '#1e2732';
  ctx.fillRect(cajaX, py, cajaAncho, Math.round(4 * esc));
  ctx.fillStyle = colorReal(color);
  ctx.fillRect(cajaX, py, cajaAncho * ((i + 1) / total), Math.round(4 * esc));
}

// --------------------------------------------------------------------
// Grabación
// --------------------------------------------------------------------
function tipoDeVideo() {
  const candidatos = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  return candidatos.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || '';
}

async function armarPelicula(limite) {
  if (PELI.grabando) return;
  const { posts: todos, color } = cuadrosDePelicula();
  if (!todos.length) return;

  const orden = $('#vOrden').value;
  let posts = todos.slice().sort((a, b) => orden === 'cuenta'
    ? (a.cuenta_monitoreada.localeCompare(b.cuenta_monitoreada) ||
       Date.parse(a.publicado_iso || 0) - Date.parse(b.publicado_iso || 0))
    : Date.parse(a.publicado_iso || 0) - Date.parse(b.publicado_iso || 0));
  if (limite) posts = posts.slice(0, limite);

  const f = PELI.formatos[$('#vFormato').value];
  const rep = repeticiones();
  const lienzo = $('#vLienzo');
  lienzo.width = f.a; lienzo.height = f.h;
  const ctx = lienzo.getContext('2d', { alpha: false });

  const tipo = tipoDeVideo();
  if (!tipo) { $('#vEstado').textContent = 'Este navegador no puede grabar video.'; return; }

  PELI.grabando = true; PELI.cancelar = false;
  $('#vGrabar').disabled = true; $('#vCancelar').disabled = false;
  if ($('#vProbar')) $('#vProbar').disabled = true;
  $('#vSalida').innerHTML = '';
  $('#vEstado').textContent = 'Preparando…';

  const stream = lienzo.captureStream(0);
  const pista = stream.getVideoTracks()[0];

  // La música se reproduce durante la grabación: es lo que la deja adentro del
  // archivo. Sin esto habría que muxear a mano, que en el navegador no se puede.
  let fuente = null, ganancia = null;
  if (PELI.audio) {
    const ctx = contextoAudio();
    const destino = ctx.createMediaStreamDestination();
    ganancia = ctx.createGain();
    ganancia.connect(destino);
    ganancia.connect(ctx.destination);   // y por los parlantes, para oírla mientras graba

    const durPeli = PLACA_ENTRADA + PLACA_SALIDA + posts.length * rep / PELI.fps;
    const fin = Math.min(durPeli, PELI.audio.duracion);
    // Entrada y salida suaves: un corte seco al final suena a error.
    ganancia.gain.setValueAtTime(0.0001, ctx.currentTime);
    ganancia.gain.exponentialRampToValueAtTime(1, ctx.currentTime + 0.8);
    if (fin > 2) {
      ganancia.gain.setValueAtTime(1, ctx.currentTime + fin - 1.5);
      ganancia.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + fin);
    }

    if (PELI.audio.tipo === 'buffer') {
      fuente = ctx.createBufferSource();
      fuente.buffer = PELI.audio.buffer;
      fuente.connect(ganancia);
      fuente.start();
    } else {
      // El elemento se reengancha en cada grabación; el nodo de origen es el
      // mismo de siempre, porque un elemento sólo admite uno.
      try { PELI.audio.nodo.disconnect(); } catch (e) {}
      PELI.audio.nodo.connect(ganancia);
      try { PELI.audio.elemento.currentTime = 0; } catch (e) {}
      PELI.audio.elemento.muted = false;
      await PELI.audio.elemento.play();
    }
    destino.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    PELI.gananciaActual = ganancia;
  }

  // El caudal sigue al tamaño del cuadro, no al revés: fijarlo alto en 720p
  // desperdicia y fijarlo bajo en 1080p ensucia las capturas de texto.
  const rec = new MediaRecorder(stream, {
    mimeType: tipo, videoBitsPerSecond: Math.round(f.a * f.h * 0.06) });
  const trozos = [];
  rec.ondataavailable = e => { if (e.data.size) trozos.push(e.data); };
  const terminado = new Promise(r => { rec.onstop = r; });

  const paso = 1000 / PELI.fps;
  let cuadro = 0;
  const totalCuadros = Math.round((PLACA_ENTRADA + PLACA_SALIDA) * PELI.fps) + posts.length * rep;
  const t0ref = { t: 0 };

  const esperar = async () => {
    cuadro++;
    pista.requestFrame();
    const objetivo = t0ref.t + cuadro * paso;
    const falta = objetivo - performance.now();
    if (falta > 0) await new Promise(r => setTimeout(r, falta));
    if (cuadro % 12 === 0) {
      $('#vBarra').style.width = Math.round(100 * cuadro / totalCuadros) + '%';
      $('#vEstado').textContent = `Grabando… ${Math.round(100 * cuadro / totalCuadros)}%`;
    }
  };

  // Decodificación por adelantado: la ventana da medio segundo de colchón, que
  // alcanza de sobra para no perder el compás de 24 cuadros.
  const VENTANA = 6;
  const cache = new Map();
  const pedir = i => {
    if (i >= posts.length) return null;
    if (!cache.has(i)) cache.set(i, cargarImagen(posts[i], f.a));
    return cache.get(i);
  };

  try {
    rec.start();
    t0ref.t = performance.now();

    const placa = datosPlaca();
    const nEntrada = Math.round(PLACA_ENTRADA * PELI.fps);
    for (let i = 0; i < nEntrada; i++) {
      dibujarPlacaEntrada(ctx, f, placa, (i + 1) / nEntrada);
      await esperar();
    }

    for (let i = 0; i < VENTANA; i++) pedir(i);

    let usadas = 0;
    for (let i = 0; i < posts.length; i++) {
      if (PELI.cancelar) break;
      const img = await pedir(i);
      pedir(i + VENTANA);
      if (img) {
        dibujarCaptura(ctx, f, img, posts[i], color[posts[i].cuenta_monitoreada], i, posts.length);
        usadas++;
      }
      for (let k = 0; k < rep; k++) await esperar();
      if (img && img.close) img.close();
      cache.delete(i);
    }

    const cierre = { linea1: `${fmt(usadas)} publicaciones`, linea2: placa.titulo };
    const nSalida = Math.round(PLACA_SALIDA * PELI.fps);
    for (let i = 0; i < nSalida; i++) {
      dibujarPlacaSalida(ctx, f, cierre, (i + 1) / nSalida);
      await esperar();
    }

    rec.stop();
    detenerAudio(fuente);
    await terminado;

    const blob = new Blob(trozos, { type: tipo });
    if (!blob.size) throw new Error('la grabación quedó vacía (0 bytes)');
    if (!usadas) throw new Error('ninguna imagen se pudo leer: la película habría sido sólo las placas');
    const ext = tipo.startsWith('video/mp4') ? 'mp4' : 'webm';
    const nombre = `Anubis_${($('#fMercado').value || 'pelicula').replace(/\s+/g, '-')}.${ext}`;
    const url = URL.createObjectURL(blob);
    $('#vSalida').innerHTML = `
      <div style="margin-top:16px">
        <video src="${url}" controls style="width:100%;border-radius:8px;background:#000"></video>
        <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">
          <a class="primario" id="vBajar" href="${url}" download="${escapar(nombre)}"
             style="background:var(--marca);color:#fff;text-decoration:none;display:inline-block;padding:9px 16px;border-radius:7px">Descargar el video</a>
          <span style="font-size:12px;color:var(--tinta-3)">${escapar(nombre)} ·
            ${(blob.size / 1048576).toFixed(1)} MB · ${escapar(ext.toUpperCase())}${PELI.audio ? ' con música' : ''}</span>
        </div>
      </div>`;
    $('#vEstado').textContent = PELI.cancelar
      ? `Cancelada: quedaron ${fmt(usadas)} capturas.`
      : `Listo: ${fmt(usadas)} capturas en ${ext.toUpperCase()}.`;
  } catch (e) {
    console.error('[ANUBIS] película', e);
    $('#vEstado').textContent = '';
    $('#vSalida').innerHTML = `<div class="aviso" style="margin-top:14px">
      <strong>No se pudo armar la película:</strong> ${escapar(e.message)}.
      <br><br>El detalle completo está en la consola del panel (clic derecho, Inspeccionar, pestaña Console).
      Formato de grabación: <code>${escapar(tipo)}</code>.</div>`;
    try { rec.stop(); } catch (x) {}
  } finally {
    detenerAudio(fuente);
    PELI.grabando = false;
    $('#vGrabar').disabled = false;
    if ($('#vProbar')) $('#vProbar').disabled = false;
    $('#vCancelar').disabled = true;
    $('#vBarra').style.width = '100%';
  }
}

// Primero el disco de esta sesión, después el almacenamiento de la extensión.
// Se decodifica ya reducida al ancho del cuadro: una captura de pantalla de
// Retina ocupa catorce megas descomprimida y se necesitan doce a la vez.
// El contexto no se cierra: es el mismo de toda la sesión y cerrarlo dejaría
// inservible el elemento de video, que no se puede volver a enchufar.
function detenerAudio(fuente) {
  if (fuente) { try { fuente.stop(); } catch (e) {} }
  if (PELI.audio && PELI.audio.tipo === 'elemento') {
    try { PELI.audio.elemento.pause(); } catch (e) {}
    try { PELI.audio.nodo.disconnect(); } catch (e) {}
  }
  if (PELI.gananciaActual) {
    try { PELI.gananciaActual.disconnect(); } catch (e) {}
    PELI.gananciaActual = null;
  }
}

async function cargarImagen(post, anchoDestino) {
  const id = post.evidencia && post.evidencia.evidencia_id;
  if (!id) return null;
  let blob = null;
  if (typeof EVIDENCIA_EN_DISCO !== 'undefined' && EVIDENCIA_EN_DISCO.has(id)) {
    blob = EVIDENCIA_EN_DISCO.get(id);
  } else {
    try {
      const reg = await Almacen.evidenciaUna(post.ejecucion_id, id);
      if (reg && reg.bytes) blob = new Blob([reg.bytes], { type: 'image/jpeg' });
    } catch (e) { return null; }
  }
  if (!blob) return null;
  try {
    const opciones = anchoDestino ? { resizeWidth: anchoDestino, resizeQuality: 'high' } : undefined;
    return await createImageBitmap(blob, opciones);
  } catch (e) {
    try { return await createImageBitmap(blob); } catch (x) { return null; }
  }
}
