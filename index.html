<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incertis Anubis · Análisis</title>
<style>
/* ===================================================================
   INCERTIS ANUBIS · Panel de análisis
   Archivo único. Sin dependencias externas. Los gráficos son SVG propio.
   =================================================================== */

:root {
  color-scheme: light;
  --plano:        #f9f9f7;
  --sup:          #fcfcfb;
  --tinta:        #0b0b0b;
  --tinta-2:      #52514e;
  --tinta-3:      #898781;
  --grilla:       #e1e0d9;
  --eje:          #c3c2b7;
  --borde:        rgba(11,11,11,0.10);
  --marca:        #16233d;

  --s1: #2a78d6;  /* azul     */
  --s2: #eb6834;  /* naranja  */
  --s3: #1baf7a;  /* aqua     */
  --s4: #eda100;  /* amarillo */
  --neutro:       #b9b8b1;
  --ok:           #006300;

  /* Rampa ordinal para las cuatro señales: van de menor a mayor esfuerzo
     de la audiencia, así que el color también va de claro a oscuro. */
  --o1: #86b6ef;  --o2: #5598e7;  --o3: #2a78d6;  --o4: #184f95;

  /* Colores de marca de las cuentas de referencia */
  --rojo:   #e34948;   /* Clarín */
  --violeta:#4a3aa7;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plano:   #0d0d0d;
    --sup:     #1a1a19;
    --tinta:   #ffffff;
    --tinta-2: #c3c2b7;
    --tinta-3: #898781;
    --grilla:  #2c2c2a;
    --eje:     #383835;
    --borde:   rgba(255,255,255,0.10);
    --marca:   #10192c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --neutro: #55544f;
    --ok: #0ca30c;
    --o1: #cde2fb; --o2: #9ec5f4; --o3: #5598e7; --o4: #256abf;
    --rojo: #e66767; --violeta: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plano:#0d0d0d; --sup:#1a1a19; --tinta:#fff; --tinta-2:#c3c2b7; --tinta-3:#898781;
  --grilla:#2c2c2a; --eje:#383835; --borde:rgba(255,255,255,0.10); --marca:#10192c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --neutro:#55544f; --ok:#0ca30c;
  --o1:#cde2fb; --o2:#9ec5f4; --o3:#5598e7; --o4:#256abf;
  --rojo:#e66767; --violeta:#9085e9;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--plano);
  color: var(--tinta);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* ---------- barra ---------- */
.barra {
  background: var(--marca); color: #fff;
  padding: 13px 22px; display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 30;
}
.logo { font-weight: 700; letter-spacing: .12em; font-size: 14px; }
.barra .sub { color: #9fadc6; font-size: 12px; }
.barra .der { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* ---------- controles ---------- */
button, select, input {
  font: inherit; border-radius: 6px; border: 1px solid var(--borde);
  background: var(--sup); color: var(--tinta); padding: 7px 12px;
}
button { cursor: pointer; font-weight: 600; }
button:hover { background: var(--plano); }
button.primario { background: #fff; color: var(--marca); border-color: transparent; }
button.fantasma { background: transparent; color: #cdd6e6; border-color: rgba(255,255,255,.25); }
button.fantasma:hover { background: rgba(255,255,255,.1); }
button.chip {
  padding: 5px 13px; border-radius: 99px; font-size: 13px;
  background: transparent; color: var(--tinta-2); border-color: var(--borde);
}
button.chip[aria-pressed="true"] { background: var(--tinta); color: var(--sup); border-color: var(--tinta); }
.oculto { display: none !important; }

/* ---------- estructura ---------- */
.envoltorio { max-width: 1180px; margin: 0 auto; padding: 20px 18px 60px; }
.filtros {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  padding: 12px 14px; background: var(--sup); border: 1px solid var(--borde);
  border-radius: 9px; margin-bottom: 18px;
}
.filtros label { font-size: 12px; font-weight: 600; color: var(--tinta-2); }

.pestanas { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

h2.seccion {
  font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--tinta-2); margin: 28px 0 4px; font-weight: 700;
}
p.explica { margin: 0 0 14px; color: var(--tinta-2); max-width: 70ch; font-size: 13px; }

.tarjeta {
  background: var(--sup); border: 1px solid var(--borde);
  border-radius: 9px; padding: 16px 18px 18px; margin-bottom: 16px;
}
.tarjeta h3 { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
.tarjeta .sub { margin: 0 0 14px; font-size: 12px; color: var(--tinta-3); }
.cabTarjeta { display: flex; align-items: flex-start; gap: 12px; }
.cabTarjeta .crece { flex: 1 1 auto; min-width: 0; }
.par { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .par { grid-template-columns: 1fr; } }

/* ---------- fichas ---------- */
.fichas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.ficha { background: var(--sup); border: 1px solid var(--borde); border-radius: 9px; padding: 13px 15px; }
.ficha .v { display: block; font-size: 26px; font-weight: 700; line-height: 1.15; }
.ficha .e { display: block; font-size: 11px; color: var(--tinta-3); margin-top: 3px; }
.ficha .n { display: block; font-size: 11px; color: var(--tinta-2); margin-top: 5px; }

/* ---------- leyenda ---------- */
.leyenda { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 12px; font-size: 12px; color: var(--tinta-2); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ---------- barras (HTML, para que el texto no se escale) ----------
   La grilla vive en el contenedor y las filas usan display:contents, así
   las cinco columnas son las mismas para todas: etiquetas, comienzos de
   barra y valores quedan alineados. Con una grilla por fila, cada una
   media sus columnas por separado y todo salía escalonado. */
.barras {
  display: grid;
  grid-template-columns: minmax(60px, max-content) 1fr max-content;
  column-gap: 10px; row-gap: 5px; align-items: center;
}
.barras.conSec { grid-template-columns: minmax(60px, max-content) 1fr max-content max-content; }
.fila { display: contents; }
.fila .et { font-size: 12px; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila .pista { display: flex; align-items: center; min-height: 30px; }
.fila .bar { display: block; height: 22px; border-radius: 0 4px 4px 0; }
.fila .val { font-size: 12px; font-weight: 700; color: var(--tinta-2); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: left; }
.fila .val2 { font-size: 11px; color: var(--tinta-3); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.pista:hover .bar { filter: brightness(1.08); }
/* Apiladas: 2px de superficie entre segmentos, sin bordes */
.pista.apilada { display: flex; height: 22px; }
.pista.apilada .seg { display: block; height: 100%; margin-right: 2px; cursor: pointer; }
.pista.apilada .seg:last-child { margin-right: 0; border-radius: 0 4px 4px 0; }
.pista.apilada .seg:hover { filter: brightness(1.1); }
.pista.apilada .seg { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.segTxt { font-style: normal; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 4px; }
.comoSeLee {
  background: var(--plano); border: 1px solid var(--borde); border-radius: 7px;
  padding: 10px 13px; margin: 0 0 14px; font-size: 13px; color: var(--tinta-2); max-width: 72ch;
}
.comoSeLee strong { color: var(--tinta); }
.selDenom { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; flex-wrap: wrap; }
.selDenom .etq { font-size: 12px; font-weight: 600; color: var(--tinta-2); }

/* ---------- gráficos ---------- */
svg { display: block; width: 100%; height: auto; overflow: visible; }
.gtxt { font: 11px system-ui, sans-serif; fill: var(--tinta-3); }
.gtxt.val { fill: var(--tinta-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.gtxt.ident { fill: var(--tinta); font-weight: 600; font-size: 12px; }
.marca-hit { fill: transparent; cursor: pointer; }

/* ---------- tabla ---------- */
table.datos { width: 100%; border-collapse: collapse; font-size: 13px; }
table.datos th, table.datos td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grilla); }
table.datos th:first-child, table.datos td:first-child { text-align: left; }
table.datos th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-3); font-weight: 700; }
table.datos td { font-variant-numeric: tabular-nums; }
.envTabla { overflow-x: auto; }

/* ---------- tooltip ---------- */
#tip {
  position: fixed; pointer-events: none; z-index: 60;
  background: var(--tinta); color: var(--sup);
  padding: 7px 10px; border-radius: 6px; font-size: 12px; line-height: 1.45;
  opacity: 0; transition: opacity .12s; max-width: 260px;
}
#tip b { font-variant-numeric: tabular-nums; }

/* ---------- preguntas ---------- */
textarea { width: 100%; font: inherit; padding: 10px 12px; border-radius: 6px;
  border: 1px solid var(--borde); background: var(--sup); color: var(--tinta); resize: vertical; }
/* La respuesta se lee como una nota: columna angosta, porque una línea de
   ciento veinte caracteres obliga al ojo a buscar dónde empieza la siguiente.
   Tablas y gráficos sí pueden ocupar todo el ancho: ahí el dato es la forma. */
.respuesta { background: var(--plano); border: 1px solid var(--borde);
  border-radius: 8px; padding: 22px 26px; margin-top: 14px; }
.respuesta > * { max-width: 62ch; }
.respuesta > .envTabla, .respuesta > .figIA, .respuesta > pre { max-width: 100%; }
.respuesta p { margin: 0 0 14px; line-height: 1.62; font-size: 15px; }
.respuesta p:last-child { margin-bottom: 0; }
.respuesta h3 { font-size: 15px; margin: 22px 0 8px; letter-spacing: -.01em; }
.respuesta h3:first-child { margin-top: 0; }
.respuesta ul, .respuesta ol { margin: 0 0 14px; padding-left: 22px; line-height: 1.6; font-size: 15px; }
.respuesta li { margin-bottom: 5px; }
.respuesta code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
  background: var(--sup); border: 1px solid var(--borde); border-radius: 4px; padding: 1px 5px; }
.respuesta pre { background: var(--sup); border: 1px solid var(--borde); border-radius: 6px;
  padding: 12px 14px; overflow-x: auto; font-size: 13px; }
.respuesta .envTabla, .respuesta .figIA { margin: 18px 0; }
.figIA { margin: 0; }
.figIA figcaption { font-size: 13px; color: var(--tinta-2); margin-bottom: 10px; }

/* Caja de pregunta: micrófono, campo y enviar en una sola línea */
.cajaPregunta { display: flex; align-items: flex-end; gap: 10px; }
.cajaPregunta textarea { flex: 1; min-height: 46px; }
.microfono { display: inline-flex; align-items: center; justify-content: center;
  width: 46px; height: 46px; flex: 0 0 46px; padding: 0; border-radius: 50%;
  border: 1px solid var(--borde); background: var(--sup); color: var(--tinta-2); cursor: pointer; }
.microfono:hover { color: var(--marca); border-color: var(--marca); }
.microfono.escuchando { background: var(--marca); border-color: var(--marca); color: #fff;
  animation: pulso 1.4s ease-in-out infinite; }
@keyframes pulso {
  0%, 100% { box-shadow: 0 0 0 0 rgba(27, 74, 145, .45); }
  50%      { box-shadow: 0 0 0 7px rgba(27, 74, 145, 0); }
}
@media (prefers-reduced-motion: reduce) { .microfono.escuchando { animation: none; } }
.enviarPregunta { height: 46px; }
.pieCaja { display: flex; align-items: center; gap: 12px; margin-top: 8px;
  font-size: 12px; color: var(--tinta-3); }
.pieCaja > span { flex: 1; }
details.claves { margin-bottom: 16px; }
.aviso { background: #fdf6e7; border: 1px solid #ecd9a9; color: #6d4d0c;
  border-radius: 7px; padding: 11px 13px; font-size: 13px; }
:root[data-theme="dark"] .aviso, :root:not([data-theme="light"]) .aviso { }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .aviso { background: #2a2413; border-color: #4d4224; color: #e5cf9a; }
}
:root[data-theme="dark"] .aviso { background: #2a2413; border-color: #4d4224; color: #e5cf9a; }

.vacio { text-align: center; padding: 70px 20px; color: var(--tinta-3); }
.vacio h2 { color: var(--tinta); font-size: 20px; margin: 0 0 8px; }

/* ---------- película ---------- */
.barraProgreso { height: 6px; background: var(--plano); border: 1px solid var(--borde);
  border-radius: 99px; overflow: hidden; }
.barraProgreso > div { height: 100%; background: var(--marca); width: 0; transition: width .2s; }
.filaCarpeta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rutaCarpeta { font-size: 13px; color: var(--tinta-3); flex: 1; min-width: 180px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.chico { font-size: 12px; padding: 5px 11px; }
#vLienzo { display: block; max-height: 62vh; object-fit: contain; }

/* ---------- elegir cliente ---------- */
button.cliente {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 14px;
  width: 100%; text-align: left; padding: 13px 16px; border-radius: 9px;
  border: 1px solid var(--borde); background: var(--sup); cursor: pointer;
}
button.cliente:hover { border-color: var(--marca); background: var(--plano); }
button.cliente:disabled { opacity: .5; cursor: default; }
.clNombre { grid-column: 1; grid-row: 1; font-size: 16px; font-weight: 650; color: var(--tinta); }
.clDatos  { grid-column: 1; grid-row: 2; font-size: 12px; color: var(--tinta-3); }
.clFechas { grid-column: 2; grid-row: 1 / span 2; font-size: 12px; color: var(--tinta-3); align-self: center; }
.cargando { background: var(--plano); border: 1px solid var(--borde); border-radius: 7px;
  padding: 11px 13px; font-size: 13px; color: var(--tinta-2); }

</style>
</head>
<body>

<header class="barra">
  <span class="logo">INCERTIS ANUBIS</span>
  <span class="sub">Panel de análisis · v3.6</span>
  <span class="der">
    <button class="fantasma" id="btnTema" title="Cambiar tema">Tema</button>
    <button class="fantasma" id="btnInforme" title="Descargar el informe en .pptx, que Keynote abre">Descargar informe</button>
    <button class="primario" id="btnCargar">Cargar paquetes</button>
  </span>
</header>

<input type="file" id="selCarpeta" webkitdirectory directory multiple class="oculto">
<input type="file" id="selArchivos" multiple accept=".jsonl,.json" class="oculto">

<div class="envoltorio">

  <section id="vacio" class="vacio">
    <h2>No hay datos cargados</h2>
    <p>Las capturas que haga el recolector aparecen acá solas.<br>
       Si todavía no corriste ninguna, empezá por el recolector.</p>
    <div id="desdeNavegador" class="oculto" style="margin:26px 0 10px"></div>
    <div id="desdeCarpeta" class="oculto" style="margin:22px 0 10px"></div>

    <p style="margin-top:24px;font-size:13px;color:var(--tinta-3)">
      <button id="btnGitHub">Cargar desde GitHub</button>
      <button id="btnCargar2">o desde una carpeta</button>
      <button id="btnArchivos">o archivos sueltos</button>
    </p>
    <div id="desdeGitHub" class="oculto" style="margin:22px auto 10px;max-width:560px;text-align:left"></div>
    <p style="margin-top:20px">
      <button id="btnAcceso" style="font-size:12px">Preparar el acceso del equipo</button></p>
  </section>

  <div id="app" class="oculto">

    <div class="filtros">
      <label for="fMercado">Mercado</label>
      <select id="fMercado"></select>
      <label for="fPeriodo">Ejecución</label>

        <option value="dentro">Sólo dentro del período</option>
        <option value="todas">Todas las capturadas</option>
      </select>
      <span style="margin-left:auto;font-size:12px;color:var(--tinta-3)" id="resumenCarga"></span>
    </div>

    <div class="pestanas">
      <button class="chip" data-vista="comparado" aria-pressed="true">Comparado</button>
      <button class="chip" data-vista="propio" aria-pressed="false">Cuenta propia</button>
      <button class="chip" data-vista="agenda" aria-pressed="false">Temas y agenda</button>
      <button class="chip" data-vista="preguntas" aria-pressed="false">Preguntas</button>

    <div id="vComparado"></div>
    <div id="vPropio" class="oculto"></div>
    <div id="vAgenda" class="oculto"></div>
    <div id="vPreguntas" class="oculto"></div>
    <div id="vPelicula" class="oculto"></div>
  </div>
</div>

<div id="tip" role="status" aria-live="polite"></div>

<script>
// INCERTIS X · zip v0.1.0
// Escritor ZIP mínimo sin compresión (método 0 · store), sin dependencias
// externas. La CSP de MV3 impide cargar librerías desde una CDN, así que el
// empaquetado se resuelve acá.
//
// API pública:
//   IncertisZip.crear([{ nombre, datos }]) -> Promise<Blob>
//   datos puede ser string (se codifica UTF-8) o Uint8Array / ArrayBuffer.

(function (global) {
  'use strict';

  const VERSION = '0.1.0';

  // --- CRC32 -------------------------------------------------------------
  let TABLA = null;
  function tablaCrc() {
    if (TABLA) return TABLA;
    TABLA = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      TABLA[n] = c >>> 0;
    }
    return TABLA;
  }

  function crc32(buf) {
    const t = tablaCrc();
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = t[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // --- helpers -----------------------------------------------------------
  function aBytes(datos) {
    if (typeof datos === 'string') return new TextEncoder().encode(datos);
    if (datos instanceof Uint8Array) return datos;
    if (datos instanceof ArrayBuffer) return new Uint8Array(datos);
    throw new Error('Tipo de dato no soportado en el ZIP');
  }

  function fechaDos(d) {
    const anio = Math.max(1980, d.getFullYear());
    const fecha = ((anio - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const hora = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
    return { fecha: fecha & 0xFFFF, hora: hora & 0xFFFF };
  }

  function escritor(tam) {
    const buf = new Uint8Array(tam);
    let p = 0;
    return {
      buf,
      u16(v) { buf[p++] = v & 0xFF; buf[p++] = (v >>> 8) & 0xFF; },
      u32(v) { buf[p++] = v & 0xFF; buf[p++] = (v >>> 8) & 0xFF; buf[p++] = (v >>> 16) & 0xFF; buf[p++] = (v >>> 24) & 0xFF; },
      bytes(b) { buf.set(b, p); p += b.length; },
      get pos() { return p; }
    };
  }

  // --- API ---------------------------------------------------------------
  async function crear(entradas) {
    const ahora = new Date();
    const { fecha, hora } = fechaDos(ahora);

    const preparadas = entradas.map(e => {
      const nombre = new TextEncoder().encode(e.nombre);
      const datos = aBytes(e.datos);
      return { nombre, datos, crc: crc32(datos) };
    });

    let tamLocal = 0;
    let tamCentral = 0;
    for (const e of preparadas) {
      tamLocal += 30 + e.nombre.length + e.datos.length;
      tamCentral += 46 + e.nombre.length;
    }

    const w = escritor(tamLocal + tamCentral + 22);
    const offsets = [];

    // Encabezados locales + datos
    for (const e of preparadas) {
      offsets.push(w.pos);
      w.u32(0x04034b50);           // firma local
      w.u16(20);                   // versión necesaria
      w.u16(0x0800);               // bandera: nombres en UTF-8
      w.u16(0);                    // método: store
      w.u16(hora);
      w.u16(fecha);
      w.u32(e.crc);
      w.u32(e.datos.length);       // comprimido
      w.u32(e.datos.length);       // sin comprimir
      w.u16(e.nombre.length);
      w.u16(0);                    // extra
      w.bytes(e.nombre);
      w.bytes(e.datos);
    }

    // Directorio central
    const inicioCentral = w.pos;
    for (let i = 0; i < preparadas.length; i++) {
      const e = preparadas[i];
      w.u32(0x02014b50);           // firma central
      w.u16(20);                   // versión que creó
      w.u16(20);                   // versión necesaria
      w.u16(0x0800);
      w.u16(0);
      w.u16(hora);
      w.u16(fecha);
      w.u32(e.crc);
      w.u32(e.datos.length);
      w.u32(e.datos.length);
      w.u16(e.nombre.length);
      w.u16(0);                    // extra
      w.u16(0);                    // comentario
      w.u16(0);                    // disco
      w.u16(0);                    // atributos internos
      w.u32(0);                    // atributos externos
      w.u32(offsets[i]);
      w.bytes(e.nombre);
    }
    const tamDirectorio = w.pos - inicioCentral;

    // Fin del directorio central
    w.u32(0x06054b50);
    w.u16(0);
    w.u16(0);
    w.u16(preparadas.length);
    w.u16(preparadas.length);
    w.u32(tamDirectorio);
    w.u32(inicioCentral);
    w.u16(0);

  function desdeDataUrl(dataUrl) {
    const coma = dataUrl.indexOf(',');
    const b64 = dataUrl.slice(coma + 1);
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

    try {
      const buf = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');

  function cuadroTexto(x, y, cx, cy, corridas, opt) {
    opt = opt || {};

      : `<a:pPr algn="${opt.algn || 'l'}"/>`;

      cs.map(c =>

        `<a:solidFill><a:srgbClr val="${hex(c.color || TINTA)}"/></a:solidFill>` +
        `<a:latin typeface="${FUENTE}"/></a:rPr><a:t>${esc(c.t)}</a:t></a:r>`).join('') +

      `<p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr>` +
      `<p:spPr><a:xfrm><a:off x="${Math.round(x)}" y="${Math.round(y)}"/>` +
      `<a:ext cx="${Math.round(cx)}" cy="${Math.round(cy)}"/></a:xfrm>` +
      `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr>` +
      `<p:txBody><a:bodyPr wrap="square" anchor="${opt.anchor || 't'}" lIns="0" tIns="0" rIns="0" bIns="0"/>` +
      `<a:lstStyle/>${parrafos}</p:txBody></p:sp>`;

      `<p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr>` +
      `<a:xfrm><a:off x="${Math.round(x)}" y="${Math.round(y)}"/>` +
      `<a:ext cx="${Math.round(Math.max(cx, 1))}" cy="${Math.round(cy)}"/></a:xfrm>` +
      `<a:prstGeom prst="${opt.redondo ? 'roundRect' : 'rect'}"><a:avLst${opt.redondo ? '><a:gd name="adj" fmla="val 16000"/></a:avLst' : '/'}></a:prstGeom>` +
      `<a:solidFill><a:srgbClr val="${hex(color)}"/></a:solidFill><a:ln><a:noFill/></a:ln></p:spPr>` +

      seccion(titulo, bajada) {

      // Barras horizontales como figuras editables

        const xEt = MARGEN, anchoEt = 1900000;

        slides.push(s);

      },

      texto(titulo, parrafos) {

        s += cuadroTexto(MARGEN, 1450000, W - MARGEN * 2 - 1500000, H - 2400000,

<script>
// INCERTIS ANUBIS · almacen v1.0
// Guarda las capturas dentro del navegador, en el almacenamiento de la propia
// extensión. Es el camino por defecto: no hay carpeta que elegir, permiso que
// caduque ni handle que se muera al actualizar la extensión.
//
// El disco queda como exportación opcional, para archivar o compartir.
//
// API:
//   await Almacen.guardar({ id, nombre, resumen, manifest, posts, observaciones, eventos, evidencias })
//   await Almacen.listar()            -> [{id, nombre, creada, publicaciones, evidencias, bytes}]
//   await Almacen.leer(id)            -> { resumen, manifest, posts, observaciones, eventos }
//   await Almacen.evidencias(id)      -> [{id, bytes}]
//   await Almacen.borrar(id)
//   await Almacen.espacio()           -> { usado, cuota }

(function (global) {
  'use strict';

  const DB = 'anubis_datos', V = 1;
  const EJEC = 'ejecuciones', EVID = 'evidencias';

  function abrir() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, V);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains(EJEC)) db.createObjectStore(EJEC, { keyPath: 'id' });
        if (!db.objectStoreNames.contains(EVID)) {
          const s = db.createObjectStore(EVID, { keyPath: 'clave' });
          s.createIndex('porEjecucion', 'ejecucion', { unique: false });
        }
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }

  function correr(store, modo, fn) {
    return abrir().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, modo);
      const s = t.objectStore(store);
      let salida;
      try { salida = fn(s); } catch (e) { rej(e); return; }
      t.oncomplete = () => res(salida && salida.__valor !== undefined ? salida.__valor : salida);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('transacción abortada'));
    }));
  }

  function pedir(req) {
    return new Promise((res, rej) => {
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }

  // La evidencia va en registros propios para poder borrarla sin perder los
  // datos: es el 99% del peso y lo primero que conviene liberar.
  async function guardar(paq) {
    const texto = {
      posts: paq.posts.map(p => JSON.stringify(p)).join('\n'),
      observaciones: (paq.observaciones || []).map(o => JSON.stringify(o)).join('\n'),
      eventos: (paq.eventos || []).map(e => JSON.stringify(e)).join('\n')
    };
    const bytesTexto = texto.posts.length + texto.observaciones.length + texto.eventos.length;
    const bytesEvid = (paq.evidencias || []).reduce((s, e) => s + (e.bytes ? e.bytes.length : 0), 0);

    await correr(EJEC, 'readwrite', s => s.put({
      id: paq.id,
      nombre: paq.nombre || paq.id,
      creada: new Date().toISOString(),
      resumen: paq.resumen || null,
      manifest: paq.manifest || null,
      texto,
      publicaciones: paq.posts.length,
      evidencias: (paq.evidencias || []).length,
      bytes: bytesTexto + bytesEvid
    }));

    if (paq.evidencias && paq.evidencias.length) {
      const db = await abrir();
      // En lotes: una transacción con 400 escrituras puede quedarse sin memoria.
      const LOTE = 50;
      for (let i = 0; i < paq.evidencias.length; i += LOTE) {
        const trozo = paq.evidencias.slice(i, i + LOTE);
        await new Promise((res, rej) => {
          const t = db.transaction(EVID, 'readwrite');
          const s = t.objectStore(EVID);
          for (const ev of trozo) {
            s.put({ clave: paq.id + '/' + ev.id, ejecucion: paq.id, id: ev.id, bytes: ev.bytes });
          }
          t.oncomplete = res;
          t.onerror = () => rej(t.error);
        });
      }
    }
    return { id: paq.id, publicaciones: paq.posts.length, evidencias: (paq.evidencias || []).length };
  }

  async function listar() {
    const db = await abrir();
    const todas = await pedir(db.transaction(EJEC, 'readonly').objectStore(EJEC).getAll());
    return todas
      .map(e => ({ id: e.id, nombre: e.nombre, creada: e.creada,
                   publicaciones: e.publicaciones, evidencias: e.evidencias, bytes: e.bytes,
                   periodo: (e.resumen && e.resumen.periodo) || (e.manifest && e.manifest.periodo) || null }))
      .sort((a, b) => String(b.creada).localeCompare(String(a.creada)));
  }

  async function leer(id) {
    const db = await abrir();
    const e = await pedir(db.transaction(EJEC, 'readonly').objectStore(EJEC).get(id));
    if (!e) return null;
    const lineas = t => (t || '').split('\n').filter(Boolean).map(l => {
      try { return JSON.parse(l); } catch (x) { return null; }
    }).filter(Boolean);
    return {
      id: e.id, nombre: e.nombre, resumen: e.resumen, manifest: e.manifest,
      posts: lineas(e.texto.posts),
      observaciones: lineas(e.texto.observaciones),
      eventos: lineas(e.texto.eventos)
    };
  }

  async function evidencias(id) {
    const db = await abrir();
    const idx = db.transaction(EVID, 'readonly').objectStore(EVID).index('porEjecucion');
    return await pedir(idx.getAll(IDBKeyRange.only(id)));
  }

  // Una sola evidencia por su clave. La película recorre cientos de capturas y
  // no puede traerlas todas juntas: son decenas de megas.
  async function evidenciaUna(ejecucion, id) {
    const db = await abrir();
    return await pedir(db.transaction(EVID, 'readonly').objectStore(EVID).get(ejecucion + '/' + id));
  }

  // Qué evidencias hay realmente guardadas, sin traer los bytes. La película
  // necesita saberlo antes de empezar: un paquete cargado desde disco trae las
  // referencias pero no las imágenes.
  async function clavesEvidencia(ejecucion) {
    const db = await abrir();
    const claves = await pedir(db.transaction(EVID, 'readonly').objectStore(EVID)
      .index('porEjecucion').getAllKeys(IDBKeyRange.only(ejecucion)));
    return new Set(claves.map(k => String(k).slice(String(ejecucion).length + 1)));
  }

  async function borrar(id) {
    await correr(EJEC, 'readwrite', s => s.delete(id));
    const db = await abrir();
    const claves = await pedir(db.transaction(EVID, 'readonly').objectStore(EVID)
      .index('porEjecucion').getAllKeys(IDBKeyRange.only(id)));
    if (claves.length) {
      const LOTE = 200;
      for (let i = 0; i < claves.length; i += LOTE) {
        await new Promise(res => {
          const t = db.transaction(EVID, 'readwrite');
          const s = t.objectStore(EVID);
          for (const k of claves.slice(i, i + LOTE)) s.delete(k);
          t.oncomplete = res; t.onerror = res;
        });
      }
    }
  }

  // Libera sólo la evidencia y conserva los datos: recupera casi todo el
  // espacio sin perder el análisis.
  async function borrarEvidencia(id) {
    const db = await abrir();
    const claves = await pedir(db.transaction(EVID, 'readonly').objectStore(EVID)
      .index('porEjecucion').getAllKeys(IDBKeyRange.only(id)));
    for (let i = 0; i < claves.length; i += 200) {
      await new Promise(res => {
        const t = db.transaction(EVID, 'readwrite');
        const s = t.objectStore(EVID);
        for (const k of claves.slice(i, i + 200)) s.delete(k);
        t.oncomplete = res; t.onerror = res;
      });
    }
    const e = await pedir(db.transaction(EJEC, 'readonly').objectStore(EJEC).get(id));
    if (e) {
      e.evidencias = 0;
      e.bytes = e.texto.posts.length + e.texto.observaciones.length + e.texto.eventos.length;
      await correr(EJEC, 'readwrite', s => s.put(e));
    }
  }

  async function espacio() {
    try {
      const est = await navigator.storage.estimate();
      return { usado: est.usage || 0, cuota: est.quota || 0 };
    } catch (e) { return { usado: 0, cuota: 0 }; }
  }

  global.Almacen = { guardar, listar, leer, evidencias, evidenciaUna, clavesEvidencia,
                     borrar, borrarEvidencia, espacio };
})(self);

</script>
<script>
// INCERTIS ANUBIS · github v1.0
//
// Cliente mínimo de la API de contenidos de GitHub. Lo usan los dos lados: el
// recolector para publicar el día, el panel para leerlo.
//
// Por qué la API y no git: no hay git en un navegador. La API de contenidos
// escribe un archivo por llamada y eso alcanza, porque cada día es un archivo
// y nunca se reescribe lo viejo.
//
// Por qué los datos van en un repo privado y el panel en uno público: GitHub
// Pages no publica desde repos privados en el plan gratuito, y aun pagando, el
// sitio publicado sigue siendo público. Entonces el código se publica y los
// datos se piden con el token de cada persona: el control de acceso lo hace
// GitHub, que sabe quién está en el repo, y no una contraseña nuestra.

(function (global) {
  'use strict';

  const RAIZ = 'datos';
  const INDICE = RAIZ + '/indice.json';

  // btoa sólo acepta latin-1: un titular con tildes o emojis lo rompe.
  function aBase64(texto) {
    const bytes = new TextEncoder().encode(texto);
    let bin = '';
    const LOTE = 0x8000;   // fromCharCode con medio millón de argumentos revienta la pila
    for (let i = 0; i < bytes.length; i += LOTE) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + LOTE));
    }
    return btoa(bin);
  }

  function deBase64(b64) {
    const bin = atob(String(b64).replace(/\s/g, ''));
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(u);
  }

  function url(cfg, ruta) {
    return `https://api.github.com/repos/${encodeURIComponent(cfg.duenio)}/${encodeURIComponent(cfg.repo)}` +
           `/contents/${ruta.split('/').map(encodeURIComponent).join('/')}`;
  }

  function cabeceras(cfg, accept) {
    return {
      authorization: 'Bearer ' + cfg.token,
      accept: accept || 'application/vnd.github+json',
      'x-github-api-version': '2022-11-28'
    };
  }

  // Los errores de GitHub se traducen acá y no en cada pantalla: son siempre
  // los mismos cuatro y el mensaje crudo no le dice nada a nadie.
  async function fallo(r) {
    let detalle = '';
    try { const j = await r.json(); detalle = j.message || ''; } catch (e) {}
    if (r.status === 401) return new Error('El token no sirve o venció.');
    if (r.status === 403) {
      return new Error(/rate limit/i.test(detalle)
        ? 'GitHub cortó por límite de peticiones. Esperá unos minutos.'
        : 'El token no tiene permiso sobre ese repositorio.');
    }
    if (r.status === 404) {
      return new Error('No encontrado. Puede ser que el repositorio no exista, ' +
        'que el nombre esté mal escrito, o que el token no tenga acceso: ' +
        'a un repo privado sin permiso GitHub responde lo mismo que si no existiera.');
    }
    if (r.status === 409 || r.status === 422) {
      return new Error('El archivo cambió en GitHub mientras lo escribíamos. Probá de nuevo.');
    }
    return new Error(`GitHub respondió ${r.status}${detalle ? ': ' + detalle : ''}`);
  }

  // Devuelve { texto, sha } o null si el archivo no existe todavía.
  //
  // Se pide primero en JSON, que trae el sha —imprescindible para sobrescribir—
  // y el contenido en base64. Arriba de 1 MB GitHub devuelve ese campo vacío,
  // y ahí sí hace falta una segunda llamada en crudo: un día de cinco cuentas
  // pasa ese tope sin esfuerzo.
  async function leer(cfg, ruta) {
    const r = await fetch(url(cfg, ruta), { headers: cabeceras(cfg), cache: 'no-store' });
    if (r.status === 404) return null;
    if (!r.ok) throw await fallo(r);
    const j = await r.json();
    if (j.content && j.encoding === 'base64') return { texto: deBase64(j.content), sha: j.sha };
    // Arriba de 1 MB el campo content viene vacío y hay que pedirlo en crudo.
    return { texto: await leerTexto(cfg, ruta), sha: j.sha };
  }

  // Una sola petición, en crudo, para los archivos de datos.
  //
  // Antes se pedía primero en JSON y, si venía vacío, se repetía en crudo. Dos
  // peticiones a la misma URL que sólo se diferencian en la cabecera Accept es
  // pedirle problemas a la caché del navegador: puede devolver la respuesta
  // JSON guardada para la petición cruda, y entonces lo que llega no son las
  // publicaciones sino los metadatos del archivo. Ninguna línea parsea y el
  // resultado es un día sin publicaciones, sin ningún error de por medio.
  async function leerTexto(cfg, ruta) {
    const r = await fetch(url(cfg, ruta), {
      headers: cabeceras(cfg, 'application/vnd.github.raw'), cache: 'no-store' });
    if (r.status === 404) return null;
    if (!r.ok) throw await fallo(r);
    const texto = await r.text();
    // Si el servidor ignoró el Accept y mandó metadatos, mejor decirlo que
    // devolver algo que después no parsea.
    if (/^\s*\{\s*"(name|sha|size|content|encoding)"/.test(texto.slice(0, 200))) {
      throw new Error('GitHub devolvió los metadatos del archivo en vez de su contenido. ' +
        'Recargá la página forzando (Cmd+Shift+R) y probá de nuevo.');
    }
    return texto;
  }

  // Sólo el sha, para sobrescribir sin bajar un archivo que no vamos a leer.
  async function sha(cfg, ruta) {
    const r = await fetch(url(cfg, ruta), { headers: cabeceras(cfg) });
    if (r.status === 404) return null;
    if (!r.ok) throw await fallo(r);
    const j = await r.json();
    return j.sha || null;
  }

  async function escribir(cfg, ruta, texto, mensaje) {
    const previo = await sha(cfg, ruta).catch(() => null);
    const cuerpo = {
      message: mensaje || ('Anubis: ' + ruta),
      content: aBase64(texto)
    };
    if (previo) cuerpo.sha = previo;
    const r = await fetch(url(cfg, ruta), {
      method: 'PUT', headers: { ...cabeceras(cfg), 'content-type': 'application/json' },
      body: JSON.stringify(cuerpo)
    });
    if (!r.ok) throw await fallo(r);
    const j = await r.json();
    return { sha: j.content && j.content.sha, bytes: new TextEncoder().encode(texto).length };
  }

  // El índice existe para que el panel sepa qué días hay sin bajar nada: una
  // sola petición chica en vez de listar el árbol y abrir archivo por archivo.
  async function leerIndice(cfg) {
    const r = await leer(cfg, INDICE);
    if (!r) return { actualizado: null, capturas: [] };
    try {
      const j = JSON.parse(r.texto);
      return { actualizado: j.actualizado || null, capturas: Array.isArray(j.capturas) ? j.capturas : [] };
    } catch (e) {
      throw new Error('El índice del repositorio está corrupto: ' + e.message);
    }
  }

  // Alta o reemplazo por nombre de archivo: correr dos veces el mismo día
  // actualiza la entrada en vez de duplicarla.
  async function anotarEnIndice(cfg, entrada) {
    const idx = await leerIndice(cfg);
    const otras = idx.capturas.filter(c => c.archivo !== entrada.archivo);
    const capturas = otras.concat([entrada]).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    const texto = JSON.stringify({ actualizado: new Date().toISOString(), capturas }, null, 2);
    await escribir(cfg, INDICE, texto, `Anubis: índice (${capturas.length} capturas)`);
    return capturas.length;
  }

  async function publicarCaptura(cfg, { archivo, texto, entrada, alProgreso }) {
    const p = alProgreso || (() => {});
    p(`Subiendo ${archivo}…`);
    const r = await escribir(cfg, RAIZ + '/' + archivo, texto,
      `Anubis: captura ${entrada.fecha} · ${entrada.mercado}`);
    p('Actualizando el índice…');
    const total = await anotarEnIndice(cfg, { ...entrada, archivo, subido: new Date().toISOString(), bytes: r.bytes });
    return { bytes: r.bytes, capturas: total };
  }

  async function bajarCaptura(cfg, archivo) {
    const texto = await leerTexto(cfg, RAIZ + '/' + archivo);
    if (texto === null) throw new Error('El archivo ' + archivo + ' ya no está en el repositorio.');
    return texto;
  }

  // Comprobación previa: dice si el token entra y si puede escribir, antes de
  // que el usuario descubra el problema al final de una captura de veinte
  // minutos.
  async function probar(cfg) {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.duenio)}/${encodeURIComponent(cfg.repo)}`,
      { headers: cabeceras(cfg) });
    if (!r.ok) throw await fallo(r);
    const j = await r.json();
    return {
      nombre: j.full_name,
      privado: !!j.private,
      escribe: !!(j.permissions && (j.permissions.push || j.permissions.admin)),
      rama: j.default_branch
    };
  }

  global.GitHub = { leer, leerTexto, sha, escribir, leerIndice, anotarEnIndice,
                    publicarCaptura, bajarCaptura, probar, aBase64, deBase64, RAIZ, INDICE };
})(self);

</script>
<script>
'use strict';
const VERSION = '3.4';
console.log('[ANUBIS] panel de análisis v' + VERSION);

// ====================================================================
// Estado
// ====================================================================
const D = {
  posts: [],          // todas las publicaciones de todas las ejecuciones
  ejecuciones: [],    // {id, periodo, mercados, cuentas}
  vista: 'comparado'
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

// Suma publicaciones al estado descartando las que ya están. Hace falta desde
// que recolecta más de una persona: si dos capturan el mismo día y el mismo
// mercado, los dos archivos traen las mismas publicaciones, y sin esto cada
// una contaría doble — todas las métricas del día quedarían al doble sin que
// nada lo delate. Se compara por post_id, que es el de X y no cambia.
function agregarPosts(nuevos) {
  const vistos = new Set(D.posts.map(p => p.post_id));
  let sumados = 0, repetidos = 0;
  for (const p of nuevos) {
    if (p.post_id && vistos.has(p.post_id)) { repetidos++; continue; }
    if (p.post_id) vistos.add(p.post_id);
    D.posts.push(p);
    sumados++;
  }
  if (repetidos) console.log(`[ANUBIS] ${repetidos} publicación(es) repetidas, descartadas`);
  return { sumados, repetidos };
}

const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];

// Color de marca de la cuenta de referencia. Cada juego se validó completo
// (rojo con azul/aqua/amarillo; naranja con azul/aqua/violeta): las dos
// referencias nunca comparten gráfico, porque están en mercados distintos.
const MARCAS = {
  clarincom: { ref: 'var(--rojo)', pool: ['var(--s1)', 'var(--s3)', 'var(--s4)', 'var(--violeta)', 'var(--s2)'] },
  portalmvd: { ref: 'var(--s2)',   pool: ['var(--s1)', 'var(--s3)', 'var(--s4)', 'var(--violeta)', 'var(--rojo)'] }
};
const POOL_POR_DEFECTO = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--violeta)', 'var(--rojo)'];

// Las cuatro señales de la audiencia, ordenadas por lo que le cuesta a alguien
// producirlas. Ver es casi gratis; compartir pone el nombre propio detrás.
const SENALES = [
  { k: 'likes',      n: 'Me gusta',  d: 'un toque',                        c: 'var(--o1)', claro: true },
  { k: 'guardados',  n: 'Guardados', d: 'intención de volver',             c: 'var(--o2)', claro: true },
  { k: 'respuestas', n: 'Respuestas', d: 'escribir algo',                  c: 'var(--o3)' },
  { k: 'reposts',    n: 'Compartidos', d: 'poner el nombre propio detrás', c: 'var(--o4)' }
];

// Las tres formas de contar. Cada una responde una pregunta distinta y da
// un ganador distinto, así que el denominador se elige, no se esconde.
const DENOMINADORES = {
  post:  { n: 'Por publicación', suf: 'Tot', div: a => a.n,
           ex: 'Neutraliza el volumen: publicar más deja de ser una ventaja. Responde qué consigue cada pieza.' },
  bruto: { n: 'Cantidad total',  suf: 'Tot', div: () => 1,
           ex: 'La suma del día. Premia a quien más publica y a quien más audiencia tiene.' },
  vista: { n: 'Por mil vistas',  suf: 'Tot', div: a => a.vistasTot / 1000,
           ex: 'Neutraliza también el alcance. Favorece a las cuentas chicas con público comprometido.' }
};
let denomActual = 'post';

// ====================================================================
// Utilidades
// ====================================================================
const nf = new Intl.NumberFormat('es-AR');
const fmt = n => (n === null || n === undefined || !isFinite(n)) ? '—' : nf.format(Math.round(n));
const fmt1 = n => (n === null || n === undefined || !isFinite(n)) ? '—' : n.toFixed(1).replace('.', ',');

function metrica(p, k) {
  const m = p.metricas && p.metricas[k];
  return (m && m.estado === 'visible' && typeof m.valor === 'number') ? m.valor : null;
}
function mediana(a) {
  const v = a.filter(x => x !== null && isFinite(x)).sort((x, y) => x - y);
  if (!v.length) return null;
  const m = v.length >> 1;
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}
function suma(a) { return a.reduce((s, x) => s + (x || 0), 0); }

function horaLocal(p) {
  if (!p.publicado_iso) return null;
  const d = new Date(p.publicado_iso);
  if (isNaN(d)) return null;
  // Hora de Buenos Aires / Montevideo (UTC-3)
  return new Date(d.getTime() - 3 * 3600 * 1000).getUTCHours();
}

function escapar(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// ====================================================================
// Carga de paquetes
// ====================================================================
function leerArchivo(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('No se pudo leer ' + f.name));
    r.readAsText(f);
  });
}

// Las capturas de pantalla de un paquete cargado desde disco. La versión
// anterior las descartaba: los posts quedaban con la referencia a una imagen
// que no estaba en ninguna parte, y la película salía en blanco.
const EVIDENCIA_EN_DISCO = new Map();   // evidencia_id -> File

async function cargarArchivos(lista) {
  const archivos = Array.from(lista);
  const porCarpeta = new Map();

  for (const f of archivos) {
    const ruta = f.webkitRelativePath || f.name;
    const base = ruta.split('/').slice(0, -1).join('/') || '(sueltos)';
    const nombre = f.name;
    if (/\.(jpe?g|png|webp)$/i.test(nombre) && /screenshots\//i.test(ruta)) {
      EVIDENCIA_EN_DISCO.set(nombre.replace(/\.[^.]+$/, ''), f);
      continue;
    }
    // Dos formas conviven. Un paquete completo trae posts.jsonl dentro de su
    // carpeta; la carpeta de datos diaria trae un .jsonl por día, cada uno con
    // su propio nombre. Se agrupa por carpeta en el primer caso y por archivo
    // en el segundo, y cada grupo entra igual por procesarPaquete.
    if (nombre === 'posts.jsonl' || nombre === 'summary.json' || nombre === 'manifest.json') {
      if (!porCarpeta.has(base)) porCarpeta.set(base, {});
      porCarpeta.get(base)[nombre] = f;
      continue;
    }
    if (/\.jsonl$/i.test(nombre)) {
      const clave = base + '/' + nombre;
      if (!porCarpeta.has(clave)) porCarpeta.set(clave, {});
      porCarpeta.get(clave)['posts.jsonl'] = f;
      porCarpeta.get(clave).__id = nombre.replace(/\.jsonl$/i, '');
      continue;
    }
    if (/\.json$/i.test(nombre)) {
      // El resumen que acompaña a un .jsonl diario comparte el nombre.
      const clave = base + '/' + nombre.replace(/\.json$/i, '.jsonl');
      if (!porCarpeta.has(clave)) porCarpeta.set(clave, {});
      porCarpeta.get(clave)['summary.json'] = f;
    }
  }

  // Un .json suelto sin su .jsonl no es una captura.
  for (const [k, g] of [...porCarpeta]) if (!g['posts.jsonl']) porCarpeta.delete(k);

  if (!porCarpeta.size) {
    alert('No encontré ningún archivo .jsonl. Elegí la carpeta de datos (CAPTURAS ANUBIS X) ' +
          'o la carpeta descomprimida de una captura.');
    return;
  }

  let nuevas = 0, nuevosPosts = 0;
  for (const [, g] of porCarpeta) {
    const r = await procesarPaquete(g);
    if (r) { nuevas++; nuevosPosts += r; }
  }

  if (!nuevas) { alert('Esos paquetes ya estaban cargados.'); return; }
  console.log(`[ANUBIS] ${nuevas} ejecución(es), ${nuevosPosts} publicaciones`);
  prepararFiltros();
  render();
}

// Toma {posts.jsonl: File, summary.json: File, ...} y lo incorpora al estado.
// Devuelve la cantidad de publicaciones sumadas, o null si no sirve o ya estaba.
async function procesarPaquete(g) {
  {
    if (!g['posts.jsonl']) return null;

    let resumen = null, manif = null;
    try { if (g['summary.json']) resumen = JSON.parse(await leerArchivo(g['summary.json'])); } catch (e) {}
    try { if (g['manifest.json']) manif = JSON.parse(await leerArchivo(g['manifest.json'])); } catch (e) {}

    const texto = await leerArchivo(g['posts.jsonl']);
    const posts = [];
    for (const linea of texto.split('\n')) {
      const t = linea.trim();
      if (!t) continue;
      try { posts.push(JSON.parse(t)); } catch (e) {}
    }
    if (!posts.length) return null;

    // Para un archivo diario el nombre ES la identidad: dos días distintos no
    // se pueden mezclar bajo el mismo ejecucion_id aunque vengan de la misma
    // configuración.
    const id = g.__id ||
               (resumen && resumen.ejecucion_id) || (manif && manif.ejecucion_id) ||
               (posts[0] && posts[0].ejecucion_id) || ('carga-' + (D.ejecuciones.length + 1));

    if (D.ejecuciones.some(e => e.id === id)) return null; // ya cargada

    // Los paquetes anteriores a v0.2.0 no traen mercado ni rol.
    const mercadosDeclarados = (resumen && resumen.mercados) || (manif && manif.mercados) || null;
    for (const p of posts) {
      p.ejecucion_id = g.__id || p.ejecucion_id || id;
      if (!p.mercado) p.mercado = deducirMercado(p.cuenta_monitoreada, mercadosDeclarados);
      if (!p.rol) p.rol = deducirRol(p.cuenta_monitoreada, mercadosDeclarados);
    }

    D.ejecuciones.push({
      id,
      periodo: (resumen && resumen.periodo) || (manif && manif.periodo) || null,
      resumen
    });
    return agregarPosts(posts).sumados;
  }
}

// ====================================================================
// Lectura directa de la carpeta de trabajo
// ====================================================================
// La misma carpeta que eligió el recolector, guardada en IndexedDB. Así el
// panel abre las capturas sin que haya que ir a buscarlas con el selector.

const DB_NOMBRE = 'anubis', DB_ALMACEN = 'handles', DB_CLAVE = 'carpeta';

function abrirDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NOMBRE, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_ALMACEN);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function leerHandle() {
  try {
    const db = await abrirDB();
    return await new Promise((res, rej) => {
      const t = db.transaction(DB_ALMACEN, 'readonly');
      const q = t.objectStore(DB_ALMACEN).get(DB_CLAVE);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => rej(q.error);
    });
  } catch (e) { return null; }
}

async function listarCapturas(dir) {
  const salida = [];
  for await (const [nombre, h] of dir.entries()) {
    if (h.kind !== 'directory') continue;
    try {
      await h.getFileHandle('posts.jsonl');   // sólo carpetas de captura
      salida.push({ nombre, handle: h });
    } catch (e) { /* no es una captura */ }
  }
  salida.sort((a, b) => b.nombre.localeCompare(a.nombre));  // más reciente primero
  return salida;
}

async function archivosDe(dirHandle) {
  const g = {};
  for (const n of ['posts.jsonl', 'summary.json', 'manifest.json']) {
    try { g[n] = await (await dirHandle.getFileHandle(n)).getFile(); } catch (e) {}
  }
  // Las capturas de pantalla, para que la película las encuentre.
  try {
    const dir = await dirHandle.getDirectoryHandle('screenshots');
    for await (const [nombre, h] of dir.entries()) {
      if (h.kind === 'file' && /\.(jpe?g|png|webp)$/i.test(nombre)) {
        EVIDENCIA_EN_DISCO.set(nombre.replace(/\.[^.]+$/, ''), await h.getFile());
      }
    }
  } catch (e) { /* el paquete puede no tener evidencia */ }
  return g;
}

// ====================================================================
// GitHub: el archivo compartido del equipo
// ====================================================================
// Los datos viven en un repositorio privado y cada persona los lee con su
// propio token. El control de acceso lo hace GitHub —sabe quién está en el

function configGh() {
  return {
    duenio: leerLocal('anubis_gh_duenio') || '',
    repo: leerLocal('anubis_gh_repo') || '',
    token: leerLocal('anubis_gh_token') || ''
  };
}

// Quien entra con contraseña no configura nada: el dueño, el repositorio y el
// token salieron del archivo cifrado. Mostrarle esos campos es pedirle que
// entienda una plomería que no le corresponde.
function conCandado() {
  return typeof ACCESO !== 'undefined' && !!(ACCESO.cfg && ACCESO.cfg.cifrado);
}

    <div class="tarjeta" style="text-align:left">

function guardarConfigGh() {
  if (!$('#ghD')) return configGh();   // con candado no hay campos que leer
  guardarLocal('anubis_gh_duenio', $('#ghD').value.trim());
  guardarLocal('anubis_gh_repo', $('#ghR').value.trim());
  guardarLocal('anubis_gh_token', $('#ghT').value.trim());
  return { duenio: $('#ghD').value.trim(), repo: $('#ghR').value.trim(), token: $('#ghT').value.trim() };
}

// Un cliente es un mercado: como los nombra el recolector. Una corrida con dos
// mercados activos deja un archivo que pertenece a los dos, así que se cuenta
// en ambos grupos; el filtro de mercado del panel los separa después.
function agruparPorCliente(capturas) {
  const grupos = new Map();
  capturas.forEach((c, i) => {
    const nombres = String(c.mercado || 'Sin nombre').split(' + ').map(s => s.trim()).filter(Boolean);
    for (const n of (nombres.length ? nombres : ['Sin nombre'])) {
      if (!grupos.has(n)) grupos.set(n, []);
      grupos.get(n).push({ ...c, i });
    }
  });
  return [...grupos.entries()].map(([nombre, dias]) => {
    dias.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    return {
      nombre, dias,
      publicaciones: dias.reduce((s, d) => s + (d.publicaciones || 0), 0),
      cuentas: [...new Set(dias.flatMap(d => d.cuentas || []))],
      desde: dias[dias.length - 1].fecha, hasta: dias[0].fecha
    };
  }).sort((a, b) => b.dias.length - a.dias.length || a.nombre.localeCompare(b.nombre));
}

function fechaCorta(f) {
  const d = new Date(String(f) + 'T12:00:00');
  return isNaN(d) ? String(f) : d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
}

async function listarDeGitHub() {
  const cfg = guardarConfigGh();
  const msg = $('#ghMsg'), lista = $('#ghLista');
  if (!cfg.duenio || !cfg.repo || !cfg.token) { msg.textContent = 'Completá los tres campos.'; return; }
  msg.textContent = 'Consultando…';
  lista.innerHTML = '';
  try {
    const idx = await GitHub.leerIndice(cfg);
    if (!idx.capturas.length) {
      msg.textContent = 'El repositorio está vacío: todavía no se publicó ninguna captura.';
      return;
    }
    // Un renglón por cliente, no por archivo. Nadie piensa en "2026-09-14_
    // Argentina.jsonl"; piensan en Clarín y en cuántos días hay.
    const clientes = agruparPorCliente(idx.capturas);
    msg.textContent = clientes.length === 1
      ? `${clientes[0].dias.length} día(s) publicados`
      : `${clientes.length} clientes · ${idx.capturas.length} día(s) publicados`;

    lista.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
        ${clientes.map((cl, k) => `
          <button class="cliente" data-cliente="${k}">
            <span class="clNombre">${escapar(cl.nombre)}</span>
            <span class="clDatos">${cl.dias.length} día${cl.dias.length === 1 ? '' : 's'}
              · ${fmt(cl.publicaciones)} publicaciones
              · ${cl.cuentas.length} cuenta${cl.cuentas.length === 1 ? '' : 's'}</span>
            <span class="clFechas">${cl.dias.length > 1
              ? fechaCorta(cl.desde) + ' a ' + fechaCorta(cl.hasta)
              : fechaCorta(cl.hasta)}</span>
          </button>`).join('')}
      </div>
      <p style="margin:14px 0 0">
        <button id="ghDetalle" style="font-size:12px">Elegir días sueltos</button></p>
      <div id="ghItems" class="oculto" style="display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;margin-top:10px"></div>
      <div id="ghPie"></div>`;

    $$('[data-cliente]').forEach(b => b.addEventListener('click', () => {
      const cl = clientes[parseInt(b.dataset.cliente, 10)];
      console.log('[ANUBIS] abriendo cliente', cl.nombre, cl.dias.map(d => d.archivo));
      bajarDeGitHub(cfg, cl.dias, cl.nombre);
    }));

    $('#ghDetalle').addEventListener('click', () => {
      const cont = $('#ghItems');
      if (!cont.classList.contains('oculto')) { cont.classList.add('oculto'); $('#ghPie').innerHTML = ''; return; }
      cont.innerHTML = idx.capturas.map((c, i) => `
        <label style="display:flex;gap:9px;align-items:center;border:1px solid var(--borde);
          border-radius:6px;padding:8px 11px;cursor:pointer">
          <input type="checkbox" data-i="${i}" style="width:auto">
          <span style="flex:1">${escapar(fechaCorta(c.fecha))} · ${escapar(c.mercado || '')}
            <span style="color:var(--tinta-3);font-size:12px"> · ${fmt(c.publicaciones)} publicaciones</span></span>
        </label>`).join('');
      cont.classList.remove('oculto');
      $('#ghPie').innerHTML = `<button class="primario" id="ghCargar"
        style="background:var(--marca);color:#fff;margin-top:12px">Cargar los marcados</button>`;
      $('#ghCargar').addEventListener('click', () => {
        const elegidas = $$('#ghItems input:checked').map(i => idx.capturas[parseInt(i.dataset.i, 10)]);
        bajarDeGitHub(cfg, elegidas);
      });
    });
  } catch (e) {
    msg.textContent = e.message;
  }
}

// Un aviso que no se pueda pasar por alto. La línea gris del encabezado servía
// para el que ya sabe qué mira; para el que aprieta un botón y no ve nada, no.
function avisoCarga(texto, malo) {
  let caja = $('#ghAviso');
  if (!caja) {
    caja = document.createElement('div');
    caja.id = 'ghAviso';
    const donde = $('#ghLista') || $('#desdeGitHub');
    if (donde) donde.insertBefore(caja, donde.firstChild);
  }
  caja.className = malo ? 'aviso' : 'cargando';
  caja.style.margin = '0 0 12px';
  caja.innerHTML = texto;
}

async function bajarDeGitHub(cfg, elegidas, cliente) {
  const msg = $('#ghMsg');
  if (!elegidas || !elegidas.length) { avisoCarga('No hay nada marcado.', true); return; }
  const btn = $('#ghCargar');
  if (btn) btn.disabled = true;
  $$('[data-cliente]').forEach(b => { b.disabled = true; });
  let n = 0, p = 0, repetidas = 0;
  try {
    for (const c of elegidas) {
      const paso = elegidas.length > 1
        ? `Abriendo ${escapar(cliente || '')}: día ${n + 1} de ${elegidas.length}…`
        : `Abriendo ${escapar(cliente || '')}…`;
      msg.textContent = paso;
      avisoCarga(paso);
      if (D.ejecuciones.some(e => e.id === c.archivo)) { n++; continue; }
      const texto = await GitHub.bajarCaptura(cfg, c.archivo);

      const posts = [];
      let rotas = 0;
      for (const linea of texto.split('\n')) {
        const t = linea.trim();
        if (!t) continue;
        try { posts.push(JSON.parse(t)); } catch (e) { rotas++; }
      }
      // Un archivo que no se pudo leer no se da por cargado: si se registrara
      // igual, el segundo intento respondería "ya estaban cargadas" y no habría
      // forma de salir del pozo sin recargar la página.
      if (!posts.length) {
        throw new Error(`El archivo ${c.archivo} no trajo ninguna publicación legible` +
          (rotas ? ` (${rotas} líneas ilegibles de ${texto.split('\n').length})` : ' (llegó vacío)') +
          `. Primeros caracteres: ${JSON.stringify(texto.slice(0, 120))}`);
      }
      if (rotas) console.warn(`[ANUBIS] ${c.archivo}: ${rotas} líneas ilegibles, salteadas`);

      for (const q of posts) {
        q.ejecucion_id = c.archivo;   // la unidad de tiempo pasa a ser el archivo del día
        if (!q.mercado) q.mercado = c.mercado || 'Sin mercado';
      }
      D.ejecuciones.push({ id: c.archivo, periodo: c.periodo || null,
        resumen: { periodo: c.periodo || null, cortes: c.cortes || null } });
      const r = agregarPosts(posts);
      n++; p += r.sumados; repetidas += r.repetidos;
    }
    // Que no haya publicaciones nuevas no significa que no haya nada que ver:
    // lo más probable es que ya estuvieran cargadas. Antes se devolvía sin
    // renderizar y el usuario quedaba trabado en la pantalla de carga.
    msg.textContent = p
      ? `${n} captura(s), ${fmt(p)} publicaciones.` +
        (repetidas ? ` ${fmt(repetidas)} repetidas, descartadas: alguien más capturó lo mismo.` : '')
      : 'Esas capturas ya estaban cargadas.';
    console.log(`[ANUBIS] GitHub: ${n} captura(s), ${p} publicaciones, ${D.posts.length} en total`);
    if (!D.posts.length) {
      avisoCarga('Se bajaron los archivos pero no tenían ninguna publicación adentro.', true);
      return;
    }

    // Dibujar es la parte que puede fallar por una razón distinta de bajar, y
    // confundir las dos hace imposible saber qué arreglar.
    try {
      if (typeof DISPONIBLES !== 'undefined') DISPONIBLES.listo = false;
      prepararFiltros();
      // Abrir un cliente lo deja seleccionado: si el archivo traía dos mercados,
      // el que pediste es el que tiene que quedar a la vista.
      if (cliente) {
        const sel = $('#fMercado');
        const op = Array.from(sel.options).find(o => o.value === cliente);
        if (op) sel.value = cliente;
      }
      render();
      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    } catch (e) {
      console.error('[ANUBIS] al dibujar', e);
      avisoCarga(`<strong>Los datos se bajaron pero el panel no pudo dibujarlos.</strong><br>` +
        `${escapar(e.message)}<br><br>${fmt(D.posts.length)} publicaciones cargadas. ` +
        `El detalle está en la consola (clic derecho, Inspeccionar, Console).`, true);
    }
  } catch (e) {
    console.error('[ANUBIS] al bajar', e);
    avisoCarga(`<strong>No se pudieron bajar los datos.</strong><br>${escapar(e.message)}`, true);
  } finally {
    if (btn) btn.disabled = false;
    $$('[data-cliente]').forEach(b => { b.disabled = false; });
  }
}

// El camino por defecto: las capturas viven en el navegador y aparecen solas.
// Sin permisos, sin elegir carpeta, sin diálogos.
async function prepararDelNavegador() {
  const cont = document.getElementById('desdeNavegador');
  if (!cont || typeof Almacen === 'undefined') return;

  let lista = [];
  try { lista = await Almacen.listar(); } catch (e) { return; }
  if (!lista.length) return;

  const total = lista.reduce((s, x) => s + (x.bytes || 0), 0);
  cont.innerHTML = `
    <p style="margin:0 0 12px;font-size:13px;color:var(--tinta-2)">
      <strong>${lista.length} captura(s) guardada(s)</strong> · ${(total / 1048576).toFixed(0)} MB</p>
    <div id="listaNav" style="display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto 14px">
      ${lista.map((c, i) => `<label style="display:flex;gap:9px;align-items:center;text-align:left;
        border:1px solid var(--borde);border-radius:6px;padding:9px 12px;cursor:pointer">
        <input type="checkbox" data-i="${i}" ${i === 0 ? 'checked' : ''} style="width:auto">
        <span style="flex:1">${escapar(c.nombre)}
          <span style="color:var(--tinta-3);font-size:12px"> · ${fmt(c.publicaciones)} publicaciones</span></span>
        ${c.evidencias ? `<button class="chip" data-aliviar="${escapar(c.id)}"
          title="Borrar sólo las ${c.evidencias} capturas de pantalla y conservar los datos"
          style="padding:2px 9px;font-size:11px">Liberar</button>` : ''}
        <button class="chip" data-borrar="${escapar(c.id)}" title="Borrar esta captura entera"
          style="padding:2px 9px;font-size:11px">Borrar</button>
      </label>`).join('')}
    </div>
    <button class="primario" id="btnCargarNav" style="background:var(--marca);color:#fff">Cargar las marcadas</button>`;
  cont.classList.remove('oculto');

  document.getElementById('btnCargarNav').addEventListener('click', async () => {
    const elegidas = Array.from(document.querySelectorAll('#listaNav input:checked'))
      .map(i => lista[parseInt(i.dataset.i, 10)]);
    if (!elegidas.length) return;
    let n = 0, p = 0;
    for (const c of elegidas) {
      const paq = await Almacen.leer(c.id);
      if (!paq || D.ejecuciones.some(e => e.id === paq.id)) continue;
      const mercados = (paq.resumen && paq.resumen.mercados) || (paq.manifest && paq.manifest.mercados) || null;
      for (const q of paq.posts) {
        q.ejecucion_id = q.ejecucion_id || paq.id;
        if (!q.mercado) q.mercado = deducirMercado(q.cuenta_monitoreada, mercados);
        if (!q.rol) q.rol = deducirRol(q.cuenta_monitoreada, mercados);
      }
      D.ejecuciones.push({ id: paq.id, periodo: (paq.resumen && paq.resumen.periodo) || null, resumen: paq.resumen });
      n++; p += agregarPosts(paq.posts).sumados;
    }
    if (!n && !D.posts.length) { alert('Esas capturas ya estaban cargadas.'); return; }
    console.log(`[ANUBIS] ${n} captura(s) del navegador, ${p} publicaciones`);
    prepararFiltros();
    render();
  });

  cont.addEventListener('click', async ev => {
    const liberar = ev.target.closest('[data-aliviar]');
    if (liberar) {
      ev.preventDefault();
      if (!confirm('Se borran las capturas de pantalla y se conservan los datos.\n\n' +
                   'Recupera casi todo el espacio; el análisis sigue funcionando igual, ' +
                   'pero perdés la evidencia visual de esas publicaciones.')) return;
      await Almacen.borrarEvidencia(liberar.dataset.aliviar);
      prepararDelNavegador();
      return;
    }
    const b = ev.target.closest('[data-borrar]');
    if (!b) return;
    ev.preventDefault();
    if (!confirm('¿Borrar esta captura entera del navegador? No se puede deshacer.')) return;
    await Almacen.borrar(b.dataset.borrar);
    prepararDelNavegador();
  });
}

async function prepararCarpeta() {

function deducirMercado(handle, mercados) {
  if (mercados) {
    for (const m of mercados) {
      const todas = [m.propia].concat(m.competencia || []);
      if (todas.some(h => h && h.toLowerCase() === String(handle).toLowerCase())) return m.nombre;
    }
  }
  return 'Sin mercado';
}
function deducirRol(handle, mercados) {
  if (mercados) {
    for (const m of mercados) {
      if (m.propia && m.propia.toLowerCase() === String(handle).toLowerCase()) return 'propia';
    }
  }
  return 'competencia';
}
