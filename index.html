// Orden estable de cuentas: la propia primero, después por volumen.
// El color sigue a la cuenta, nunca a su puesto en el ranking.
function cuentasDe(posts) {
  const mapa = new Map();
  for (const p of posts) {
    const h = p.cuenta_monitoreada;
    if (!mapa.has(h)) mapa.set(h, { handle: h, rol: p.rol, posts: [] });
    mapa.get(h).posts.push(p);
  }
  const arr = [...mapa.values()];
  arr.sort((a, b) => (a.rol === 'propia' ? -1 : 0) - (b.rol === 'propia' ? -1 : 0) ||
                     a.handle.localeCompare(b.handle));

  // Los paquetes anteriores a la v0.2.0 del recolector no traen rol. Si
  // ninguna cuenta se declara referencia, se toma la que tenga color de marca
  // conocido: así una captura vieja se ve igual que una nueva.
  let ref = arr.find(c => c.rol === 'propia');
  if (!ref) {
    ref = arr.find(c => MARCAS[c.handle.toLowerCase()]);
    if (ref) ref.rol = 'propia';
  }
  const marca = ref ? MARCAS[ref.handle.toLowerCase()] : null;
  const pool = marca ? marca.pool : POOL_POR_DEFECTO;
  // Nunca se repite un color: si hay más cuentas que colores validados, las
  // que sobran van en gris. Dos cuentas del mismo color es peor que una gris.
  let i = 0;
  for (const c of arr) {
    if (c === ref && marca) { c.color = marca.ref; continue; }
    c.color = i < pool.length ? pool[i] : 'var(--neutro)';
    i++;
  }
  return arr;
}

// Una cuenta cuya captura cortó por un tope no cubrió el día: tiene menos
// publicaciones de las que publicó, y cuánto menos no se sabe. Compararla con
// una completa da una conclusión falsa, así que el panel lo dice antes que
// cualquier número.
const CORTES_INCOMPLETOS = {
  tope_de_scrolls: 'se cortó por el tope de scrolls',
  tope_de_publicaciones: 'se cortó por el tope de publicaciones',
  tope_de_tiempo: 'se cortó por el tope de minutos',
  fallo_de_scroll: 'falló el desplazamiento',
  fallo_de_lectura: 'falló la lectura de la cronología',
  detenido_por_operador: 'se detuvo a mano',
  cuenta_salteada: 'se salteó'
};

function coberturaIncompleta(posts) {
  const enJuego = new Set(posts.map(p => p.cuenta_monitoreada));
  const ejec = $('#fPeriodo').value;
  const avisos = [];
  for (const e of D.ejecuciones) {
    if (ejec !== '__todas' && e.id !== ejec) continue;
    const r = e.resumen || {};
    // Dos formas según de dónde vino la captura: el resumen completo de un
    // paquete, o el mapa compacto que viaja en el índice de GitHub.
    const pares = r.cortes ? Object.entries(r.cortes)
      : (r.cuentas || []).map(c => [c.handle, c.motivo_corte]);
    for (const [handle, motivo] of pares) {
      if (!motivo || !CORTES_INCOMPLETOS[motivo] || !enJuego.has(handle)) continue;
      avisos.push({ handle, motivo, dia: (e.periodo && e.periodo.desde) || e.id });
    }
  }
  return avisos;
}

function avisoCobertura(posts) {
  const avisos = coberturaIncompleta(posts);
  if (!avisos.length) return '';
  const porCuenta = {};
  for (const a of avisos) (porCuenta[a.handle] = porCuenta[a.handle] || []).push(a);
  const lista = Object.entries(porCuenta).map(([h, a]) =>
    `<strong>@${escapar(h)}</strong> (${escapar(CORTES_INCOMPLETOS[a[0].motivo])}` +
    (a.length > 1 ? `, en ${a.length} días` : '') + ')').join(', ');
  return `<div class="aviso" style="margin-bottom:16px">
    <strong>Cobertura incompleta.</strong> ${lista}.
    Esas cuentas publicaron más de lo que quedó capturado, y no se sabe cuánto más.
    Cualquier comparación de volumen con las demás las subestima; las medidas por
    publicación sufren menos, pero tampoco son exactas. Para arreglarlo, subí el tope
    en <em>Parámetros de recorrido</em> y volvé a correr ese día: el archivo se reemplaza.</div>`;
}

function agregados(c) {
  const P = c.posts;
  const vistas = P.map(p => metrica(p, 'vistas'));
  const vistasTot = suma(vistas);
  const o = {
    handle: c.handle, rol: c.rol, color: c.color,
    n: P.length,
    vistasTot,
    vistasMed: mediana(vistas)
  };
  for (const s of SENALES) {
    const v = P.map(p => metrica(p, s.k));
    o[s.k + 'Tot'] = suma(v);
    o[s.k + 'Med'] = mediana(v);
    // Tasa por cada mil vistas: quita el alcance de la ecuación y deja
    // sólo con qué intensidad respondió quien efectivamente vio.
    o[s.k + 'K'] = vistasTot ? (suma(v) / vistasTot) * 1000 : null;
  }
  // Reacciones: la suma de las cuatro señales. Es aritmética honesta, no un
  // índice ponderado — pero trata un me gusta y un compartido como iguales,
  // y no lo son. Por eso el desglose queda siempre a la vista.
  o.reaccionesTot = SENALES.reduce((s, x) => s + (o[x.k + 'Tot'] || 0), 0);
  o.reaccionesPorPost = P.length ? o.reaccionesTot / P.length : 0;

  o.horas = Array.from({ length: 24 }, (_, h) => P.filter(p => horaLocal(p) === h).length);
  o.tipos = {};
  for (const p of P) o.tipos[p.tipo] = (o.tipos[p.tipo] || 0) + 1;
  o.formatos = porFormato(P);
  return o;
}

// ====================================================================
// Modelo de publicación
// ====================================================================
// Cinco formas de publicar, y son decisiones editoriales distintas: mandar a
// alguien a filmar no se parece en nada a pegar un link. Por eso el formato se
// mira aparte del tema y aparte del volumen.
//
// El formato se deduce acá, en el panel, y no en el recolector: así los días
// que ya están capturados y subidos entran en este análisis sin volver a
// recorrer nada.

const FORMATOS = [
  { k: 'video',    n: 'Video',     c: 'var(--o4)', d: 'video o GIF propio en la publicación' },
  { k: 'foto',     n: 'Foto',      c: 'var(--o3)', d: 'una o más imágenes' },
  { k: 'link',     n: 'Solo link', c: 'var(--o2)', d: 'un enlace afuera, con o sin tarjeta' },
  { k: 'encuesta', n: 'Encuesta',  c: 'var(--violeta)', d: 'pregunta con opciones para votar' },
  { k: 'texto',    n: 'Texto',     c: 'var(--o1)', d: 'sólo texto, sin nada adjunto' }
];
const FORMATO_NOMBRE = FORMATOS.reduce((o, f) => (o[f.k] = f.n, o), {});
const FORMATO_COLOR = FORMATOS.reduce((o, f) => (o[f.k] = f.c, o), {});

// Sin la bandera global: un regex con /g guarda posición entre llamadas y
// test() devuelve false una de cada dos veces sobre el mismo texto.
const HAY_URL = /https?:\/\/[^\s]+/i;

function formatoDe(p) {
  const tm = p.tipo_media || p.tipo;
  const adj = Array.isArray(p.adjuntos) ? p.adjuntos : [];
  if (tm === 'encuesta') return 'encuesta';
  if (tm === 'video' || adj.some(a => a.tipo === 'video')) return 'video';
  if (tm === 'imagen' || adj.some(a => a.tipo === 'imagen')) return 'foto';
  if (tm === 'enlace' || adj.some(a => a.tipo === 'enlace')) return 'link';
  // Un enlace sin tarjeta renderizada sigue siendo una publicación que manda
  // afuera: es el caso más común en las cuentas de medios y se perdía entero.
  if (HAY_URL.test(p.texto || '')) return 'link';
  return 'texto';
}

// Devuelve una fila por formato usado, de mayor a menor cantidad, con lo que
// consiguió cada uno. Medianas y no promedios: un solo posteo viral corre el
// promedio de un formato entero y hace decir cualquier cosa.
function porFormato(P) {
  const grupos = {};
  for (const p of P) (grupos[formatoDe(p)] = grupos[formatoDe(p)] || []).push(p);
  return FORMATOS.filter(f => grupos[f.k]).map(f => {
    const g = grupos[f.k];
    const vistas = g.map(p => metrica(p, 'vistas'));
    const reacciones = g.map(p => SENALES.reduce((s, x) => s + (metrica(p, x.k) || 0), 0));
    const vistasTot = suma(vistas);
    const reaccionesTot = suma(reacciones);
    return {
      k: f.k, n: f.n, color: f.c, d: f.d,
      posts: g.length,
      parte: P.length ? g.length / P.length : 0,
      vistasMed: mediana(vistas),
      vistasTot,
      reaccionesPorPost: g.length ? reaccionesTot / g.length : 0,
      // Por mil vistas: separa "le fue bien porque X lo mostró mucho" de
      // "a quien lo vio le importó".
      reaccionesPorMil: vistasTot ? (reaccionesTot / vistasTot) * 1000 : null,
      repostsMed: mediana(g.map(p => metrica(p, 'reposts'))),
      // Menos de cinco publicaciones no es un formato: es una anécdota.
      firme: g.length >= 5
    };
  }).sort((a, b) => b.posts - a.posts);
}

// Tabla de cuentas por formato, en porcentaje. Es la comparación que importa:
// dos medios con el mismo volumen pueden tener modelos editoriales opuestos.
function matrizFormatos(ag) {
  const usados = FORMATOS.filter(f => ag.some(a => a.formatos.some(x => x.k === f.k)));
  const cab = `<tr><th>Cuenta</th><th style="text-align:right">Posts</th>` +
    usados.map(f => `<th style="text-align:right">${escapar(f.n)}</th>`).join('') + `</tr>`;
  const filas = ag.slice().sort((a, b) => b.n - a.n).map(a => {
    const porK = a.formatos.reduce((o, x) => (o[x.k] = x, o), {});
    return `<tr><td style="white-space:nowrap">@${escapar(a.handle)}${a.rol === 'propia' ? ' · propia' : ''}</td>
      <td style="text-align:right">${fmt(a.n)}</td>` +
      usados.map(f => {
        const x = porK[f.k];
        if (!x) return `<td style="text-align:right;color:var(--tinta-3)">—</td>`;
        const pct = Math.round(x.parte * 100);
        // El fondo proporcional evita leer treinta números sueltos buscando
        // cuál es grande: el patrón de cada fila se ve de un vistazo.
        // La barra crece hacia la derecha, contra el número: si creciera al
        // revés el ojo lee dos cosas opuestas en la misma celda.
        return `<td style="text-align:right;position:relative">
          <span style="position:absolute;inset:2px 2px 2px auto;width:${Math.max(pct, 2)}%;
            background:${f.c};opacity:.2;border-radius:3px"></span>
          <span style="position:relative;font-weight:${pct >= 40 ? 700 : 400}">${pct}%</span></td>`;
      }).join('') + `</tr>`;
  }).join('');
  return `<table class="datos"><thead>${cab}</thead><tbody>${filas}</tbody></table>`;
}

// Una frase que diga en castellano qué modelo tiene la cuenta, porque la
// tabla la lee quien ya sabe qué busca y la frase la lee cualquiera.
function frasearModelo(a) {
  if (!a.formatos.length) return '';
  const f = a.formatos[0];
  const pct = Math.round(f.parte * 100);
  const resto = a.formatos.slice(1).filter(x => x.parte >= 0.1)
    .map(x => `${x.n.toLowerCase()} ${Math.round(x.parte * 100)}%`).join(', ');
  const cuanto = pct >= 70 ? 'Casi todo lo que publica'
               : pct >= 45 ? 'La mayor parte de lo que publica'
               : 'La porción más grande de lo que publica';
  return `${cuanto} @${escapar(a.handle)} es <strong>${escapar(f.n.toLowerCase())}</strong> (${pct}%)` +
    (resto ? `, y después ${escapar(resto)}` : '') + '.';
}

// El formato que rinde mejor, dicho con la salvedad de que rendir mejor no es
// causa: un medio pone en video lo que ya sabe que le interesa a la gente.
function mejorFormato(fs) {
  const firmes = fs.filter(f => f.firme && f.vistasMed !== null);
  if (firmes.length < 2) return '';
  const orden = firmes.slice().sort((a, b) => b.vistasMed - a.vistasMed);
  const alto = orden[0], bajo = orden[orden.length - 1];
  const veces = bajo.vistasMed ? alto.vistasMed / bajo.vistasMed : null;
  return `<div class="comoSeLee"><strong>Cómo se lee.</strong>
    La publicación típica en <strong>${escapar(alto.n.toLowerCase())}</strong> llega a
    <strong>${fmt(alto.vistasMed)}</strong> vistas y la de ${escapar(bajo.n.toLowerCase())} a ${fmt(bajo.vistasMed)}` +
    (veces && isFinite(veces) && veces >= 1.2 ? `, es decir ×${fmt1(veces)}` : '') + `.
    Ojo con la conclusión fácil: esto no prueba que cambiar de formato suba el alcance.
    Un medio manda a filmar lo que ya cree que va a interesar, así que parte de la ventaja
    del video es el tema que hay adentro, no el formato. Lo que sí dice el gráfico es
    dónde está puesto el esfuerzo y qué devuelve.
    Los formatos con menos de cinco publicaciones quedan marcados: con tan poco, la mediana es ruido.</div>`;
}

function tarjetasFormato(fs, titulo, sub) {
  return tarjeta(titulo, sub,
    barras(fs.slice().sort((a, b) => (b.vistasMed || 0) - (a.vistasMed || 0)).map(f => ({
      et: f.n + (f.firme ? '' : ' ⚠'), v: f.vistasMed || 0, color: f.color,
      vt: fmt(f.vistasMed), v2: fmt(f.posts) + ' posts',
      tip: `<b>${f.n}</b><br>${fmt(f.posts)} publicaciones (${Math.round(f.parte * 100)}%)<br>` +
           `Mediana <b>${fmt(f.vistasMed)}</b> vistas<br>${fmt1(f.reaccionesPorPost)} reacciones por publicación` +
           (f.firme ? '' : '<br><em>pocas publicaciones: poco confiable</em>')
    })), { titulo: 'Alcance por formato' }),
    tablaHTML(['Formato', 'Publicaciones', 'Parte del total', 'Vistas medianas',
               'Reacciones por publicación', 'Reacciones por mil vistas', 'Compartidos medianos'],
      fs.map(f => [f.n + (f.firme ? '' : ' (pocas)'), fmt(f.posts), Math.round(f.parte * 100) + '%',
                   fmt(f.vistasMed), fmt1(f.reaccionesPorPost), fmt1(f.reaccionesPorMil), fmt(f.repostsMed)])));
}

// ====================================================================
// ETAPA 1 · Clasificación por tema (modelo económico)
// ====================================================================
// El modelo hace lo único que el código no puede: leer. Etiqueta tema,
// entidades y tipo de contenido. No cuenta, no compara, no ordena.
// Todo se cachea por texto_hash, así reprocesar no cuesta nada.

const TEMAS = ['política', 'economía', 'policiales', 'internacional', 'deportes',
               'espectáculos', 'sociedad', 'tecnología', 'clima', 'otro'];

const DB_CLAS = 'clasificacion';

async function abrirDBClas() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('anubis_ia', 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_CLAS);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function leerCache(hashes) {
  const out = new Map();
  try {
    const db = await abrirDBClas();
    await new Promise(res => {
      const t = db.transaction(DB_CLAS, 'readonly');
      const s = t.objectStore(DB_CLAS);
      let quedan = hashes.length;
      if (!quedan) return res();
      for (const h of hashes) {
        const q = s.get(h);
        q.onsuccess = () => { if (q.result) out.set(h, q.result); if (!--quedan) res(); };
        q.onerror = () => { if (!--quedan) res(); };
      }
    });
  } catch (e) { /* sin caché, se reclasifica */ }
  return out;
}

async function guardarCache(pares) {
  try {
    const db = await abrirDBClas();
    await new Promise(res => {
      const t = db.transaction(DB_CLAS, 'readwrite');
      const s = t.objectStore(DB_CLAS);
      for (const [h, v] of pares) s.put(v, h);
      t.oncomplete = res; t.onerror = res;
    });
  } catch (e) {}
}

const PROMPT_CLAS =
  'Clasificás publicaciones de medios argentinos y uruguayos en X. Para cada una devolvés:\n' +
  '- tema: exactamente uno de ' + TEMAS.join(', ') + '\n' +
  '- subtema: dos a cuatro palabras que describan el asunto concreto\n' +
  '- entidades: nombres propios mencionados (personas, organismos, empresas, lugares, equipos). ' +
  'Sin artículos, en singular, tal como aparecen. Máximo 6.\n' +
  '- registro: informativo, opinión, servicio o promocional\n' +
  'Respondés SÓLO un array JSON con un objeto por publicación, en el mismo orden, sin texto alrededor. ' +
  'Si una publicación está cortada, clasificás con lo que hay.';

async function llamarModelo(prov, clave, modelo, sistema, usuario, maxTokens) {
  if (prov === 'anthropic') {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': clave,
                 'anthropic-version': '2023-06-01',
                 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: modelo, max_tokens: maxTokens || 2000, system: sistema,
        messages: [{ role: 'user', content: usuario }] })
    });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    return (j.content || []).map(c => c.text || '').join('');
  }
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + clave },
    body: JSON.stringify({ model: modelo, messages: [
      { role: 'system', content: sistema }, { role: 'user', content: usuario }] })
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  return j.choices[0].message.content;
}

function extraerJSON(txt) {
  const a = txt.indexOf('['), b = txt.lastIndexOf(']');
  if (a < 0 || b < 0) throw new Error('El modelo no devolvió un array JSON');
  return JSON.parse(txt.slice(a, b + 1));
}

// Clasifica sólo lo que no está en caché, en lotes y con algo de paralelismo.
async function clasificar(posts, prov, clave, modelo, alProgreso) {
  const porHash = new Map();
  for (const p of posts) {
    const h = p.texto_hash || ('sin-hash-' + p.post_id);
    if (!porHash.has(h)) porHash.set(h, { hash: h, texto: (p.texto || '').slice(0, 400), posts: [] });
    porHash.get(h).posts.push(p);
  }

  const unicos = [...porHash.values()];
  const cache = await leerCache(unicos.map(u => u.hash));
  const pendientes = unicos.filter(u => !cache.has(u.hash) && u.texto.trim().length > 3);

  // Lo que ya estaba
  for (const u of unicos) {
    const c = cache.get(u.hash);
    if (c) for (const p of u.posts) p.ia = c;
  }

  if (!pendientes.length) return { nuevos: 0, cacheados: unicos.length };

  const LOTE = 20, PARALELO = 3;
  const lotes = [];
  for (let i = 0; i < pendientes.length; i += LOTE) lotes.push(pendientes.slice(i, i + LOTE));

  let hechos = 0, fallidos = 0;
  const nuevosPares = [];

  for (let i = 0; i < lotes.length; i += PARALELO) {
    const tanda = lotes.slice(i, i + PARALELO);
    await Promise.all(tanda.map(async lote => {
      const entrada = lote.map((u, j) => `${j + 1}. ${u.texto.replace(/\n+/g, ' ')}`).join('\n');
      try {
        const txt = await llamarModelo(prov, clave, modelo, PROMPT_CLAS, entrada, 3000);
        const arr = extraerJSON(txt);
        lote.forEach((u, j) => {
          const c = arr[j];
          if (!c) return;
          const limpio = {
            tema: TEMAS.includes(String(c.tema || '').toLowerCase()) ? String(c.tema).toLowerCase() : 'otro',
            subtema: String(c.subtema || '').slice(0, 60),
            entidades: Array.isArray(c.entidades) ? c.entidades.slice(0, 6).map(e => String(e).slice(0, 40)) : [],
            registro: String(c.registro || 'informativo').toLowerCase()
          };
          nuevosPares.push([u.hash, limpio]);
          for (const p of u.posts) p.ia = limpio;
        });
      } catch (e) {
        fallidos += lote.length;
        console.warn('[ANUBIS] lote fallido:', e.message);
      }
      hechos += lote.length;
      if (alProgreso) alProgreso(Math.min(hechos, pendientes.length), pendientes.length);
    }));
  }

  await guardarCache(nuevosPares);
  return { nuevos: nuevosPares.length, cacheados: unicos.length - pendientes.length, fallidos };
}

// ====================================================================
// ETAPA 2 · Agrupación por hecho (código, sin modelo)
// ====================================================================
// Dos publicaciones de medios distintos hablan del mismo hecho cuando
// comparten nombres propios y palabras poco frecuentes de ese día.
// Las entidades las extrajo el modelo; el emparejamiento lo hace el código,
// que es exacto y gratis.

const VACIAS = new Set(('de la el los las un una y o que en con por para del al su sus se lo es son fue ' +
  'era como más pero sin sobre entre desde hasta este esta esto ese esa aquel tras ante bajo cabe hacia ' +
  'según durante mediante contra tiene tienen hay ser estar tras dos tres muy ya no si le les nos').split(' '));

function normalizar(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9ñ ]/g, ' ');
}

function fichas(p) {
  const set = new Set();
  for (const e of (p.ia && p.ia.entidades) || []) {
    const n = normalizar(e).trim().replace(/\s+/g, '_');
    if (n.length > 2) set.add('@' + n);        // las entidades pesan aparte
  }
  for (const w of normalizar((p.texto || '').slice(0, 300)).split(/\s+/)) {
    if (w.length >= 5 && !VACIAS.has(w)) set.add(w);
  }
  return set;
}

// Agrupa por día. Sólo mira publicaciones de cuentas distintas para decidir
// un hecho compartido, pero acumula las del mismo medio en el mismo grupo.
function construirHechos(posts, umbral) {
  const conIA = posts.filter(p => p.ia);
  if (conIA.length < 2) return [];

  const F = new Map(conIA.map(p => [p.post_id, fichas(p)]));

  // Peso inverso a la frecuencia: una palabra que aparece en todos no informa.
  const df = new Map();
  for (const s of F.values()) for (const t of s) df.set(t, (df.get(t) || 0) + 1);
  const N = conIA.length;
  const peso = t => {
    const base = Math.log(N / (1 + (df.get(t) || 1)));
    return (t[0] === '@' ? 1.6 : 1) * Math.max(base, 0.05);
  };

  const sim = (a, b) => {
    const A = F.get(a.post_id), B = F.get(b.post_id);
    if (!A.size || !B.size) return 0;
    let comp = 0;
    for (const t of A) if (B.has(t)) comp += peso(t);
    const menor = [...(A.size <= B.size ? A : B)].reduce((s, t) => s + peso(t), 0);
    return menor ? comp / menor : 0;
  };

  // Enlace simple dentro de una ventana de 18 horas
  const orden = conIA.slice().sort((a, b) => Date.parse(a.publicado_iso || 0) - Date.parse(b.publicado_iso || 0));
  const padre = new Map(orden.map(p => [p.post_id, p.post_id]));
  const raiz = x => { while (padre.get(x) !== x) { padre.set(x, padre.get(padre.get(x))); x = padre.get(x); } return x; };
  const unir = (a, b) => { const ra = raiz(a), rb = raiz(b); if (ra !== rb) padre.set(ra, rb); };

  const VENTANA = 18 * 3600 * 1000;
  for (let i = 0; i < orden.length; i++) {
    const ti = Date.parse(orden[i].publicado_iso || 0);
    for (let j = i + 1; j < orden.length; j++) {
      const tj = Date.parse(orden[j].publicado_iso || 0);
      if (tj - ti > VENTANA) break;
      if (sim(orden[i], orden[j]) >= umbral) unir(orden[i].post_id, orden[j].post_id);
    }
  }

  const grupos = new Map();
  for (const p of orden) {
    const r = raiz(p.post_id);
    if (!grupos.has(r)) grupos.set(r, []);
    grupos.get(r).push(p);
  }

  return [...grupos.values()].map(ps => {
    ps.sort((a, b) => Date.parse(a.publicado_iso || 0) - Date.parse(b.publicado_iso || 0));
    const cuentas = [...new Set(ps.map(p => p.cuenta_monitoreada))];
    const temas = {};
    for (const p of ps) temas[p.ia.tema] = (temas[p.ia.tema] || 0) + 1;
    return {
      id: ps[0].post_id,
      posts: ps,
      cuentas,
      primero: ps[0],
      titulo: (ps[0].texto || '').split('\n')[0].slice(0, 120),
      tema: Object.entries(temas).sort((a, b) => b[1] - a[1])[0][0],
      vistas: suma(ps.map(p => metrica(p, 'vistas'))),
      reacciones: suma(ps.map(p => SENALES.reduce((s, x) => s + (metrica(p, x.k) || 0), 0)))
    };
  }).sort((a, b) => b.cuentas.length - a.cuentas.length || b.reacciones - a.reacciones);
}

const tip = $('#tip');
function mostrarTip(ev, html) {

  tip.style.opacity = '1';

// ====================================================================
// Gráficos (SVG propio)
// ====================================================================

// Barras apiladas: el largo total es la reacción que consigue una publicación
// típica, y cada segmento muestra de qué está hecha. Un total sin desglose
// escondería que "reacción" mezcla cosas de muy distinto valor.
function barrasApiladas(datos, series, opt) {
  opt = opt || {};
  const max = Math.max(...datos.map(d => d.total || 0), 1);
  return `<div class="barras conSec" role="img" aria-label="${escapar(opt.titulo || '')}">` +
    datos.map(d => {
      const segs = series.map(s => {
        const v = d.partes[s.k] || 0;
        if (v <= 0) return '';
        const pct = v / max * 100;
        const txt = opt.fmt ? opt.fmt(v) : fmt(v);
        // La etiqueta va adentro sólo si entra con aire; si no, al tooltip.
        const cabe = pct > 7;
        return `<span class="seg" style="width:${pct}%;background:${s.c}"
          data-tip="${escapar(d.et)}<br>${escapar(s.n)}: <b>${escapar(txt)}</b>"
          >${cabe ? `<i class="segTxt" style="color:${s.claro ? '#0b0b0b' : '#fff'}">${escapar(txt)}</i>` : ''}</span>`;
      }).join('');
      return `<div class="fila">
        <span class="et">${escapar(d.et)}</span>
        <span class="pista apilada" data-tip="${escapar(d.tip || '')}">${segs}</span>
        <span class="val">${escapar(opt.fmt ? opt.fmt(d.total) : fmt(d.total))}</span>
        <span class="val2">${escapar(d.v2 || '')}</span>
      </div>`;
    }).join('') + '</div>';
}

function leyendaSenales() {
  return `<div class="leyenda">${SENALES.map(s =>
    `<span><i class="sw" style="background:${s.c}"></i>${escapar(s.n)}</span>`).join('')}</div>`;
}

// Redondea un máximo a un número legible (1, 2, 2,5 o 5 por potencia de diez),
// para que los ejes no muestren cosas como 22.001.
function maxLindo(v) {
  if (!isFinite(v) || v <= 0) return 1;
  const exp = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / exp;
  const paso = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
  return paso * exp;
}

// Barras horizontales en HTML, no en SVG: un SVG con viewBox fijo se escala
// con el ancho del contenedor y en una tarjeta a media página el texto queda
// ilegible. En HTML la tipografía conserva su tamaño real.
// Las etiquetas de valor son además el relevo que exige el aviso de contraste
// de la paleta: el color nunca es el único portador del dato.
function barras(datos, opt) {
  opt = opt || {};
  const max = Math.max(...datos.map(d => d.v || 0), 1);
  // El segundo valor evita la lectura tramposa de una tasa sola: quien tiene
  // poco alcance siempre saca buena tasa, y sin el absoluto al lado el gráfico
  // parece decir algo que no dice.
  const conSec = datos.some(d => d.v2 !== undefined && d.v2 !== '');
  return `<div class="barras${conSec ? ' conSec' : ''}" role="img" aria-label="${escapar(opt.titulo || '')}">` +
    datos.map(d => {
      const pct = Math.max((d.v || 0) / max * 100, 0.8);
      const col = d.color || 'var(--s1)';
      const val = d.vt !== undefined ? d.vt : fmt(d.v);
      return `<div class="fila">
        <span class="et">${escapar(d.et)}</span>
        <span class="pista" data-tip="${escapar(d.tip || (d.et + ': ' + val))}"
          ><span class="bar" style="width:${pct}%;background:${col}"></span></span>
        <span class="val">${escapar(val)}</span>
        ${conSec ? `<span class="val2">${escapar(d.v2 || '')}</span>` : ''}
      </div>`;
    }).join('') + '</div>';
}

// Dispersión. Identidad por etiqueta directa, no por color: con cuatro
// entidades ninguna paleta de cuatro pasa las pruebas de todos los pares,
// así que se destaca la cuenta propia y el resto queda en tono neutro.
function dispersion(datos, opt) {
  const W = 1000, H = 440, m = { t: 26, r: 40, b: 56, l: 82 };
  const maxX = maxLindo(Math.max(...datos.map(d => d.x), 1) * 1.15);
  const maxY = maxLindo(Math.max(...datos.map(d => d.y), 1) * 1.15);
  const px = v => m.l + (v / maxX) * (W - m.l - m.r);
  const py = v => H - m.b - (v / maxY) * (H - m.t - m.b);

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapar(opt.titulo || '')}">`;
  for (let i = 0; i <= 4; i++) {
    const y = m.t + (i / 4) * (H - m.t - m.b);
    const v = maxY * (1 - i / 4);
    s += `<line x1="${m.l}" y1="${y}" x2="${W - m.r}" y2="${y}" stroke="var(--grilla)" stroke-width="1"/>`;
    s += `<text class="gtxt" x="${m.l - 10}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  for (let i = 0; i <= 4; i++) {
    const x = m.l + (i / 4) * (W - m.l - m.r);
    s += `<text class="gtxt" x="${x}" y="${H - m.b + 20}" text-anchor="middle">${fmt(maxX * i / 4)}</text>`;
  }
  s += `<line x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}" stroke="var(--eje)" stroke-width="1"/>`;
  s += `<text class="gtxt" x="${(W + m.l) / 2}" y="${H - 12}" text-anchor="middle">${escapar(opt.ejeX)}</text>`;
  s += `<text class="gtxt" x="${-(H - m.b + m.t) / 2}" y="16" transform="rotate(-90)" text-anchor="middle">${escapar(opt.ejeY)}</text>`;

  for (const d of datos) {
    const x = px(d.x), y = py(d.y);
    const col = d.destacar ? (d.color || 'var(--s1)') : 'var(--neutro)';
    s += `<circle cx="${x}" cy="${y}" r="9" fill="${col}" stroke="var(--sup)" stroke-width="2"/>`;
    const aIzq = x > W * 0.72;
    s += `<text class="gtxt ident" x="${aIzq ? x - 16 : x + 16}" y="${y + 4}" text-anchor="${aIzq ? 'end' : 'start'}">${escapar(d.et)}</text>`;
    s += `<circle class="marca-hit" cx="${x}" cy="${y}" r="20" data-tip="${escapar(d.tip)}"/>`;
  }
  return s + '</svg>';
}

// Columnas por hora del día. Una sola serie, un solo color.
function columnasHora(horas, color, opt) {
  const W = 1000, H = 190, m = { t: 14, r: 8, b: 30, l: 34 };
  const max = Math.max(...horas, 1);
  const ancho = (W - m.l - m.r) / 24;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapar(opt && opt.titulo || 'Publicaciones por hora')}">`;
  s += `<line x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}" stroke="var(--eje)"/>`;
  s += `<text class="gtxt" x="${m.l - 8}" y="${m.t + 8}" text-anchor="end">${max}</text>`;
  horas.forEach((v, h) => {
    const alt = (v / max) * (H - m.t - m.b);
    const x = m.l + h * ancho, y = H - m.b - alt;
    const w = ancho - 2; // 2px de aire entre columnas, sin bordes
    if (v > 0) {
      s += `<path d="M${x} ${H - m.b} V${y + 4} a4 4 0 0 1 4 -4 H${x + w - 4} a4 4 0 0 1 4 4 V${H - m.b} Z" fill="${color}"/>`;
    }
    if (h % 3 === 0) s += `<text class="gtxt" x="${x + w / 2}" y="${H - m.b + 17}" text-anchor="middle">${String(h).padStart(2, '0')}</text>`;
    s += `<rect class="marca-hit" x="${x}" y="${m.t}" width="${ancho}" height="${H - m.t - m.b}"
           data-tip="${String(h).padStart(2, '0')}:00 — ${v} publicacion${v === 1 ? '' : 'es'}"/>`;
  });
  return s + '</svg>';
}

let idTarjeta = 0;
function tarjeta(titulo, sub, cuerpoSvg, tabla) {
  const id = 'tj' + (++idTarjeta);
  // Sin gráfico, la tabla ES el contenido: se muestra directamente y no hay

  const soloTabla = !cuerpoSvg;
  return `<div class="tarjeta">
    <div class="cabTarjeta">
      <div class="crece"><h3>${escapar(titulo)}</h3><p class="sub">${sub}</p></div>
      ${tabla && !soloTabla ? `<button class="chip" data-tabla="${id}" aria-pressed="false">Tabla</button>` : ''}
    </div>
    ${soloTabla ? '' : `<div id="${id}-g">${cuerpoSvg}</div>`}
    ${tabla ? `<div id="${id}-t" class="envTabla${soloTabla ? '' : ' oculto'}">${tabla}</div>` : ''}
  </div>`;
}

function tablaHTML(cols, filas) {

// ====================================================================
// Vista COMPARADO

function renderComparado() {
  const posts = seleccion();
  const cuentas = cuentasDe(posts);
  if (!cuentas.length) { $('#vComparado').innerHTML = '<p class="explica">No hay publicaciones para este filtro.</p>'; return; }
  const ag = cuentas.map(agregados);
  const propia = ag.find(a => a.rol === 'propia') || ag[0];

  let h = avisoCobertura(posts);

  h += `<h2 class="seccion">Lo que decide la redacción</h2>
    <p class="explica">Cuántas veces publicó cada cuenta. Es actividad: depende sólo de la decisión del medio,
    y por sí sola no dice nada sobre el resultado.</p>`;
  // Todo gráfico de barras va de mayor a menor: el orden es parte de lo que se
  // lee. La identidad de cada cuenta la lleva el color, no el puesto en la lista.
  const porVolumen = ag.slice().sort((a, b) => b.n - a.n);
  h += tarjeta('Publicaciones en el período', 'Actividad — no es una medida de éxito',
    barras(porVolumen.map(a => ({ et: '@' + a.handle, v: a.n, color: a.color, tip: `@${a.handle}: ${fmt(a.n)} publicaciones` })),
      { titulo: 'Publicaciones por cuenta' }),
    tablaHTML(['Cuenta', 'Publicaciones'], porVolumen.map(a => ['@' + a.handle, fmt(a.n)])));

  h += `<h2 class="seccion">Lo que decide la audiencia</h2>
    <p class="explica">Estas cifras no las controla el medio.</p>`;

  // --- la respuesta que consigue una publicación típica ---------------
  const ordenReac = ag.slice().sort((a, b) => b.reaccionesPorPost - a.reaccionesPorPost);
  const primero = ordenReac[0], ultimo = ordenReac[ordenReac.length - 1];
  const masPublica = ag.slice().sort((a, b) => b.n - a.n)[0];

  const partesPrimero = SENALES.map(s => `${fmt(primero[s.k + 'Tot'] / primero.n)} ${s.n.toLowerCase()}`).join(', ');
  h += `<div class="comoSeLee"><strong>Cómo se lee.</strong> Cada barra es lo que consigue

    Por ejemplo: cada publicación de @${escapar(primero.handle)} recibe
    <strong>${fmt(primero.reaccionesPorPost)} reacciones</strong> — ${escapar(partesPrimero)}.
    Los colores del más claro al más oscuro son me gusta, guardados, respuestas y compartidos.
    ${masPublica.handle !== primero.handle ? `Mirá @${escapar(masPublica.handle)}: publicó ${fmt(masPublica.n)} veces,
    más que nadie, y cada publicación consigue ${fmt(masPublica.reaccionesPorPost)}. Publicar mucho no aparece
    acá como mérito, y esa es la idea.` : ''}</div>`;

  h += leyendaSenales();
  h += tarjeta('Reacciones que consigue una publicación promedio',
    `Me gusta + guardados + respuestas + compartidos, dividido por la cantidad de publicaciones — trata un me gusta y un compartido como equivalentes, por eso el desglose queda a la vista`,
    barrasApiladas(ordenReac.map(a => ({
      et: '@' + a.handle,
      partes: SENALES.reduce((o, s) => (o[s.k] = a[s.k + 'Tot'] / a.n, o), {}),
      total: a.reaccionesPorPost,
      v2: fmt(a.n) + ' posts',
      tip: `@${a.handle}<br><b>${fmt(a.reaccionesPorPost)}</b> reacciones por publicación<br>${fmt(a.reaccionesTot)} en total, en ${fmt(a.n)} publicaciones`
    })), SENALES, { titulo: 'Reacciones por publicación' }),
    tablaHTML(['Cuenta', 'Publicaciones'].concat(SENALES.map(s => s.n)).concat(['Reacciones por publicación']),
      ordenReac.map(a => ['@' + a.handle, fmt(a.n)]
        .concat(SENALES.map(s => fmt1(a[s.k + 'Tot'] / a.n)))
        .concat([fmt(a.reaccionesPorPost)]))));

  h += `<div class="par">`;
  const porVistas = ag.slice().sort((a, b) => (b.vistasMed || 0) - (a.vistasMed || 0));
  h += tarjeta('Alcance mediano por publicación', 'Vistas de la publicación típica',
    barras(porVistas.map(a => ({ et: '@' + a.handle, v: a.vistasMed, color: a.color,
      tip: `@${a.handle}<br>Mediana <b>${fmt(a.vistasMed)}</b> vistas<br>Total ${fmt(a.vistasTot)}` })),
      { titulo: 'Vistas medianas' }),
    tablaHTML(['Cuenta', 'Mediana', 'Total'], porVistas.map(a => ['@' + a.handle, fmt(a.vistasMed), fmt(a.vistasTot)])));

  const porCompartidos = ag.slice().sort((a, b) => (b.repostsMed || 0) - (a.repostsMed || 0));
  h += tarjeta('Compartidos medianos por publicación', 'La señal más costosa de producir',
    barras(porCompartidos.map(a => ({ et: '@' + a.handle, v: a.repostsMed, color: a.color,
      tip: `@${a.handle}<br>Mediana <b>${fmt(a.repostsMed)}</b> compartidos<br>Total ${fmt(a.repostsTot)}` })),
      { titulo: 'Compartidos medianos' }),
    tablaHTML(['Cuenta', 'Mediana', 'Total'], porCompartidos.map(a => ['@' + a.handle, fmt(a.repostsMed), fmt(a.repostsTot)])));
  h += `</div>`;

  // --- el gráfico que responde la pregunta de fondo -----------------
  h += `<h2 class="seccion">Volumen contra alcance</h2>
    <p class="explica">Cada punto es una cuenta. A la derecha, las que más publican; arriba, las que más alcance
    consiguen por publicación. <strong>Abajo a la derecha se publica mucho y se llega poco.</strong>
    La identidad va en la etiqueta y no en el color, porque con cuatro entidades ninguna paleta
    de cuatro colores se distingue de manera confiable en una dispersión.</p>`;
  h += tarjeta('Publicar más no es llegar más', 'Volumen en el eje horizontal, alcance mediano en el vertical',
    dispersion(ag.map(a => ({
      et: '@' + a.handle, x: a.n, y: a.vistasMed, destacar: a.rol === 'propia', color: a.color,
      tip: `@${a.handle}<br>${fmt(a.n)} publicaciones<br>Mediana <b>${fmt(a.vistasMed)}</b> vistas`
    })), { titulo: 'Volumen contra alcance', ejeX: 'Publicaciones en el período', ejeY: 'Vistas medianas por publicación' }),
    tablaHTML(['Cuenta', 'Publicaciones', 'Vistas medianas'], ag.map(a => ['@' + a.handle, fmt(a.n), fmt(a.vistasMed)])));

  // --- perfil de respuesta ------------------------------------------
  // --- señal por señal, con el denominador a elección ------------------
  const dn = DENOMINADORES[denomActual];
  h += `<h2 class="seccion">Señal por señal</h2>
    <p class="explica">Las cuatro señales por separado, ordenadas por lo que le cuesta a una persona producirlas.
    <strong>El denominador cambia quién gana</strong>, así que conviene mirarlo con los tres y quedarse con lo que
    aguanta en los tres.</p>
    <div class="selDenom">
      <span class="etq">Contar</span>
      ${Object.entries(DENOMINADORES).map(([k, d]) =>
        `<button class="chip" data-denom="${k}" aria-pressed="${k === denomActual}">${escapar(d.n)}</button>`).join('')}
    </div>
    <p class="explica" style="margin-top:-4px">${escapar(dn.ex)}</p>`;

  const valorDe = (a, s) => a[s.k + 'Tot'] / (dn.div(a) || 1);
  const formato = denomActual === 'bruto' ? fmt : fmt1;

  h += leyendaCuentas(ag);
  h += `<div class="par">`;
  for (const s of SENALES) {
    const orden = ag.slice().sort((x, y) => valorDe(y, s) - valorDe(x, s));
    const lider = orden[0];
    // ¿El líder lo es con cualquier denominador? Eso es lo que aguanta.
    const robusto = Object.values(DENOMINADORES).every(d =>
      ag.slice().sort((x, y) => (y[s.k + 'Tot'] / (d.div(y) || 1)) - (x[s.k + 'Tot'] / (d.div(x) || 1)))[0].handle === lider.handle);
    h += tarjeta(s.n,
      `${escapar(dn.n)} · ${s.d} — ` +
      (robusto ? `<strong>@${escapar(lider.handle)} gana lo cuentes como lo cuentes</strong>`
               : `@${escapar(lider.handle)} con este denominador, no con todos`),
      barras(orden.map(a => ({
        et: '@' + a.handle, v: valorDe(a, s), vt: formato(valorDe(a, s)),
        v2: denomActual === 'bruto' ? '' : fmt(a[s.k + 'Tot']) + ' tot.', color: a.color,
        tip: `@${a.handle}<br><b>${formato(valorDe(a, s))}</b> · ${escapar(dn.n.toLowerCase())}<br>${fmt(a[s.k + 'Tot'])} en total, en ${fmt(a.n)} publicaciones`
      })), { titulo: s.n }),
      tablaHTML(['Cuenta', 'Cantidad total', 'Por publicación', 'Por mil vistas', 'Publicaciones'],
        orden.map(a => ['@' + a.handle, fmt(a[s.k + 'Tot']), fmt1(a[s.k + 'Tot'] / a.n), fmt1(a[s.k + 'K']), fmt(a.n)])));
  }
  h += `</div>`;

  // --- modelo de publicación -----------------------------------------
  // Va después de las señales y antes del ritmo porque responde otra pregunta:
  // no quién gana, sino con qué está jugando cada uno.
  h += `<h2 class="seccion">Modelo de publicación</h2>
    <p class="explica">Qué publica cada cuenta, no cuánto. Video, foto, solo link, encuesta o texto pelado
    son cinco decisiones editoriales con costos muy distintos: filmar y editar no se parece a pegar un enlace.
    Dos medios con el mismo volumen pueden tener modelos opuestos, y eso explica buena parte
    de la diferencia de alcance.</p>`;

  const conFormato = ag.filter(a => a.formatos.length);
  h += `<div class="comoSeLee">${conFormato.map(frasearModelo).join(' ')}</div>`;

  h += tarjeta('Mezcla de formatos, cuenta por cuenta',
    'Porcentaje de las publicaciones de cada cuenta — cada fila suma 100%',
    '', matrizFormatos(conFormato));

  const fMercado = porFormato(posts);
  h += mejorFormato(fMercado);
  h += `<div class="par">`;
  h += tarjetasFormato(fMercado, 'Alcance por formato · todo el mercado',
    `${fmt(posts.length)} publicaciones de ${fmt(cuentas.length)} cuentas juntas`);
  h += tarjetasFormato(propia.formatos, 'Alcance por formato · @' + escapar(propia.handle),
    `${fmt(propia.n)} publicaciones de la cuenta de referencia`);
  h += `</div>`;

  // --- ritmo ---------------------------------------------------------
  h += `<h2 class="seccion">Ritmo de publicación</h2>
    <p class="explica">Publicaciones por hora del día, hora local. Sirve para ver quién corta de noche y quién no.</p>`;
  for (const a of ag) {
    h += tarjeta('@' + a.handle + (a.rol === 'propia' ? ' · propia' : ''),
      `${fmt(a.n)} publicaciones · pico a las ${String(a.horas.indexOf(Math.max(...a.horas))).padStart(2, '0')}:00`,
      columnasHora(a.horas, a.color, { titulo: 'Ritmo de @' + a.handle }),
      tablaHTML(['Hora', 'Publicaciones'], a.horas.map((v, i) => [String(i).padStart(2, '0') + ':00', String(v)])));
  }

  h += `<p class="explica" style="margin-top:22px">
    <strong>Una advertencia sobre estas cifras.</strong> Todas las métricas se leyeron en un único momento,
    así que una publicación de la mañana acumuló más horas de exposición que una de la noche.
    Sirven para comparar órdenes de magnitud, no para un ranking fino. Eso se corrige con una segunda
    lectura a T+24, que todavía no está implementada.</p>`;

  $('#vComparado').innerHTML = h;
}

function renderPropio() {
  const posts = seleccion();
  const cuentas = cuentasDe(posts);
  if (!cuentas.length) { $('#vPropio').innerHTML = '<p class="explica">No hay publicaciones para este filtro.</p>'; return; }

  const guardado = leerLocal('anubis_cuenta');
  const elegida = cuentas.find(c => c.handle === guardado) || cuentas.find(c => c.rol === 'propia') || cuentas[0];
  const ag = agregados(elegida);
  const resto = cuentas.filter(c => c.handle !== elegida.handle).map(agregados);

  let h = `<div class="filtros" style="margin-bottom:18px">
    <label for="fCuenta">Cuenta</label>
    <select id="fCuenta">${cuentas.map(c =>
      `<option value="${escapar(c.handle)}"${c.handle === elegida.handle ? ' selected' : ''}>@${escapar(c.handle)}${c.rol === 'propia' ? ' · propia' : ''}</option>`).join('')}</select>
  </div>`;

  const mercadoTasa = s => {
    const vt = suma(resto.map(r => r.vistasTot));
    return vt ? (suma(resto.map(r => r[s + 'Tot'])) / vt) * 1000 : null;
  };

  h += `<div class="fichas">
    <div class="ficha"><span class="v">${fmt(ag.n)}</span><span class="e">Publicaciones</span></div>
    <div class="ficha"><span class="v">${fmt(ag.vistasTot)}</span><span class="e">Vistas acumuladas</span></div>
    <div class="ficha"><span class="v">${fmt(ag.vistasMed)}</span><span class="e">Vistas medianas</span></div>
    ${SENALES.map(s => {
      const m = mercadoTasa(s.k);
      const dif = (m && ag[s.k + 'K'] !== null && isFinite(m) && m > 0) ? (ag[s.k + 'K'] / m) : null;
      let nota = '';
      if (dif !== null) {
        const texto = dif >= 1.05 ? '×' + fmt1(dif) + ' sobre el resto del mercado'
                    : dif <= 0.95 ? '×' + fmt1(dif) + ' del resto del mercado'
                    : 'a la par del resto del mercado';
        nota = `<span class="n" style="color:${dif >= 1.05 ? 'var(--ok)' : 'var(--tinta-2)'}">${texto}</span>`;
      }
      return `<div class="ficha"><span class="v">${fmt1(ag[s.k + 'K'])}</span><span class="e">${s.n} por mil vistas</span>${nota}</div>`;
    }).join('')}
  </div>`;

  h += tarjeta('Ritmo de publicación', `Hora local · ${fmt(ag.n)} publicaciones`,
    columnasHora(ag.horas, ag.color, { titulo: 'Ritmo' }),
    tablaHTML(['Hora', 'Publicaciones'], ag.horas.map((v, i) => [String(i).padStart(2, '0') + ':00', String(v)])));

  // --- modelo de publicación de esta cuenta ---------------------------
  h += `<h2 class="seccion">Modelo de publicación</h2>
    <p class="explica">${frasearModelo(ag)}</p>`;
  h += `<div class="par">`;
  h += tarjeta('Mezcla de formatos', 'Cuánto de cada cosa publicó',
    barras(ag.formatos.map(f => ({
      et: f.n, v: f.posts, color: f.color,
      vt: fmt(f.posts) + ' · ' + Math.round(100 * f.parte) + '%',
      tip: `<b>${f.n}</b> — ${escapar(f.d)}<br>${fmt(f.posts)} publicaciones` })), { titulo: 'Mezcla de formatos' }),
    tablaHTML(['Formato', 'Qué es', 'Publicaciones', 'Porcentaje'],
      ag.formatos.map(f => [f.n, f.d, fmt(f.posts), Math.round(100 * f.parte) + '%'])));
  h += tarjetasFormato(ag.formatos, 'Qué consigue cada formato',
    'Vistas medianas — el ⚠ marca los formatos con menos de cinco publicaciones');
  h += `</div>`;
  h += mejorFormato(ag.formatos);

  // El desglose viejo sigue disponible: repost y respuesta no son formatos
  // pero son decisiones, y conviene no perderlas de vista.
  const tipos = Object.entries(ag.tipos).sort((a, b) => b[1] - a[1]);
  h += tarjeta('Original, repost o respuesta', 'Otra división: de quién es lo que publica',
    '', tablaHTML(['Tipo', 'Publicaciones', 'Porcentaje'],
      tipos.map(([t, v]) => [t, fmt(v), Math.round(100 * v / ag.n) + '%'])));

  // Publicaciones destacadas por cada señal
  h += `<h2 class="seccion">Publicaciones destacadas</h2>
    <p class="explica">La más alta de cada señal. El enlace abre la publicación original en X.</p>`;
  let filas = '';
  for (const s of SENALES.concat([{ k: 'vistas', n: 'Vistas' }])) {
    const top = elegida.posts.slice().sort((a, b) => (metrica(b, s.k) || 0) - (metrica(a, s.k) || 0))[0];
    if (!top) continue;
    const txt = (top.texto || '').split('\n')[0].slice(0, 110);
    filas += `<tr><td style="white-space:nowrap">${escapar(s.n)}</td>
      <td style="text-align:right;font-weight:700">${fmt(metrica(top, s.k))}</td>
      <td style="text-align:left">${escapar(txt)}${top.texto_truncado ? ' <em style="color:var(--tinta-3)">(texto cortado por X)</em>' : ''}</td>
      <td><a href="${escapar(top.url)}" target="_blank" rel="noopener">ver</a></td></tr>`;
  }
  h += `<div class="tarjeta"><div class="envTabla"><table class="datos">
    <thead><tr><th>Señal</th><th>Valor</th><th>Publicación</th><th></th></tr></thead>
    <tbody>${filas}</tbody></table></div></div>`;

  const truncados = elegida.posts.filter(p => p.texto_truncado).length;
  if (truncados) {
    h += `<div class="aviso"><strong>${truncados} de ${ag.n} publicaciones tienen el texto cortado</strong>
      por el "Mostrar más" de X. El análisis de contenido de esta cuenta trabaja con material incompleto
      hasta que exista la segunda pasada que recupera el texto entero.</div>`;
  }

  $('#vPropio').innerHTML = h;
  const sel = $('#fCuenta');
  if (sel) sel.addEventListener('change', () => { guardarLocal('anubis_cuenta', sel.value); renderPropio(); });
}

const MODELOS = {

// Los temas y los hechos ya clasificados, en la misma forma doble que muestra
// la pantalla: el mercado entero y cada cuenta por separado. Sin esto el modelo
// sólo ve métricas y no puede decir nada sobre agenda.
function temasParaModelo(posts, cuentas) {
  const clasif = posts.filter(p => p.ia);
  if (!clasif.length) return null;
  const merc = {}, porCuenta = {};
  for (const p of clasif) {
    const t = p.ia.tema, hd = p.cuenta_monitoreada;
    const reac = SENALES.reduce((s, x) => s + (metrica(p, x.k) || 0), 0);
    (merc[t] = merc[t] || { n: 0, reac: 0 });
    merc[t].n++; merc[t].reac += reac;
    const m = (porCuenta[hd] = porCuenta[hd] || {});
    (m[t] = m[t] || { n: 0, reac: 0 });
    m[t].n++; m[t].reac += reac;
  }
  const empaquetar = o => Object.entries(o).sort((a, b) => b[1].n - a[1].n)
    .map(([t, d]) => ({ tema: t, publicaciones: d.n,
      reacciones_por_publicacion: d.n >= 3 ? +(d.reac / d.n).toFixed(1) : null }));

  const hechos = hechosCache || (hechosCache = construirHechos(posts, umbralHecho));
  const compartidos = hechos.filter(x => x.cuentas.length > 1);
  const ref = cuentas.find(c => c.rol === 'propia');
  const cubreRef = x => ref && x.cuentas.some(c => c.toLowerCase() === ref.handle.toLowerCase());

  return {
    nota: 'mercado es la suma de todas las cuentas; por_cuenta no se suma con mercado, son lecturas distintas del mismo conjunto. reacciones_por_publicacion es null cuando hay menos de tres piezas.',
    clasificadas: clasif.length,
    mercado: empaquetar(merc),
    por_cuenta: Object.fromEntries(Object.entries(porCuenta).map(([h, o]) => [h, empaquetar(o)])),
    hechos_compartidos: compartidos.length,
    huecos_de_cobertura: ref ? compartidos.filter(x => !cubreRef(x)).slice(0, 20)
      .map(x => ({ hecho: x.titulo, tema: x.tema, lo_cubrieron: x.cuentas })) : null,
    exclusivos_de_la_cuenta_propia: ref ? hechos.filter(x => x.cuentas.length === 1 && cubreRef(x))
      .sort((a, b) => b.reacciones - a.reacciones).slice(0, 10)
      .map(x => ({ hecho: x.titulo, tema: x.tema, reacciones: x.reacciones })) : null
  };
}

function contextoParaModelo() {

          cortado: !!p.texto_truncado,
          vistas: metrica(p, 'vistas'), compartidos: metrica(p, 'reposts')
        }))
    }))
  };
}

// Markdown mínimo: negrita y títulos. El resto lo resuelve pre-wrap.
// ====================================================================
// La respuesta del modelo, maquetada como una nota
// ====================================================================
// Antes la respuesta salía como un bloque de texto preformateado, y una
// respuesta de mil palabras así no se lee: se hojea. Acá se arma con ancho de
// columna fijo, títulos, listas, y —lo que más cambia— las tablas como tablas
// y los números como gráfico cuando el modelo pide uno.
//
// El modelo nunca dibuja: pide. Manda un bloque con los datos y el gráfico lo
// dibuja el mismo código que dibuja todo lo demás en el panel. Así una barra
// acá y una barra en Comparado significan lo mismo.

function enLinea(s) {
  return escapar(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
}

function filaTabla(linea) {
  return linea.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
}
const ES_SEPARADOR = /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;

// Un número con formato castellano —1.735, 12,5— vuelve a ser número para
// poder alinear la columna a la derecha sin adivinar.
function pareceNumero(s) {
  return /^[-+]?[\d.]+(,\d+)?\s*%?$/.test(String(s).trim()) && /\d/.test(s);
}

function graficoPedido(json) {
  let g;
  try { g = JSON.parse(json); } catch (e) {
    return `<p class="explica">El modelo pidió un gráfico con datos que no se entienden, así que no se dibujó.</p>`;
  }
  const datos = (Array.isArray(g.datos) ? g.datos : [])
    .map(d => ({ et: String(d.et === undefined ? d.etiqueta : d.et),
                 v: Number(d.v === undefined ? d.valor : d.v) }))
    .filter(d => d.et && isFinite(d.v));
  if (!datos.length) return '';
  // Siempre de mayor a menor: es la única forma en que una barra se lee sin
  // tener que recorrer todas las etiquetas antes de entender nada.
  datos.sort((a, b) => b.v - a.v);
  const paleta = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--violeta)', 'var(--rojo)'];
  return `<figure class="figIA">
    ${g.titulo ? `<figcaption><strong>${escapar(g.titulo)}</strong>${g.sub ? ` · <span>${escapar(g.sub)}</span>` : ''}</figcaption>` : ''}
    ${barras(datos.map((d, i) => ({ et: d.et, v: d.v, color: paleta[i % paleta.length],
      vt: fmt(d.v) + (g.unidad ? ' ' + g.unidad : '') })), { titulo: g.titulo || 'Gráfico' })}
    <p class="explica" style="margin:8px 0 0">Gráfico pedido por el modelo con datos del contexto.
      Los números salen de lo capturado; si alguno no te cierra, comparalo con las pestañas de arriba.</p>
  </figure>`;
}

function nota(t) {
  const lineas = String(t || '').split('\n');
  let h = '', parrafo = [], lista = null;

  const cerrarParrafo = () => { if (parrafo.length) { h += `<p>${enLinea(parrafo.join(' '))}</p>`; parrafo = []; } };
  const cerrarLista = () => { if (lista) { h += `</${lista}>`; lista = null; } };
  const cerrar = () => { cerrarParrafo(); cerrarLista(); };

  for (let i = 0; i < lineas.length; i++) {
    const l = lineas[i];

    // --- bloques cercados ---
    const cerca = l.match(/^\s*```+\s*(\w*)/);
    if (cerca) {
      cerrar();
      const cuerpo = [];
      for (i++; i < lineas.length && !/^\s*```/.test(lineas[i]); i++) cuerpo.push(lineas[i]);
      const dentro = cuerpo.join('\n');
      h += /^(grafico|gráfico|chart)$/i.test(cerca[1]) ? graficoPedido(dentro)
                                                       : `<pre>${escapar(dentro)}</pre>`;
      continue;
    }

    // --- tablas ---
    if (/^\s*\|/.test(l) && lineas[i + 1] && ES_SEPARADOR.test(lineas[i + 1])) {
      cerrar();
      const cab = filaTabla(l);
      const filas = [];
      for (i += 2; i < lineas.length && /^\s*\|/.test(lineas[i]); i++) filas.push(filaTabla(lineas[i]));
      i--;
      const alinea = cab.map((_, c) => filas.length && filas.every(f => !f[c] || pareceNumero(f[c])));
      h += `<div class="envTabla"><table class="datos"><thead><tr>` +
        cab.map((c, j) => `<th${alinea[j] ? ' style="text-align:right"' : ''}>${enLinea(c)}</th>`).join('') +
        `</tr></thead><tbody>` +
        filas.map(f => `<tr>` + cab.map((_, j) =>
          `<td${alinea[j] ? ' style="text-align:right"' : ''}>${enLinea(f[j] || '')}</td>`).join('') + `</tr>`).join('') +
        `</tbody></table></div>`;
      continue;
    }

    // --- títulos ---
    const tit = l.match(/^\s*(#{1,6})\s*(.+?)\s*#*\s*$/);
    if (tit) { cerrar(); h += `<h3>${enLinea(tit[2])}</h3>`; continue; }

    // Una línea sola en negrita es un título aunque no traiga almohadillas:
    // los modelos la usan como subtítulo todo el tiempo.
    const negrita = l.match(/^\s*\*\*(.+?)\*\*:?\s*$/);
    if (negrita) { cerrar(); h += `<h3>${enLinea(negrita[1])}</h3>`; continue; }

    // --- listas ---
    const punto = l.match(/^\s*[-*•]\s+(.+)$/);
    const numero = l.match(/^\s*\d+[.)]\s+(.+)$/);
    if (punto || numero) {
      cerrarParrafo();
      const quiere = punto ? 'ul' : 'ol';
      if (lista !== quiere) { cerrarLista(); h += `<${quiere}>`; lista = quiere; }
      h += `<li>${enLinea((punto || numero)[1])}</li>`;
      continue;
    }

    if (!l.trim()) { cerrar(); continue; }
    cerrarLista();
    parrafo.push(l.trim());
  }
  cerrar();
  return h || `<p class="explica">El modelo no devolvió texto.</p>`;
}

// Se mantiene el nombre viejo porque lo usan tres llamadores.
function formatoTexto(t) { return nota(t); }

// Una clave por proveedor, compartida entre la clasificación y las preguntas.
// Las versiones anteriores guardaban una sola clave sin decir de quién era:
// se migra asumiendo que era la del proveedor que estaba elegido.
function claveDe(prov) {
  const k = leerLocal('anubis_clave_' + prov);
  if (k) return k;
  if ((leerLocal('anubis_prov') || 'anthropic') === prov) return leerLocal('anubis_clave') || '';
  return '';
}

async function llamarModelo(prov, modelo, clave, sistema, usuario) {
  if (prov === 'anthropic') {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': clave,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: modelo, max_tokens: 2200, system: sistema,
        messages: [{ role: 'user', content: usuario }] })
    });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    return (j.content || []).map(c => c.text || '').join('');
  }
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + clave },
    body: JSON.stringify({ model: modelo, messages: [
      { role: 'system', content: sistema }, { role: 'user', content: usuario }] })
  });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  return j.choices[0].message.content;
}

function errorHTML(e) {
  return `<div class="aviso" style="margin-top:14px"><strong>No se pudo consultar.</strong> ${escapar(e.message)}
    <br><br>Si el error menciona CORS o "Failed to fetch", es porque el archivo se abrió con doble clic
    (origen <code>file://</code>). Servilo por HTTP y funciona:
    <code>python3 -m http.server</code> en la carpeta, y abrilo en <code>localhost:8000</code>.</div>`;
}

const NOMBRE_PROV = { anthropic: 'Claude Haiku', openai: 'GPT-5 mini' };

// Dos modelos, el mismo contexto y las mismas preguntas. Lo que interesa no es
// cuál escribe mejor sino dónde no coinciden: ahí es donde la lectura depende
// del modelo y no de los datos, y eso hay que mirarlo a mano.
async function analisisAuto(provs) {
  const est = $('#aEstado'), out = $('#aSalida');
  const claves = {};
  for (const p of provs) {
    claves[p] = (p === 'anthropic' ? $('#kAnthropic') : $('#kOpenai')).value.trim();
    if (!claves[p]) { est.textContent = `Falta la clave de ${p === 'anthropic' ? 'Anthropic' : 'OpenAI'}.`; return; }
    guardarLocal('anubis_clave_' + p, claves[p]);
  }

  const botones = ['#aClaude', '#aGpt', '#aAmbos'].map($);
  botones.forEach(b => b.disabled = true);
  est.textContent = provs.length > 1 ? 'Consultando los dos modelos en paralelo…' : 'Consultando…';
  out.innerHTML = '';

  const usuario = 'Datos:\n```json\n' + JSON.stringify(contextoParaModelo()) + '\n```\n\n' + instruccionAuto();

  const resultados = await Promise.all(provs.map(async p => {
    try {
      return { prov: p, texto: await llamarModelo(p, MODELOS[p].economico, claves[p], SISTEMA, usuario) };
    } catch (e) { return { prov: p, error: e }; }
  }));

  out.innerHTML = `<div class="${provs.length > 1 ? 'par' : ''}">` + resultados.map(r => `
    <div>
      <p class="sub" style="margin:0 0 6px"><strong>${escapar(NOMBRE_PROV[r.prov])}</strong>
        · ${escapar(MODELOS[r.prov].economico)}</p>
      ${r.error ? errorHTML(r.error) : `<div class="respuesta">${formatoTexto(r.texto)}</div>`}
    </div>`).join('') + '</div>';

  const ok = resultados.filter(r => !r.error);
  if (provs.length > 1 && ok.length === 2) {
    out.innerHTML += `<div style="margin-top:16px">
      <button id="aContraste">¿En qué no coinciden?</button>
      <span id="aEstado2" style="font-size:12px;color:var(--tinta-3);margin-left:10px"></span>
      <div id="aContrasteSalida"></div></div>`;
    $('#aContraste').addEventListener('click', () => contrastar(ok, claves));
  }
  est.textContent = ok.length ? 'Listo.' : '';
  botones.forEach(b => b.disabled = false);
}

async function contrastar(ok, claves) {
  const est = $('#aEstado2'), out = $('#aContrasteSalida');
  const b = $('#aContraste');
  b.disabled = true;
  est.textContent = 'Comparando…';
  const sistema = 'Comparás dos análisis del mismo conjunto de datos, hechos por dos modelos distintos. ' +
    'Respondés en español rioplatense, con registro profesional. No elegís un ganador: señalás en qué ' +
    'coinciden, en qué se contradicen y qué afirmó uno que el otro no menciona. Si una afirmación no se ' +
    'puede verificar con los datos agregados, lo decís.';
  const usuario = ok.map(r => `## Análisis de ${NOMBRE_PROV[r.prov]}\n${r.texto}`).join('\n\n') +
    '\n\nDecime: 1) en qué coinciden, 2) en qué se contradicen, 3) qué dijo uno solo y merece revisarse.';
  try {
    const texto = await llamarModelo('anthropic', MODELOS.anthropic.economico, claves.anthropic, sistema, usuario);
    out.innerHTML = `<div class="respuesta" style="margin-top:12px">${formatoTexto(texto)}</div>`;
    est.textContent = '';
  } catch (e) {
    out.innerHTML = errorHTML(e);
    est.textContent = '';
  } finally { b.disabled = false; }
}

// ====================================================================
// Dictado de la pregunta
// ====================================================================
// Dos caminos, y hacen falta los dos. El reconocimiento nativo de Chrome no
// cuesta nada y escribe mientras hablás, pero en páginas de extensión falla
// seguido con error de red. Cuando eso pasa se graba el audio y se transcribe
// con el modelo económico de OpenAI, que es confiable pero consume clave.

// Una sola interacción: se toca el botón una vez, se habla, y la pausa cierra
// el dictado y manda la pregunta sola. Nadie tiene que acordarse de apretar
// nada al final, que era el paso que sobraba.
//
// PAUSA es cuánto silencio significa "terminé". Menos de un segundo y medio
// corta a mitad de frase, porque al pensar se hacen pausas más largas que al
// hablar; más de dos y parece que se colgó.
const PAUSA = 1600;        // ms de silencio que dan la frase por terminada
const ESPERA_INICIAL = 9000; // ms sin que se escuche nada antes de rendirse
const UMBRAL_VOZ = 0.015;  // energía mínima para considerar que alguien habla

const DIC = { activo: false, rec: null, grabador: null, stream: null, trozos: [],
              base: '', reloj: null, vigia: null, ctx: null, huboVoz: false };

function dictEstado(txt, ocupado) {
  const b = $('#pDictar');
  if (b) {
    // El estado va en una clase y no en el texto: adentro hay un ícono, y
    // escribirle encima lo borraría.
    b.classList.toggle('escuchando', !!DIC.activo);
    b.disabled = !!ocupado;
    b.title = DIC.activo ? 'Escuchando — tocá para cortar' : 'Preguntar hablando';
    b.setAttribute('aria-label', b.title);
  }
  if ($('#pEstado')) $('#pEstado').textContent = txt || '';
}

// Cada vez que entra sonido se reinicia la cuenta regresiva. Si llega a cero
// es que hubo pausa, y la pausa es la señal de que la pregunta está completa.
function reprogramarPausa(alCerrar, ms) {
  clearTimeout(DIC.reloj);
  DIC.reloj = setTimeout(alCerrar, ms || PAUSA);
}

function limpiarRelojes() {
  clearTimeout(DIC.reloj); DIC.reloj = null;
  if (DIC.vigia) { cancelAnimationFrame(DIC.vigia); DIC.vigia = null; }
  if (DIC.ctx) { try { DIC.ctx.close(); } catch (_) {} DIC.ctx = null; }
}

function alternarDictado() {
  if (DIC.activo) return detenerDictado();
  DIC.base = $('#pPregunta').value.trim();
  DIC.huboVoz = false;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) return arrancarVoz(SR);
  arrancarGrabacion('Este navegador no tiene reconocimiento de voz.');
}

function arrancarVoz(SR) {
  const rec = new SR();
  rec.lang = 'es-AR';
  rec.continuous = true;
  rec.interimResults = true;
  let final = '';
  let huboAlgo = false;

  // Los parciales sirven de detector de pausa: llegan mientras se habla y
  // dejan de llegar apenas hay silencio, sin tener que medir el audio.
  rec.onresult = e => {
    let parcial = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) { final += t; huboAlgo = true; } else parcial += t;
    }
    if (parcial.trim()) huboAlgo = true;
    DIC.huboVoz = DIC.huboVoz || huboAlgo;
    $('#pPregunta').value = (DIC.base ? DIC.base + ' ' : '') + (final + parcial).trim();
    if (DIC.rec === rec) reprogramarPausa(() => { try { rec.stop(); } catch (_) {} });
  };

  rec.onerror = e => {
    // Sin permiso no hay nada que reintentar; el resto de los errores suelen
    // ser del servicio de voz y ahí la grabación sí funciona.
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      DIC.activo = false; DIC.rec = null; limpiarRelojes();
      dictEstado('Chrome no dio acceso al micrófono. Habilitalo en el candado de la barra de direcciones.');
      return;
    }
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    limpiarRelojes();
    try { rec.stop(); } catch (_) {}
    DIC.rec = null;
    arrancarGrabacion('El reconocimiento de Chrome falló (' + e.error + ').');
  };

  // El cierre pasa siempre por acá, lo haya pedido el usuario, la pausa o el
  // propio Chrome: es el único momento en que el texto final está completo.
  rec.onend = () => {
    if (DIC.rec !== rec) return;
    limpiarRelojes();
    DIC.activo = false; DIC.rec = null;
    if (huboAlgo && $('#pPregunta').value.trim()) {
      dictEstado('Preguntando…');
      preguntar();
    } else {
      dictEstado('No se escuchó nada.');
    }
  };

  try {
    rec.start();
    DIC.rec = rec; DIC.activo = true;
    dictEstado('Escuchando… hacé una pausa cuando termines.');
    // Si no llega ni un parcial, no hay micrófono útil: mejor rendirse que
    // dejar el botón encendido para siempre.
    reprogramarPausa(() => { try { rec.stop(); } catch (_) {} }, ESPERA_INICIAL);
  } catch (e) {
    arrancarGrabacion('No se pudo iniciar el reconocimiento.');
  }
}

async function arrancarGrabacion(motivo) {
  const clave = $('#kOpenai').value.trim();
  if (!clave) {
    DIC.activo = false;
    dictEstado(motivo + ' Para transcribir hace falta la clave de OpenAI, que es la única de las dos con transcripción.');
    return;
  }
  try {
    DIC.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    DIC.activo = false;
    dictEstado(motivo + ' Y el micrófono no está disponible: ' + e.message);
    return;
  }
  DIC.trozos = [];
  const g = new MediaRecorder(DIC.stream);
  g.ondataavailable = ev => { if (ev.data.size) DIC.trozos.push(ev.data); };
  g.onstop = async () => {
    limpiarRelojes();
    if (DIC.stream) { DIC.stream.getTracks().forEach(t => t.stop()); DIC.stream = null; }
    if (!DIC.huboVoz) { DIC.activo = false; dictEstado('No se escuchó nada.'); return; }
    const audio = new Blob(DIC.trozos, { type: g.mimeType || 'audio/webm' });
    dictEstado('Transcribiendo…', true);
    try {
      const texto = await transcribir(audio, clave);
      $('#pPregunta').value = ((DIC.base ? DIC.base + ' ' : '') + texto).trim();
      DIC.activo = false;
      if (texto.trim()) { dictEstado('Preguntando…'); preguntar(); }
      else dictEstado('No se entendió nada.');
    } catch (e) {
      DIC.activo = false;
      dictEstado('No se pudo transcribir: ' + e.message);
    }
  };
  g.start();
  DIC.grabador = g; DIC.activo = true;
  dictEstado(motivo + ' Escuchando: hacé una pausa cuando termines.');
  escucharSilencio(() => detenerDictado());
}

// Acá no hay transcripción en vivo que avise de la pausa, así que se mide la
// energía del micrófono: mientras suene, se reinicia el reloj.
function escucharSilencio(alCerrar) {
  let ctx;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { reprogramarPausa(alCerrar, 15000); return; }
  DIC.ctx = ctx;
  const analizador = ctx.createAnalyser();
  analizador.fftSize = 1024;
  ctx.createMediaStreamSource(DIC.stream).connect(analizador);
  const datos = new Uint8Array(analizador.fftSize);

  reprogramarPausa(alCerrar, ESPERA_INICIAL);
  (function mirar() {
    if (!DIC.activo || DIC.ctx !== ctx) return;
    DIC.vigia = requestAnimationFrame(mirar);
    analizador.getByteTimeDomainData(datos);
    let suma = 0;
    for (let i = 0; i < datos.length; i++) { const v = (datos[i] - 128) / 128; suma += v * v; }
    if (Math.sqrt(suma / datos.length) > UMBRAL_VOZ) {
      DIC.huboVoz = true;
      reprogramarPausa(alCerrar);
    }
  })();
}

function detenerDictado() {
  DIC.activo = false;
  clearTimeout(DIC.reloj); DIC.reloj = null;
  // El reconocimiento se cierra por su propio onend, que es donde el texto
  // final ya está completo; acá sólo se le pide que corte.
  if (DIC.rec) { try { DIC.rec.stop(); } catch (_) {} dictEstado('Cerrando el dictado…'); return; }
  if (DIC.grabador) {
    const g = DIC.grabador; DIC.grabador = null;
    try { g.stop(); } catch (_) {}
    dictEstado('Procesando el audio…', true);
  }
}

async function transcribir(audio, clave) {
  const fd = new FormData();
  fd.append('file', audio, 'pregunta.webm');
  fd.append('model', 'gpt-4o-mini-transcribe');
  fd.append('language', 'es');
  const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
    method: 'POST', headers: { authorization: 'Bearer ' + clave }, body: fd });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  return j.text || '';
}

async function preguntar() {
  const prov = $('#pProv').value;
  const modo = $('#pModo').value;
  const clave = (prov === 'anthropic' ? $('#kAnthropic') : $('#kOpenai')).value.trim();
  const pregunta = $('#pPregunta').value.trim();
  const est = $('#pEstado'), out = $('#pRespuesta');

  if (!clave) { est.textContent = `Falta la clave de ${prov === 'anthropic' ? 'Anthropic' : 'OpenAI'}.`; return; }
  if (!pregunta) { est.textContent = 'Escribí una pregunta.'; return; }

  // La clave del modelo avanzado no se guarda, a propósito.
  if (modo === 'economico') guardarLocal('anubis_clave_' + prov, clave);

  const modelo = MODELOS[prov][modo];
  est.textContent = 'Consultando ' + modelo + '…';
  out.innerHTML = '';
  $('#pEnviar').disabled = true;

  const usuario = 'Datos:\n```json\n' + JSON.stringify(contextoParaModelo()) + '\n```\n\nPregunta: ' + pregunta;

  try {
    const texto = await llamarModelo(prov, modelo, clave, SISTEMA, usuario);
    out.innerHTML = `<div class="respuesta">${formatoTexto(texto)}</div>`;
    est.textContent = 'Respondió ' + modelo + '.';
  } catch (e) {
    est.textContent = '';
    out.innerHTML = errorHTML(e);
  } finally {
    $('#pEnviar').disabled = false;
  }
}
